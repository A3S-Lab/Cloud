name: Box provider conformance

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/box-conformance.yml
      - Cargo.lock
      - Cargo.toml
      - crates/contracts/**
      - crates/control-plane/**
      - crates/node-agent/**
      - tools/box-conformance/**
  pull_request:
    paths:
      - .github/workflows/box-conformance.yml
      - Cargo.lock
      - Cargo.toml
      - crates/contracts/**
      - crates/control-plane/**
      - crates/node-agent/**
      - tools/box-conformance/**
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: box-provider-conformance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  box-certification:
    name: Real A3S Box provider
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      A3S_HOME: /tmp/runtime-conformance-${{ github.run_id }}-${{ github.run_attempt }}
      A3S_BOX_RUNTIME_CONFORMANCE_IMAGE: docker.io/library/busybox@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
      A3S_BOX_RUNTIME_CONFORMANCE_MEDIA_TYPE: application/vnd.oci.image.index.v1+json
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout Cloud
        uses: actions/checkout@v4
        with:
          path: apps/cloud

      - name: Read pinned provider revisions
        id: revisions
        working-directory: apps/cloud
        run: |
          box_revision=$(<tools/box-conformance/box-revision)
          oci_runtime_revision=$(<tools/box-conformance/oci-runtime-revision)
          [[ $box_revision =~ ^[0-9a-f]{40}$ ]]
          [[ $oci_runtime_revision =~ ^[0-9a-f]{40}$ ]]
          grep --fixed-strings \
            "rev = \"$box_revision\"" Cargo.toml
          echo "box=$box_revision" >>"$GITHUB_OUTPUT"
          echo "oci_runtime=$oci_runtime_revision" >>"$GITHUB_OUTPUT"

      - name: Checkout A3S Box
        uses: actions/checkout@v4
        with:
          repository: A3S-Lab/Box
          ref: ${{ steps.revisions.outputs.box }}
          path: crates/box
          submodules: recursive

      - name: Checkout A3S OCI Runtime
        uses: actions/checkout@v4
        with:
          repository: A3S-Lab/OCI-Runtime
          ref: ${{ steps.revisions.outputs.oci_runtime }}
          path: crates/oci-runtime

      - name: Verify exact provider dependency closure
        env:
          BOX_REVISION: ${{ steps.revisions.outputs.box }}
          OCI_RUNTIME_REVISION: ${{ steps.revisions.outputs.oci_runtime }}
        run: |
          test "$(git -C crates/box rev-parse HEAD)" = "$BOX_REVISION"
          test "$(git -C crates/oci-runtime rev-parse HEAD)" = "$OCI_RUNTIME_REVISION"
          grep --fixed-strings \
            "rev = \"$OCI_RUNTIME_REVISION\"" crates/box/src/Cargo.toml
          grep --fixed-strings \
            "?rev=$OCI_RUNTIME_REVISION#$OCI_RUNTIME_REVISION" crates/box/src/Cargo.lock

      - name: Install stable Rust and build dependencies
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: x86_64-unknown-linux-musl

      - name: Install host dependencies and a non-VM libkrun link stub
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential musl-tools protobuf-compiler
          sed -nE \
            's/^[[:space:]]*pub fn (krun_[A-Za-z0-9_]+).*/long \1(void) { return -1; }/p' \
            crates/box/src/deps/libkrun-sys/src/lib.rs \
            | sort -u >"$RUNNER_TEMP/krun-stub.c"
          test -s "$RUNNER_TEMP/krun-stub.c"
          gcc -shared -o "$RUNNER_TEMP/libkrun.so" "$RUNNER_TEMP/krun-stub.c"
          sudo install -m 0755 "$RUNNER_TEMP/libkrun.so" /usr/lib/libkrun.so
          sudo ldconfig
          grep -q '^root:' /etc/subuid || echo 'root:100000:65536' | sudo tee -a /etc/subuid
          grep -q '^root:' /etc/subgid || echo 'root:100000:65536' | sudo tee -a /etc/subgid

      - name: Build the exact Box and OCI Runtime artifacts
        env:
          A3S_DEPS_STUB: "1"
        run: |
          cargo build --manifest-path crates/box/src/Cargo.toml --locked \
            -p a3s-box-cli -p a3s-box-shim -p a3s-box-runtime
          cargo build --manifest-path crates/box/src/Cargo.toml --locked --release \
            -p a3s-box-guest-init --target x86_64-unknown-linux-musl
          cargo build --manifest-path crates/oci-runtime/Cargo.toml --locked --release \
            -p a3s-oci-cli -p a3s-oci-agent

      - name: Install the dedicated Box conformance home
        run: |
          test ! -e "$A3S_HOME"
          runtime_socket="$A3S_HOME/run/a3s-oci/00000000-0000-0000-0000-000000000000/runtime.sock"
          test "${#runtime_socket}" -lt 108
          install -d -m 0755 "$A3S_HOME/bin"
          install -m 0755 crates/box/src/target/debug/a3s-box-shim \
            "$A3S_HOME/bin/a3s-box-shim"
          install -m 0755 \
            crates/box/src/target/x86_64-unknown-linux-musl/release/a3s-box-guest-init \
            "$A3S_HOME/bin/a3s-box-guest-init"
          install -m 0755 crates/oci-runtime/target/release/a3s-oci \
            "$A3S_HOME/bin/a3s-oci"
          install -m 0755 crates/oci-runtime/target/release/a3s-oci-agent \
            "$A3S_HOME/bin/a3s-oci-agent"
          find "$A3S_HOME/bin" -maxdepth 1 -type f -print -exec sha256sum {} \; \
            >"$RUNNER_TEMP/a3s-box-provider-binaries.txt"

      - name: Mount private Runtime Secret tmpfs
        run: |
          sudo install -d -m 0700 "$A3S_HOME/runtime-secrets"
          sudo mount -t tmpfs \
            -o size=16m,uid=0,gid=0,mode=0700,nosuid,nodev,noexec \
            a3s-cloud-runtime-secrets "$A3S_HOME/runtime-secrets"
          mountpoint -q "$A3S_HOME/runtime-secrets"
          test "$(sudo stat -c '%u:%g:%a' "$A3S_HOME/runtime-secrets")" = "0:0:700"

      - name: Cache the pinned public Runtime image over HTTPS
        env:
          A3S_DEPS_STUB: "1"
        run: |
          sudo env \
            PATH="$PATH" \
            HOME="$HOME" \
            A3S_DEPS_STUB="$A3S_DEPS_STUB" \
            A3S_HOME="$A3S_HOME" \
            crates/box/src/target/debug/a3s-box pull \
              "$A3S_BOX_RUNTIME_CONFORMANCE_IMAGE"

      - name: Run every advertised Box Runtime profile
        env:
          A3S_BOX_OCI_AGENT_PATH: ${{ env.A3S_HOME }}/bin/a3s-oci-agent
          A3S_BOX_OCI_RUNTIME_PATH: ${{ env.A3S_HOME }}/bin/a3s-oci
          A3S_BOX_RUNTIME_CONFORMANCE: "1"
          A3S_REGISTRY_PROTOCOL: http
          A3S_DEPS_STUB: "1"
          EVIDENCE_DIR: ${{ runner.temp }}/a3s-box-provider-evidence
        run: |
          install -d -m 0755 "$EVIDENCE_DIR"
          cp "$RUNNER_TEMP/a3s-box-provider-binaries.txt" "$EVIDENCE_DIR/binaries.txt"
          git -C crates/box rev-parse HEAD >"$EVIDENCE_DIR/box.sha"
          git -C crates/oci-runtime rev-parse HEAD >"$EVIDENCE_DIR/oci-runtime.sha"
          cargo_bin=$(command -v cargo)
          cargo_home=${CARGO_HOME:-$(dirname "$(dirname "$cargo_bin")")}
          rustup_home=$(rustup show home)
          set +e
          sudo env \
            PATH="$PATH" \
            HOME="$HOME" \
            CARGO_HOME="$cargo_home" \
            RUSTUP_HOME="$rustup_home" \
            A3S_HOME="$A3S_HOME" \
            A3S_BOX_OCI_AGENT_PATH="$A3S_BOX_OCI_AGENT_PATH" \
            A3S_BOX_OCI_RUNTIME_PATH="$A3S_BOX_OCI_RUNTIME_PATH" \
            A3S_BOX_RUNTIME_CONFORMANCE="$A3S_BOX_RUNTIME_CONFORMANCE" \
            A3S_BOX_RUNTIME_CONFORMANCE_IMAGE="$A3S_BOX_RUNTIME_CONFORMANCE_IMAGE" \
            A3S_BOX_RUNTIME_CONFORMANCE_MEDIA_TYPE="$A3S_BOX_RUNTIME_CONFORMANCE_MEDIA_TYPE" \
            A3S_REGISTRY_PROTOCOL="$A3S_REGISTRY_PROTOCOL" \
            A3S_DEPS_STUB="$A3S_DEPS_STUB" \
            RUST_MIN_STACK=33554432 \
            "$cargo_bin" test --manifest-path crates/box/src/Cargo.toml --locked \
              -p a3s-box-runtime \
              a3s_runtime_driver::conformance_tests::box_runtime_passes_all_advertised_profiles \
              -- --ignored --exact --nocapture --test-threads=1 \
              2>&1 | tee "$EVIDENCE_DIR/conformance.log"
          gate_status=${PIPESTATUS[0]}
          set -e
          exit "$gate_status"

      - name: Prove Cloud recovery, endpoints, health, Claims, cancellation, and interruption cleanup through Box
        env:
          A3S_BOX_OCI_AGENT_PATH: ${{ env.A3S_HOME }}/bin/a3s-oci-agent
          A3S_BOX_OCI_RUNTIME_PATH: ${{ env.A3S_HOME }}/bin/a3s-oci
          A3S_CLOUD_TEST_BOX: "1"
          A3S_DEPS_STUB: "1"
          EVIDENCE_DIR: ${{ runner.temp }}/a3s-box-provider-evidence
        run: |
          install -d -m 0755 "$EVIDENCE_DIR"
          normalize_secret_root() {
            local phase=$1
            local observed
            observed=$(sudo stat -c '%u:%g:%a:%F' "$A3S_HOME/runtime-secrets")
            printf '%s before %s\n' "$phase" "$observed" \
              >>"$EVIDENCE_DIR/secret-root.txt"
            # Independent real-provider processes share this
            # infrastructure-owned mount. Reassert each process boundary;
            # never weaken Box's validation inside the provider.
            sudo chown root:root "$A3S_HOME/runtime-secrets"
            sudo chmod 0700 "$A3S_HOME/runtime-secrets"
            observed=$(sudo stat -c '%u:%g:%a:%F' "$A3S_HOME/runtime-secrets")
            test "$observed" = "0:0:700:directory"
            test "$(findmnt -n -o FSTYPE --target "$A3S_HOME/runtime-secrets")" = "tmpfs"
            printf '%s after %s\n' "$phase" "$observed" \
              >>"$EVIDENCE_DIR/secret-root.txt"
          }
          : >"$EVIDENCE_DIR/secret-root.txt"
          normalize_secret_root cloud-suite
          cargo_bin=$(command -v cargo)
          cargo_home=${CARGO_HOME:-$(dirname "$(dirname "$cargo_bin")")}
          rustup_home=$(rustup show home)
          sudo env \
            PATH="$PATH" \
            HOME="$HOME" \
            CARGO_HOME="$cargo_home" \
            CARGO_TARGET_DIR="$RUNNER_TEMP/cloud-box-target" \
            RUSTUP_HOME="$rustup_home" \
            A3S_HOME="$A3S_HOME" \
            A3S_BOX_OCI_AGENT_PATH="$A3S_BOX_OCI_AGENT_PATH" \
            A3S_BOX_OCI_RUNTIME_PATH="$A3S_BOX_OCI_RUNTIME_PATH" \
            A3S_BOX_RUNTIME_CONFORMANCE_IMAGE="$A3S_BOX_RUNTIME_CONFORMANCE_IMAGE" \
            A3S_BOX_RUNTIME_CONFORMANCE_MEDIA_TYPE="$A3S_BOX_RUNTIME_CONFORMANCE_MEDIA_TYPE" \
            A3S_CLOUD_TEST_BOX="$A3S_CLOUD_TEST_BOX" \
            A3S_DEPS_STUB="$A3S_DEPS_STUB" \
            RUST_MIN_STACK=33554432 \
            "$cargo_bin" test --manifest-path apps/cloud/Cargo.toml --locked \
              -p a3s-cloud-node-agent --test box_lifecycle \
              real_box_recovers_journal_gaps_generation_and_resource_claims \
              -- --ignored --exact --nocapture --test-threads=1 \
              2>&1 | tee "$EVIDENCE_DIR/cloud-lifecycle.log"
          sudo env \
            PATH="$PATH" \
            HOME="$HOME" \
            CARGO_HOME="$cargo_home" \
            CARGO_TARGET_DIR="$RUNNER_TEMP/cloud-box-target" \
            RUSTUP_HOME="$rustup_home" \
            A3S_HOME="$A3S_HOME" \
            A3S_BOX_OCI_AGENT_PATH="$A3S_BOX_OCI_AGENT_PATH" \
            A3S_BOX_OCI_RUNTIME_PATH="$A3S_BOX_OCI_RUNTIME_PATH" \
            A3S_BOX_RUNTIME_CONFORMANCE_IMAGE="$A3S_BOX_RUNTIME_CONFORMANCE_IMAGE" \
            A3S_BOX_RUNTIME_CONFORMANCE_MEDIA_TYPE="$A3S_BOX_RUNTIME_CONFORMANCE_MEDIA_TYPE" \
            A3S_CLOUD_TEST_BOX="$A3S_CLOUD_TEST_BOX" \
            A3S_DEPS_STUB="$A3S_DEPS_STUB" \
            RUST_MIN_STACK=33554432 \
            "$cargo_bin" test --manifest-path apps/cloud/Cargo.toml --locked \
              -p a3s-cloud-control-plane \
              modules::edge::infrastructure::runtime_http_upstream::tests::real_box_health_replays_and_compiles_to_live_gateway_origin \
              -- --ignored --exact --nocapture --test-threads=1 \
              2>&1 | tee "$EVIDENCE_DIR/cloud-service-health.log"
          grep --fixed-strings \
            'A3S_CLOUD_BOX_SERVICE_ENDPOINT_GATEWAY_ORIGIN_CERTIFIED' \
            "$EVIDENCE_DIR/cloud-service-health.log" \
            >"$EVIDENCE_DIR/service-endpoint-certification.txt"
          test "$(wc -l <"$EVIDENCE_DIR/service-endpoint-certification.txt")" -eq 1
          grep --fixed-strings \
            'A3S_CLOUD_BOX_RUNTIME_HEALTH_CONSUMER_CERTIFIED' \
            "$EVIDENCE_DIR/cloud-service-health.log" \
            >"$EVIDENCE_DIR/runtime-health-consumer-certification.txt"
          test "$(wc -l <"$EVIDENCE_DIR/runtime-health-consumer-certification.txt")" -eq 1
          sudo env \
            PATH="$PATH" \
            HOME="$HOME" \
            CARGO_HOME="$cargo_home" \
            CARGO_TARGET_DIR="$RUNNER_TEMP/cloud-box-target" \
            RUSTUP_HOME="$rustup_home" \
            A3S_HOME="$A3S_HOME" \
            A3S_BOX_OCI_AGENT_PATH="$A3S_BOX_OCI_AGENT_PATH" \
            A3S_BOX_OCI_RUNTIME_PATH="$A3S_BOX_OCI_RUNTIME_PATH" \
            A3S_BOX_RUNTIME_CONFORMANCE_IMAGE="$A3S_BOX_RUNTIME_CONFORMANCE_IMAGE" \
            A3S_BOX_RUNTIME_CONFORMANCE_MEDIA_TYPE="$A3S_BOX_RUNTIME_CONFORMANCE_MEDIA_TYPE" \
            A3S_CLOUD_TEST_BOX="$A3S_CLOUD_TEST_BOX" \
            A3S_DEPS_STUB="$A3S_DEPS_STUB" \
            RUST_MIN_STACK=33554432 \
            "$cargo_bin" test --manifest-path apps/cloud/Cargo.toml --locked \
              -p a3s-cloud-control-plane \
              modules::workloads::infrastructure::deployment_flow::tests::box_cancellation::real_box_deployment_cancellation_removes_runtime_before_claim_release \
              -- --ignored --exact --nocapture --test-threads=1 \
              2>&1 | tee "$EVIDENCE_DIR/cloud-cleanup-interruption.log"
          grep --fixed-strings \
            'A3S_CLOUD_BOX_CLEANUP_PROCESS_DEATH_CERTIFIED' \
            "$EVIDENCE_DIR/cloud-cleanup-interruption.log" \
            >"$EVIDENCE_DIR/cleanup-process-death-certification.txt"
          test "$(wc -l <"$EVIDENCE_DIR/cleanup-process-death-certification.txt")" -eq 1
          normalize_secret_root cloud-secret-materialization
          sudo env \
            PATH="$PATH" \
            HOME="$HOME" \
            CARGO_HOME="$cargo_home" \
            CARGO_TARGET_DIR="$RUNNER_TEMP/cloud-box-target" \
            RUSTUP_HOME="$rustup_home" \
            A3S_HOME="$A3S_HOME" \
            A3S_BOX_OCI_AGENT_PATH="$A3S_BOX_OCI_AGENT_PATH" \
            A3S_BOX_OCI_RUNTIME_PATH="$A3S_BOX_OCI_RUNTIME_PATH" \
            A3S_BOX_RUNTIME_CONFORMANCE_IMAGE="$A3S_BOX_RUNTIME_CONFORMANCE_IMAGE" \
            A3S_BOX_RUNTIME_CONFORMANCE_MEDIA_TYPE="$A3S_BOX_RUNTIME_CONFORMANCE_MEDIA_TYPE" \
            A3S_CLOUD_TEST_BOX="$A3S_CLOUD_TEST_BOX" \
            A3S_REGISTRY_PROTOCOL=http \
            A3S_DEPS_STUB="$A3S_DEPS_STUB" \
            RUST_MIN_STACK=33554432 \
            "$cargo_bin" test --manifest-path apps/cloud/Cargo.toml --locked \
              -p a3s-cloud-node-agent --lib \
              box_runtime::tests::real_box_materializes_cloud_secrets_redacts_logs_and_cleans_tmpfs \
              -- --ignored --exact --nocapture --test-threads=1 \
              2>&1 | tee "$EVIDENCE_DIR/cloud-secret-materialization.log"
          grep --fixed-strings \
            'A3S_CLOUD_BOX_SECRET_MATERIALIZATION_CERTIFIED' \
            "$EVIDENCE_DIR/cloud-secret-materialization.log" \
            >"$EVIDENCE_DIR/secret-materialization-certification.txt"
          test "$(wc -l <"$EVIDENCE_DIR/secret-materialization-certification.txt")" -eq 1
          normalize_secret_root cloud-artifact-volume-output
          sudo env \
            PATH="$PATH" \
            HOME="$HOME" \
            CARGO_HOME="$cargo_home" \
            CARGO_TARGET_DIR="$RUNNER_TEMP/cloud-box-target" \
            RUSTUP_HOME="$rustup_home" \
            A3S_HOME="$A3S_HOME" \
            A3S_BOX_OCI_AGENT_PATH="$A3S_BOX_OCI_AGENT_PATH" \
            A3S_BOX_OCI_RUNTIME_PATH="$A3S_BOX_OCI_RUNTIME_PATH" \
            A3S_BOX_RUNTIME_CONFORMANCE_IMAGE="$A3S_BOX_RUNTIME_CONFORMANCE_IMAGE" \
            A3S_BOX_RUNTIME_CONFORMANCE_MEDIA_TYPE="$A3S_BOX_RUNTIME_CONFORMANCE_MEDIA_TYPE" \
            A3S_CLOUD_TEST_BOX="$A3S_CLOUD_TEST_BOX" \
            A3S_DEPS_STUB="$A3S_DEPS_STUB" \
            RUST_MIN_STACK=33554432 \
            "$cargo_bin" test --manifest-path apps/cloud/Cargo.toml --locked \
              -p a3s-cloud-node-agent --lib \
              box_runtime::tests::artifact_storage::real_box_materializes_artifacts_volumes_tmpfs_and_publishes_outputs \
              -- --ignored --exact --nocapture --test-threads=1 \
              2>&1 | tee "$EVIDENCE_DIR/cloud-artifact-volume-output.log"
          grep --fixed-strings \
            'A3S_CLOUD_BOX_ARTIFACT_VOLUME_OUTPUT_CERTIFIED' \
            "$EVIDENCE_DIR/cloud-artifact-volume-output.log" \
            >"$EVIDENCE_DIR/artifact-volume-output-certification.txt"
          test "$(wc -l <"$EVIDENCE_DIR/artifact-volume-output-certification.txt")" -eq 1

      - name: Verify provider cleanup
        if: always()
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/a3s-box-provider-evidence
        run: |
          cleanup_status=0
          install -d -m 0755 "$EVIDENCE_DIR"
          ps aux >"$EVIDENCE_DIR/processes-after.txt"
          sudo find "$A3S_HOME" -maxdepth 4 -print \
            >"$EVIDENCE_DIR/home-after.txt" 2>&1 || true
          if pgrep -fa 'a3s-box-shim|a3s-oci-agent|a3s-oci.*native-linux-service' \
            >"$EVIDENCE_DIR/leaked-processes.txt"; then
            cat "$EVIDENCE_DIR/leaked-processes.txt"
            cleanup_status=1
          fi
          if test -e "$A3S_HOME/boxes.json"; then
            sudo cp "$A3S_HOME/boxes.json" "$EVIDENCE_DIR/boxes-after.json"
            if ! jq -e 'type == "array" and length == 0' \
              "$EVIDENCE_DIR/boxes-after.json" >/dev/null; then
              cleanup_status=1
            fi
          fi
          if test -n "$(sudo find "$A3S_HOME/boxes" -mindepth 1 -print -quit 2>/dev/null)"; then
            sudo find "$A3S_HOME/boxes" -mindepth 1 -maxdepth 2 -print \
              >"$EVIDENCE_DIR/leaked-box-paths.txt"
            cleanup_status=1
          fi
          if test -d "$A3S_HOME/runtime-state"; then
            cleanup_status=1
          fi
          if test -e "$A3S_HOME/volumes.json"; then
            sudo cp "$A3S_HOME/volumes.json" "$EVIDENCE_DIR/volumes-after.json"
            if ! jq -e \
              'type == "object" and (.volumes | type == "object") and (.volumes | length == 0)' \
              "$EVIDENCE_DIR/volumes-after.json" >/dev/null; then
              cleanup_status=1
            fi
          fi
          if test -n "$(sudo find "$A3S_HOME/volumes" -mindepth 1 -print -quit 2>/dev/null)"; then
            sudo find "$A3S_HOME/volumes" -mindepth 1 -maxdepth 2 -print \
              >"$EVIDENCE_DIR/leaked-volume-paths.txt"
            cleanup_status=1
          fi
          if test -n "$(sudo find "$A3S_HOME/runtime-secrets" -mindepth 1 -print -quit 2>/dev/null)"; then
            sudo find "$A3S_HOME/runtime-secrets" -mindepth 1 -maxdepth 2 -print \
              >"$EVIDENCE_DIR/leaked-secret-paths.txt"
            cleanup_status=1
          fi
          if mountpoint -q "$A3S_HOME/runtime-secrets"; then
            sudo umount "$A3S_HOME/runtime-secrets" || cleanup_status=1
          fi
          sudo rm -rf "$A3S_HOME"
          exit "$cleanup_status"

      - name: Upload Box certification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: box-provider-conformance-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/a3s-box-provider-evidence
          if-no-files-found: error
          retention-days: 30
