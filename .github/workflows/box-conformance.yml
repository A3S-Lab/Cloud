              postgres_build_flow_survives_process_death_at_every_fleet_completion_boundary \
              -- --exact --nocapture --test-threads=1 \
              2>&1 | tee "$A3S_CLOUD_TEST_G0_EVIDENCE_DIR/fleet-flow-process-death.log"
          grep --fixed-strings \
            'A3S_CLOUD_G0_FLEET_FLOW_PROCESS_DEATH_CERTIFIED boundaries=9 sigkills=9 commands=5 status=succeeded store=postgresql ' \
            "$A3S_CLOUD_TEST_G0_EVIDENCE_DIR/fleet-flow-process-death.log" \
            >"$A3S_CLOUD_TEST_G0_EVIDENCE_DIR/fleet-flow-process-death-certification.txt"
          test "$(wc -l <"$A3S_CLOUD_TEST_G0_EVIDENCE_DIR/fleet-flow-process-death-certification.txt")" -eq 1
          jq -n \
            --arg cloud "$cloud_revision" \
            --arg box "$A3S_CLOUD_TEST_BOX_REVISION" \
            --rawfile certification "$A3S_CLOUD_TEST_G0_EVIDENCE_DIR/fleet-flow-process-death-certification.txt" \
            '{
              schema: "a3s.cloud.g0-fleet-flow-process-death-evidence.v1",
              cloudRevision: $cloud,
              boxRevision: $box,
              postgresqlMajor: 17,
              postgresImage: "postgres:17.5-bookworm@sha256:fbcea1bd13b6a882cd6caa6b58db3ae5c102efe50ec625b3e2a5cbc50db5bfe4",
              boundaryCount: 9,
              sigkillCount: 9,
              fleetCommandCount: 5,
              certification: ($certification | rtrimstr("\n")),
              checks: {
                durableFlowHistory: true,
                durableFleetCommands: true,
                durableBuildRun: true,
                exactCommandReplay: true,
                monotonicCommandSequence: true,
                exactOncePreparation: true,
                exactOnceValidation: true,
                exactOncePublication: true,
                exactOnceEvidence: true,
                exactOnceCleanup: true
              }
            }' >"$A3S_CLOUD_TEST_G0_EVIDENCE_DIR/fleet-flow-process-death.json"
          jq -e \
            --arg cloud "$cloud_revision" \
            --arg box "$A3S_CLOUD_TEST_BOX_REVISION" \
            '.schema == "a3s.cloud.g0-fleet-flow-process-death-evidence.v1"
             and .cloudRevision == $cloud
             and .boxRevision == $box
             and .postgresqlMajor == 17
             and .postgresImage == "postgres:17.5-bookworm@sha256:fbcea1bd13b6a882cd6caa6b58db3ae5c102efe50ec625b3e2a5cbc50db5bfe4"
             and .boundaryCount == 9
             and .sigkillCount == 9
             and .fleetCommandCount == 5
             and ([.checks[]] | all)' \
            "$A3S_CLOUD_TEST_G0_EVIDENCE_DIR/fleet-flow-process-death.json" >/dev/null

      - name: Certify Box-native build replay, parent cache, and cleanup
        env:
          A3S_CLOUD_TEST_G0_BOX_BUILD: "1"
          A3S_CLOUD_TEST_G0_BOX_BUILD_ALLOW_CACHE_RESET: "1"
          A3S_CLOUD_TEST_G0_EVIDENCE_DIR: ${{ runner.temp }}/a3s-box-provider-evidence
          A3S_CLOUD_TEST_BOX_REVISION: ${{ steps.revisions.outputs.box }}
          A3S_DEPS_STUB: "1"
        run: |
          test ! -e "$A3S_HOME/cloud-g0-box-build-conformance"
          cargo_bin=$(command -v cargo)
          cargo_home=${CARGO_HOME:-$(dirname "$(dirname "$cargo_bin")")}
          rustup_home=$(rustup show home)
          cloud_revision=$(git -C apps/cloud rev-parse HEAD)
          sudo env \
            PATH="$PATH" \
            HOME="$HOME" \
            CARGO_HOME="$cargo_home" \
            CARGO_TARGET_DIR="$RUNNER_TEMP/cloud-box-target" \
            RUSTUP_HOME="$rustup_home" \
            A3S_HOME="$A3S_HOME" \
            A3S_CLOUD_TEST_G0_BOX_BUILD="$A3S_CLOUD_TEST_G0_BOX_BUILD" \
            A3S_CLOUD_TEST_G0_BOX_BUILD_ALLOW_CACHE_RESET="$A3S_CLOUD_TEST_G0_BOX_BUILD_ALLOW_CACHE_RESET" \
            A3S_CLOUD_TEST_G0_EVIDENCE_DIR="$A3S_CLOUD_TEST_G0_EVIDENCE_DIR" \
            A3S_CLOUD_TEST_CLOUD_REVISION="$cloud_revision" \
            A3S_CLOUD_TEST_BOX_REVISION="$A3S_CLOUD_TEST_BOX_REVISION" \
            A3S_DEPS_STUB="$A3S_DEPS_STUB" \
            RUST_MIN_STACK=33554432 \
            "$cargo_bin" test --manifest-path apps/cloud/Cargo.toml --locked \
              -p a3s-cloud-node-agent --lib \
              box_build::tests::real_box_native_build_replays_after_process_death_reuses_parent_cache_and_cleans \
              -- --ignored --exact --nocapture --test-threads=1 \
              2>&1 | tee "$A3S_CLOUD_TEST_G0_EVIDENCE_DIR/cloud-box-build.log"
          grep --fixed-strings \
            'A3S_CLOUD_G0_BOX_BUILD_CERTIFIED' \
            "$A3S_CLOUD_TEST_G0_EVIDENCE_DIR/cloud-box-build.log" \
            >"$A3S_CLOUD_TEST_G0_EVIDENCE_DIR/box-build-certification.txt"
          test "$(wc -l <"$A3S_CLOUD_TEST_G0_EVIDENCE_DIR/box-build-certification.txt")" -eq 1
          jq -e \
            --arg cloud "$cloud_revision" \
            --arg box "$A3S_CLOUD_TEST_BOX_REVISION" \
            '.schema == "a3s.cloud.g0-box-build-provider-evidence.v1"
             and .cloudRevision == $cloud
             and .boxRevision == $box
             and ([.checks[]] | all)' \
            "$A3S_CLOUD_TEST_G0_EVIDENCE_DIR/box-build-provider.json" >/dev/null

      - name: Verify provider cleanup
        if: always()
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/a3s-box-provider-evidence
        run: |
          cleanup_status=0
          install -d -m 0755 "$EVIDENCE_DIR"
          ps aux >"$EVIDENCE_DIR/processes-after.txt"
          sudo find "$A3S_HOME" -maxdepth 4 -print \
            >"$EVIDENCE_DIR/home-after.txt" 2>&1 || true
          if pgrep -fa 'a3s-box-shim|a3s-oci-agent|a3s-oci.*native-linux-service|a3s-gateway' \
            >"$EVIDENCE_DIR/leaked-processes.txt"; then
            cat "$EVIDENCE_DIR/leaked-processes.txt"
            cleanup_status=1
          fi
          if test -e "$A3S_HOME/boxes.json"; then
            sudo cp "$A3S_HOME/boxes.json" "$EVIDENCE_DIR/boxes-after.json"
            if ! jq -e 'type == "array" and length == 0' \
              "$EVIDENCE_DIR/boxes-after.json" >/dev/null; then
              cleanup_status=1
            fi
          fi
          if test -n "$(sudo find "$A3S_HOME/boxes" -mindepth 1 -print -quit 2>/dev/null)"; then
            sudo find "$A3S_HOME/boxes" -mindepth 1 -maxdepth 2 -print \
              >"$EVIDENCE_DIR/leaked-box-paths.txt"
            cleanup_status=1
          fi
          if test -d "$A3S_HOME/runtime-state"; then
            cleanup_status=1
          fi
          if test -e "$A3S_HOME/volumes.json"; then
            sudo cp "$A3S_HOME/volumes.json" "$EVIDENCE_DIR/volumes-after.json"
            if ! jq -e \
              'type == "object" and (.volumes | type == "object") and (.volumes | length == 0)' \
              "$EVIDENCE_DIR/volumes-after.json" >/dev/null; then
              cleanup_status=1
            fi
          fi
          if test -n "$(sudo find "$A3S_HOME/volumes" -mindepth 1 -print -quit 2>/dev/null)"; then
            sudo find "$A3S_HOME/volumes" -mindepth 1 -maxdepth 2 -print \
              >"$EVIDENCE_DIR/leaked-volume-paths.txt"
            cleanup_status=1
          fi
          if test -n "$(sudo find "$A3S_HOME/runtime-secrets" -mindepth 1 -print -quit 2>/dev/null)"; then
            sudo find "$A3S_HOME/runtime-secrets" -mindepth 1 -maxdepth 2 -print \
              >"$EVIDENCE_DIR/leaked-secret-paths.txt"
            cleanup_status=1
          fi
          if test -n "$(sudo find "$A3S_HOME/images/build-receipts/sha256" \
              -mindepth 1 \
              \( -name '*.json' -o -name '*.workspace' -o -name '*.cache' \) \
              -print -quit 2>/dev/null)"; then
            sudo find "$A3S_HOME/images/build-receipts/sha256" -mindepth 1 -maxdepth 2 -print \
              >"$EVIDENCE_DIR/leaked-build-operation-paths.txt"
            cleanup_status=1
          fi
          if test -e "$A3S_HOME/cloud-g0-box-build-conformance"; then
            sudo find "$A3S_HOME/cloud-g0-box-build-conformance" -maxdepth 4 -print \
              >"$EVIDENCE_DIR/leaked-cloud-build-test-paths.txt"
            cleanup_status=1
          fi
          if mountpoint -q "$A3S_HOME/runtime-secrets"; then
            sudo umount "$A3S_HOME/runtime-secrets" || cleanup_status=1
          fi
          sudo rm -rf "$A3S_HOME"
          exit "$cleanup_status"

      - name: Upload Box certification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.evidence_artifact_prefix || 'box-provider-conformance' }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/a3s-box-provider-evidence
          if-no-files-found: error
          retention-days: 30
