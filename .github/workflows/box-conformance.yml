name: Box provider conformance

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/box-conformance.yml
      - .github/workflows/cell-bundle-publication-conformance.yml
      - Cargo.lock
      - Cargo.toml
      - contracts/cell0.3/**
      - contracts/cell0.5/**
      - contracts/s0.1/**
      - crates/contracts/**
      - crates/control-plane/**
      - crates/node-agent/**
      - tools/box-conformance/**
      - tools/cell-conformance/**
  pull_request:
    paths:
      - .github/workflows/box-conformance.yml
      - .github/workflows/cell-bundle-publication-conformance.yml
      - Cargo.lock
      - Cargo.toml
      - contracts/cell0.3/**
      - contracts/cell0.5/**
      - contracts/s0.1/**
      - crates/contracts/**
      - crates/control-plane/**
      - crates/node-agent/**
      - tools/box-conformance/**
      - tools/cell-conformance/**
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
  workflow_call:
    inputs:
      run_cell_bundle_publication:
        description: Run the credentialed CELL0.5 publication, behavior, and Gateway gate
        required: false
        default: false
        type: boolean
      evidence_artifact_prefix:
        description: Retained evidence artifact name prefix
        required: false
        default: box-provider-conformance
        type: string
    secrets:
      S0_S3_ENDPOINT:
        required: false
      S0_S3_REGION:
        required: false
      S0_S3_BUCKET:
        required: false
      S0_S3_ACCESS_KEY_ID:
        required: false
      S0_S3_SECRET_ACCESS_KEY:
        required: false
      S0_S3_SESSION_TOKEN:
        required: false

permissions:
  attestations: read
  contents: read
  packages: read

concurrency:
  group: box-provider-conformance-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Retained hardware-backed evidence must finish while newer revisions wait.
  cancel-in-progress: false

jobs:
  box-certification:
    name: Real A3S Box provider
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17.5-bookworm@sha256:fbcea1bd13b6a882cd6caa6b58db3ae5c102efe50ec625b3e2a5cbc50db5bfe4
        env:
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: a3s-cloud-conformance
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      registry:
        image: registry:2.8.3@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
        ports:
          - 5000:5000
    env:
      A3S_HOME: /tmp/runtime-conformance-${{ github.run_id }}-${{ github.run_attempt }}
      A3S_BOX_RUNTIME_CONFORMANCE_IMAGE: docker.io/library/busybox@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
      A3S_BOX_RUNTIME_CONFORMANCE_MEDIA_TYPE: application/vnd.oci.image.index.v1+json
      A3S_CLOUD_A0_4_AGENT_BASE_IMAGE: ubuntu@sha256:1e0a86e57d247923571b75e0aaf48a1449cf8c543d51fb3e07a4a7d7bfa79316
      A3S_CLOUD_A0_4_CLI_ARCHIVE_DIGEST: sha256:f41a71f073e7bc901db5c38d382b600d6f23a64a09705eeecc25590bbde5fd53
      A3S_CLOUD_A0_4_CLI_ARCHIVE_URL: https://github.com/A3S-Lab/CLI/releases/download/v0.13.5/a3s-v0.13.5-x86_64-unknown-linux-gnu.tar.gz
      A3S_CLOUD_A0_4_CLI_REVISION: d48efa67922e82c15c5f7fd059c860d327cc6dd8
      A3S_CLOUD_A0_4_CLI_TAG: v0.13.5
      A3S_CLOUD_A0_4_CLI_VERSION: 0.13.5
      A3S_CLOUD_A0_4_REGISTRY_IMAGE: registry:2.8.3@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout Cloud
        uses: actions/checkout@v4
        with:
          path: apps/cloud

      - name: Read pinned provider revisions
        id: revisions
        working-directory: apps/cloud
        run: |
          box_revision=$(<tools/box-conformance/box-revision)
          oci_runtime_revision=$(<tools/box-conformance/oci-runtime-revision)
          gateway_revision=$(<tools/gateway-conformance/gateway-revision)
          [[ $box_revision =~ ^[0-9a-f]{40}$ ]]
          [[ $oci_runtime_revision =~ ^[0-9a-f]{40}$ ]]
          [[ $gateway_revision =~ ^[0-9a-f]{40}$ ]]
          grep --fixed-strings \
            "rev = \"$box_revision\"" Cargo.toml
          echo "box=$box_revision" >>"$GITHUB_OUTPUT"
          echo "oci_runtime=$oci_runtime_revision" >>"$GITHUB_OUTPUT"
          echo "gateway=$gateway_revision" >>"$GITHUB_OUTPUT"

      - name: Checkout A3S Box
        uses: actions/checkout@v4
        with:
          repository: A3S-Lab/Box
          ref: ${{ steps.revisions.outputs.box }}
          path: crates/box
          submodules: recursive

      - name: Checkout A3S OCI Runtime
        uses: actions/checkout@v4
        with:
          repository: A3S-Lab/OCI-Runtime
          ref: ${{ steps.revisions.outputs.oci_runtime }}
          path: crates/oci-runtime

      - name: Checkout A3S Gateway for the joint Durable Cell gate
        if: ${{ inputs.run_cell_bundle_publication == true }}
        uses: actions/checkout@v4
        with:
          repository: A3S-Lab/Gateway
          ref: ${{ steps.revisions.outputs.gateway }}
          path: crates/gateway

      - name: Verify exact provider dependency closure
        env:
          BOX_REVISION: ${{ steps.revisions.outputs.box }}
          OCI_RUNTIME_REVISION: ${{ steps.revisions.outputs.oci_runtime }}
        run: |
          test "$(git -C crates/box rev-parse HEAD)" = "$BOX_REVISION"
          test "$(git -C crates/oci-runtime rev-parse HEAD)" = "$OCI_RUNTIME_REVISION"
          grep --fixed-strings \
            "rev = \"$OCI_RUNTIME_REVISION\"" crates/box/src/Cargo.toml
          grep --fixed-strings \
            "?rev=$OCI_RUNTIME_REVISION#$OCI_RUNTIME_REVISION" crates/box/src/Cargo.lock

      - name: Verify the exact Gateway revision for the joint Durable Cell gate
        if: ${{ inputs.run_cell_bundle_publication == true }}
        env:
          GATEWAY_REVISION: ${{ steps.revisions.outputs.gateway }}
        run: |
          test "$(git -C crates/gateway rev-parse HEAD)" = "$GATEWAY_REVISION"

      - name: Install stable Rust and build dependencies
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: x86_64-unknown-linux-musl

      - name: Install host dependencies and a non-VM libkrun link stub
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential musl-tools protobuf-compiler
          sed -nE \
            's/^[[:space:]]*pub fn (krun_[A-Za-z0-9_]+).*/long \1(void) { return -1; }/p' \
            crates/box/src/deps/libkrun-sys/src/lib.rs \
            | sort -u >"$RUNNER_TEMP/krun-stub.c"
          test -s "$RUNNER_TEMP/krun-stub.c"
          gcc -shared -o "$RUNNER_TEMP/libkrun.so" "$RUNNER_TEMP/krun-stub.c"
          sudo install -m 0755 "$RUNNER_TEMP/libkrun.so" /usr/lib/libkrun.so
          sudo ldconfig
          grep -q '^root:' /etc/subuid || echo 'root:100000:65536' | sudo tee -a /etc/subuid
          grep -q '^root:' /etc/subgid || echo 'root:100000:65536' | sudo tee -a /etc/subgid

      - name: Build the exact Box and OCI Runtime artifacts
        env:
          A3S_DEPS_STUB: "1"
        run: |
          cargo build --manifest-path crates/box/src/Cargo.toml --locked \
            -p a3s-box-cli -p a3s-box-shim -p a3s-box-runtime
          cargo build --manifest-path crates/box/src/Cargo.toml --locked --release \
            -p a3s-box-guest-init --target x86_64-unknown-linux-musl
          cargo build --manifest-path crates/oci-runtime/Cargo.toml --locked --release \
            -p a3s-oci-cli -p a3s-oci-agent
          cargo build --manifest-path apps/cloud/Cargo.toml --locked --release \
            -p a3s-cloud-contracts --example reference_echo_provider \
            --target x86_64-unknown-linux-musl
          test -x \
            apps/cloud/target/x86_64-unknown-linux-musl/release/examples/reference_echo_provider

      - name: Build the pinned A3S Gateway for the joint Durable Cell gate
        if: ${{ inputs.run_cell_bundle_publication == true }}
        run: |
          cargo build --manifest-path crates/gateway/Cargo.toml \
            --release --locked --bin a3s-gateway

      - name: Install the dedicated Box conformance home
        run: |
          test ! -e "$A3S_HOME"
          runtime_socket="$A3S_HOME/run/a3s-oci/00000000-0000-0000-0000-000000000000/runtime.sock"
          test "${#runtime_socket}" -lt 108
          install -d -m 0755 "$A3S_HOME/bin"
          install -m 0755 crates/box/src/target/debug/a3s-box-shim \
            "$A3S_HOME/bin/a3s-box-shim"
          install -m 0755 \
            crates/box/src/target/x86_64-unknown-linux-musl/release/a3s-box-guest-init \
            "$A3S_HOME/bin/a3s-box-guest-init"
          install -m 0755 crates/oci-runtime/target/release/a3s-oci \
            "$A3S_HOME/bin/a3s-oci"
          install -m 0755 crates/oci-runtime/target/release/a3s-oci-agent \
            "$A3S_HOME/bin/a3s-oci-agent"
          find "$A3S_HOME/bin" -maxdepth 1 -type f -print -exec sha256sum {} \; \
            >"$RUNNER_TEMP/a3s-box-provider-binaries.txt"

      - name: Mount private Runtime Secret tmpfs
        run: |
          sudo install -d -m 0700 "$A3S_HOME/runtime-secrets"
          sudo mount -t tmpfs \
            -o size=16m,uid=0,gid=0,mode=0700,nosuid,nodev,noexec \
            a3s-cloud-runtime-secrets "$A3S_HOME/runtime-secrets"
          mountpoint -q "$A3S_HOME/runtime-secrets"
          test "$(sudo stat -c '%u:%g:%a' "$A3S_HOME/runtime-secrets")" = "0:0:700"

      - name: Build and publish the exact A3S Agent Runtime image through Box
        run: |
          registry_api=http://127.0.0.1:5000/v2
          repository=a3s/a0-4-agent-runtime
          mutable_image=127.0.0.1:5000/$repository:$A3S_CLOUD_A0_4_CLI_TAG
          build_dir="$RUNNER_TEMP/a0-4-agent-runtime-build"
          install -d -m 0755 "$build_dir"
          curl --fail --silent --show-error --location --retry 5 \
            "$A3S_CLOUD_A0_4_CLI_ARCHIVE_URL" \
            --output "$build_dir/a3s-cli.tar.gz"
          test "sha256:$(sha256sum "$build_dir/a3s-cli.tar.gz" | cut -d' ' -f1)" = \
            "$A3S_CLOUD_A0_4_CLI_ARCHIVE_DIGEST"
          tar --extract --gzip --file "$build_dir/a3s-cli.tar.gz" \
            --directory "$build_dir" a3s
          test "$("$build_dir/a3s" --version)" = "a3s $A3S_CLOUD_A0_4_CLI_VERSION"
          curl --fail --silent --show-error --location --retry 5 \
            "https://raw.githubusercontent.com/A3S-Lab/CLI/$A3S_CLOUD_A0_4_CLI_REVISION/Cargo.toml" \
            --output "$RUNNER_TEMP/a0-4-agent-runtime-cli-Cargo.toml"
          grep --fixed-strings \
            'a3s-code-core = "=8.0.4"' \
            "$RUNNER_TEMP/a0-4-agent-runtime-cli-Cargo.toml"
          grep --fixed-strings \
            'a3s-code-core = { version = "=8.0.4"' \
            apps/cloud/Cargo.toml
          cp apps/cloud/tools/box-conformance/agent-runtime/config.acl \
            "$build_dir/config.acl"
          cp apps/cloud/tools/box-conformance/agent-runtime/Containerfile \
            "$build_dir/Containerfile"
          workspace_dir="$build_dir/workspace"
          install -d -m 0755 "$workspace_dir"
          printf 'A3S Cloud A0.4 Agent Runtime fixture\n' >"$workspace_dir/.a3s-release-seed"
          git -C "$workspace_dir" init --initial-branch=main
          git -C "$workspace_dir" config user.name 'A3S Cloud Release Fixture'
          git -C "$workspace_dir" config user.email 'release-fixture@a3s.invalid'
          git -C "$workspace_dir" add .a3s-release-seed
          GIT_AUTHOR_DATE='2000-01-01T00:00:00Z' \
            GIT_COMMITTER_DATE='2000-01-01T00:00:00Z' \
            git -C "$workspace_dir" commit --message 'Initialize Agent workspace'
          workspace_commit=$(git -C "$workspace_dir" rev-parse HEAD)
          [[ $workspace_commit =~ ^[0-9a-f]{40}$ ]]
          test -z "$(git -C "$workspace_dir" status --porcelain)"
          curl --fail --silent --show-error --retry 30 --retry-connrefused \
            "$registry_api/" >/dev/null
          box_binary=crates/box/src/target/debug/a3s-box
          test -x "$box_binary"
          box_build_stdout="$RUNNER_TEMP/a0-4-agent-runtime-box-build.stdout"
          box_build_stderr="$RUNNER_TEMP/a0-4-agent-runtime-box-build.stderr"
          echo "Box binary: $(readlink -f "$box_binary")"
          stat --printf='Box binary size=%s mode=%a\n' "$box_binary"
          sudo -n true
          df -h "$RUNNER_TEMP" "$A3S_HOME" || true
          free -h || true
          set +e
          sudo env \
            PATH="$PATH" \
            HOME="$HOME" \
            A3S_DEPS_STUB=1 \
            A3S_HOME="$A3S_HOME" \
            "$box_binary" build \
              --build-arg "A3S_CLI_VERSION=$A3S_CLOUD_A0_4_CLI_VERSION" \
              --build-arg "A3S_CLI_REVISION=$A3S_CLOUD_A0_4_CLI_REVISION" \
              --build-arg "A3S_CLI_ARCHIVE_SHA256=$A3S_CLOUD_A0_4_CLI_ARCHIVE_DIGEST" \
              --file Containerfile \
              --platform linux/amd64 \
              --quiet \
              --tag "$mutable_image" \
              "$build_dir" \
              >"$box_build_stdout" \
              2>"$box_build_stderr"
          box_build_status=$?
          set -e
          echo "Box build exit status: $box_build_status"
          if (( box_build_status != 0 )); then
            echo "::group::Box build stdout"
            sed -n '1,240p' "$box_build_stdout" || true
            echo "::endgroup::"
            echo "::group::Box build stderr"
            sed -n '1,320p' "$box_build_stderr" || true
            echo "::endgroup::"
            echo "::group::Host resource diagnostics"
            free -h || true
            df -h "$RUNNER_TEMP" "$A3S_HOME" || true
            ps -eo pid,ppid,stat,%cpu,%mem,rss,cmd --sort=-rss | sed -n '1,40p' || true
            echo "::endgroup::"
            exit "$box_build_status"
          fi
          # Box keeps stdout quiet for progress, but the pinned CLI may still
          # emit an informational line before the final digest.  Extract only
          # a complete digest and compare it with the registry descriptor below.
          built_digest=$(tr -d '\r' <"$box_build_stdout" \
            | grep --extended-regexp --only-matching \
              'sha256:[0-9a-f]{64}' \
            | tail -n 1 || true)
          echo "Box build digest: ${built_digest:-<missing>}"
          if [[ ! $built_digest =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::group::Unexpected Box build output"
            sed -n '1,240p' "$box_build_stdout" || true
            sed -n '1,320p' "$box_build_stderr" || true
            echo "::endgroup::"
            exit 1
          fi
          sudo env \
            PATH="$PATH" \
            HOME="$HOME" \
            A3S_DEPS_STUB=1 \
            A3S_HOME="$A3S_HOME" \
            "$box_binary" image-inspect "$mutable_image" \
            >"$RUNNER_TEMP/a0-4-agent-runtime-box-image-inspect.json"
          if ! jq -e --arg digest "$built_digest" \
            'type == "array"
             and length == 1
             and .[0].Digest == $digest' \
            "$RUNNER_TEMP/a0-4-agent-runtime-box-image-inspect.json" >/dev/null; then
            echo "::group::Unexpected Box image-inspect output"
            sed -n '1,240p' \
              "$RUNNER_TEMP/a0-4-agent-runtime-box-image-inspect.json" || true
            echo "expected digest: $built_digest"
            echo "::endgroup::"
            exit 1
          fi
          push_result=$(sudo env \
            PATH="$PATH" \
            HOME="$HOME" \
            A3S_DEPS_STUB=1 \
            A3S_HOME="$A3S_HOME" \
            "$box_binary" push --plain-http --quiet "$mutable_image")
          test -n "$push_result"
          agent_media_type=application/vnd.oci.image.manifest.v1+json
          curl --fail --silent --show-error --location --retry 5 \
            --dump-header "$RUNNER_TEMP/a0-4-agent-runtime-manifest.headers" \
            --header "Accept: $agent_media_type" \
            "$registry_api/$repository/manifests/$A3S_CLOUD_A0_4_CLI_TAG" \
            --output "$RUNNER_TEMP/a0-4-agent-runtime-manifest.json"
          response_media_type=$(awk -F ': *' \
            'tolower($1) == "content-type" { gsub("\r", "", $2); print $2 }' \
            "$RUNNER_TEMP/a0-4-agent-runtime-manifest.headers" | tail -n 1)
          test "$response_media_type" = "$agent_media_type"
          test "$(jq -r '.mediaType' "$RUNNER_TEMP/a0-4-agent-runtime-manifest.json")" = \
            "$agent_media_type"
          agent_digest="sha256:$(sha256sum "$RUNNER_TEMP/a0-4-agent-runtime-manifest.json" | cut -d' ' -f1)"
          header_digest=$(awk -F ': *' \
            'tolower($1) == "docker-content-digest" { gsub("\r", "", $2); print $2 }' \
            "$RUNNER_TEMP/a0-4-agent-runtime-manifest.headers" | tail -n 1)
          test "$header_digest" = "$agent_digest"
          test "$built_digest" = "$agent_digest"
          agent_size=$(wc -c <"$RUNNER_TEMP/a0-4-agent-runtime-manifest.json")
          test "$agent_size" -gt 0
          config_digest=$(jq -er '.config.digest' \
            "$RUNNER_TEMP/a0-4-agent-runtime-manifest.json")
          [[ $config_digest =~ ^sha256:[0-9a-f]{64}$ ]]
          curl --fail --silent --show-error --location --retry 5 \
            "$registry_api/$repository/blobs/$config_digest" \
            --output "$RUNNER_TEMP/a0-4-agent-runtime-config.json"
          test "sha256:$(sha256sum "$RUNNER_TEMP/a0-4-agent-runtime-config.json" | cut -d' ' -f1)" = \
            "$config_digest"
          jq -e \
            --arg version "$A3S_CLOUD_A0_4_CLI_VERSION" \
            --arg revision "$A3S_CLOUD_A0_4_CLI_REVISION" \
            --arg archive "$A3S_CLOUD_A0_4_CLI_ARCHIVE_DIGEST" \
            '.architecture == "amd64"
             and .os == "linux"
             and .config.Labels["org.opencontainers.image.version"] == $version
             and .config.Labels["org.opencontainers.image.revision"] == $revision
             and .config.Labels["dev.a3s.cli-archive-sha256"] == $archive
             and .config.Entrypoint == ["/usr/bin/a3s", "code", "harness", "--manifest", "/app/.a3s/asset.acl"]' \
            "$RUNNER_TEMP/a0-4-agent-runtime-config.json" >/dev/null
          exact_image=127.0.0.1:5000/$repository@$agent_digest
          jq -n \
            --arg cliTag "$A3S_CLOUD_A0_4_CLI_TAG" \
            --arg cliRevision "$A3S_CLOUD_A0_4_CLI_REVISION" \
            --arg cliArchiveUrl "$A3S_CLOUD_A0_4_CLI_ARCHIVE_URL" \
            --arg cliArchiveDigest "$A3S_CLOUD_A0_4_CLI_ARCHIVE_DIGEST" \
            --arg cliManifestDigest "sha256:$(sha256sum "$RUNNER_TEMP/a0-4-agent-runtime-cli-Cargo.toml" | cut -d' ' -f1)" \
            --arg baseImage "$A3S_CLOUD_A0_4_AGENT_BASE_IMAGE" \
            --arg registryImage "$A3S_CLOUD_A0_4_REGISTRY_IMAGE" \
            --arg boxRevision "$(<apps/cloud/tools/box-conformance/box-revision)" \
            --arg workspaceCommit "$workspace_commit" \
            --arg containerfileDigest "sha256:$(sha256sum "$build_dir/Containerfile" | cut -d' ' -f1)" \
            --arg configDigest "sha256:$(sha256sum "$build_dir/config.acl" | cut -d' ' -f1)" \
            --arg exactImage "$exact_image" \
            '{
              cliTag: $cliTag,
              cliRevision: $cliRevision,
              cliArchiveUrl: $cliArchiveUrl,
              cliArchiveDigest: $cliArchiveDigest,
              cliManifestDigest: $cliManifestDigest,
              baseImage: $baseImage,
              registryImage: $registryImage,
              builder: { name: "a3s-box", revision: $boxRevision },
              workspaceCommit: $workspaceCommit,
              containerfileDigest: $containerfileDigest,
              configDigest: $configDigest,
              exactImage: $exactImage
            }' >"$RUNNER_TEMP/a0-4-agent-runtime-build-inputs.json"
          {
            echo "A3S_CLOUD_A0_4_AGENT_RUNTIME_IMAGE=$exact_image"
            echo "A3S_CLOUD_A0_4_AGENT_RUNTIME_MEDIA_TYPE=$agent_media_type"
            echo "A3S_CLOUD_A0_4_AGENT_RUNTIME_SIZE_BYTES=$agent_size"
          } >>"$GITHUB_ENV"

      - name: Cache the exact Runtime images through Box
        env:
          A3S_DEPS_STUB: "1"
        run: |
          sudo env \
            PATH="$PATH" \
            HOME="$HOME" \
            A3S_DEPS_STUB="$A3S_DEPS_STUB" \
            A3S_HOME="$A3S_HOME" \
            crates/box/src/target/debug/a3s-box pull \
              "$A3S_BOX_RUNTIME_CONFORMANCE_IMAGE"
          sudo env \
            PATH="$PATH" \
            HOME="$HOME" \
            A3S_DEPS_STUB="$A3S_DEPS_STUB" \
            A3S_HOME="$A3S_HOME" \
            A3S_REGISTRY_PROTOCOL=http \
            crates/box/src/target/debug/a3s-box pull \
              "$A3S_CLOUD_A0_4_AGENT_RUNTIME_IMAGE"

      - name: Run every advertised Box Runtime profile
        env:
          A3S_BOX_OCI_AGENT_PATH: ${{ env.A3S_HOME }}/bin/a3s-oci-agent
          A3S_BOX_OCI_RUNTIME_PATH: ${{ env.A3S_HOME }}/bin/a3s-oci
          A3S_BOX_RUNTIME_CONFORMANCE: "1"
          A3S_REGISTRY_PROTOCOL: http
          A3S_DEPS_STUB: "1"
          EVIDENCE_DIR: ${{ runner.temp }}/a3s-box-provider-evidence
        run: |
          install -d -m 0755 "$EVIDENCE_DIR"
          cp "$RUNNER_TEMP/a3s-box-provider-binaries.txt" "$EVIDENCE_DIR/binaries.txt"
          git -C crates/box rev-parse HEAD >"$EVIDENCE_DIR/box.sha"
          git -C crates/oci-runtime rev-parse HEAD >"$EVIDENCE_DIR/oci-runtime.sha"
          cargo_bin=$(command -v cargo)
          cargo_home=${CARGO_HOME:-$(dirname "$(dirname "$cargo_bin")")}
          rustup_home=$(rustup show home)
          set +e
          sudo env \
            PATH="$PATH" \
            HOME="$HOME" \
            CARGO_HOME="$cargo_home" \
