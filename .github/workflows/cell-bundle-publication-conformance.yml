name: Durable Cell bundle publication conformance

on:
  workflow_dispatch:

permissions:
  attestations: read
  contents: read
  packages: read

jobs:
  require-main:
    name: Require the protected main branch
    runs-on: ubuntu-24.04
    steps:
      - name: Reject non-main dispatches before credentials are delegated
        run: test "$GITHUB_REF" = refs/heads/main

  bundle-publication:
    name: Real celld publication through Box and S0
    needs: require-main
    uses: ./.github/workflows/box-conformance.yml
    with:
      run_cell_bundle_publication: true
      evidence_artifact_prefix: cell0.5-bundle-publication
    secrets:
      S0_S3_ENDPOINT: ${{ secrets.S0_S3_ENDPOINT }}
      S0_S3_REGION: ${{ secrets.S0_S3_REGION }}
      S0_S3_BUCKET: ${{ secrets.S0_S3_BUCKET }}
      S0_S3_ACCESS_KEY_ID: ${{ secrets.S0_S3_ACCESS_KEY_ID }}
      S0_S3_SECRET_ACCESS_KEY: ${{ secrets.S0_S3_SECRET_ACCESS_KEY }}
      S0_S3_SESSION_TOKEN: ${{ secrets.S0_S3_SESSION_TOKEN }}
