name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  replica-set-postgres:
    name: H0 replica-set PostgreSQL
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      A3S_CLOUD_TEST_POSTGRES_URL: postgresql://postgres:a3s-cloud-conformance@127.0.0.1:5432/postgres
      RUST_MIN_STACK: 33554432
    services:
      postgres:
        image: postgres:17.5-bookworm@sha256:fbcea1bd13b6a882cd6caa6b58db3ae5c102efe50ec625b3e2a5cbc50db5bfe4
        env:
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: a3s-cloud-conformance
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        shell: bash
        working-directory: apps/cloud
    steps:
      - name: Checkout Cloud
        uses: actions/checkout@v4
        with:
          path: apps/cloud

      - name: Install Rust 1.88.0
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.88.0

      - name: Migrate and verify stable replica sets
        run: >-
          cargo test --locked -p a3s-cloud-control-plane
          --test postgres_integration
          postgres_replica_set_foundation_is_migrated_atomic_and_replay_safe
          -- --exact --nocapture --test-threads=1

      - name: Certify Resource Grant cross-surface authorization
        run: >-
          cargo test --locked -p a3s-cloud-control-plane
          --test postgres_integration
          postgres_resource_grants_enforce_the_cross_surface_authorization_matrix
          -- --exact --nocapture --test-threads=1

      - name: Certify membership invitation persistence
        run: >-
          cargo test --locked -p a3s-cloud-control-plane
          --test postgres_integration
          postgres_membership_invitations_are_atomic_exact_and_immutable
          -- --exact --nocapture --test-threads=1

      - name: Certify external OIDC identity persistence
        run: >-
          cargo test --locked -p a3s-cloud-control-plane
          --test postgres_integration
          postgres_external_oidc_identity_is_exact_replay_safe_and_immutable
          -- --exact --nocapture --test-threads=1

      - name: Certify tenant audit query persistence
        run: >-
          cargo test --locked -p a3s-cloud-control-plane
          --test postgres_integration
          postgres_audit_query_is_tenant_scoped_filtered_and_keyset_paginated
          -- --exact --nocapture --test-threads=1

      - name: Certify Workflow finite Execution persistence
        run: >-
          cargo test --locked -p a3s-cloud-control-plane
          --test postgres_integration
          postgres_workflow_execution_binding_is_atomic_tenant_scoped_and_immutable
          -- --exact --nocapture --test-threads=1

      - name: Certify Workflow finite Execution process-death recovery
        run: >-
          cargo test --locked -p a3s-cloud-control-plane
          --test postgres_integration
          postgres_workflow_run_survives_api_and_worker_process_death
          -- --exact --nocapture --test-threads=1

  plugin-registry-postgres:
    name: U0 registry PostgreSQL
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17.5-bookworm@sha256:fbcea1bd13b6a882cd6caa6b58db3ae5c102efe50ec625b3e2a5cbc50db5bfe4
        env:
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: a3s-cloud-conformance
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        shell: bash
        working-directory: apps/cloud
    steps:
      - name: Checkout Cloud
        uses: actions/checkout@v4
        with:
          path: apps/cloud

      - name: Install Rust 1.88.0
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.88.0

      - name: Certify transactional Plugin Registry persistence
        env:
          A3S_CLOUD_TEST_POSTGRES_URL: postgresql://postgres:a3s-cloud-conformance@127.0.0.1:5432/postgres
          RUST_MIN_STACK: 33554432
        run: >-
          bash tools/use-conformance/run_postgres_registry_gate.sh
          "$RUNNER_TEMP/a3s-cloud-u0-postgres-evidence"

      - name: Upload Plugin Registry PostgreSQL evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: u0-plugin-registry-postgres-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/a3s-cloud-u0-postgres-evidence
          if-no-files-found: error
          retention-days: 30

  rust:
    name: Rust ${{ matrix.toolchain }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        toolchain:
          - 1.88.0
          - stable
    defaults:
      run:
        shell: bash
        working-directory: apps/cloud
    steps:
      - name: Checkout Cloud
        uses: actions/checkout@v4
        with:
          path: apps/cloud

      - name: Read pinned Runtime revision
        id: runtime_revision
        run: |
          revision=$(<tools/runtime-conformance/runtime-revision)
          [[ $revision =~ ^[0-9a-f]{40}$ ]]
          echo "revision=$revision" >>"$GITHUB_OUTPUT"

      - name: Checkout Runtime
        uses: actions/checkout@v4
        with:
          repository: A3S-Lab/Runtime
          ref: ${{ steps.runtime_revision.outputs.revision }}
          path: crates/runtime

      - name: Install Rust ${{ matrix.toolchain }}
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy,rustfmt

      - name: Validate locked metadata
        run: cargo metadata --locked --no-deps --format-version 1

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run tests
        run: cargo test --workspace --all-targets --locked

      - name: Verify the real A3S Use Registry provider
        if: matrix.toolchain == 'stable'
        run: |
          bash tools/use-conformance/run_registry_gate.sh \
            "$RUNNER_TEMP/a3s-cloud-u0-provider-evidence"

      - name: Upload A3S Use Registry provider evidence
        if: always() && matrix.toolchain == 'stable'
        uses: actions/upload-artifact@v4
        with:
          name: u0-use-registry-provider-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/a3s-cloud-u0-provider-evidence
          if-no-files-found: error
          retention-days: 30

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked

  github-source-resolution:
    name: GitHub source resolution
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
        working-directory: apps/cloud
    steps:
      - name: Checkout Cloud
        uses: actions/checkout@v4
        with:
          path: apps/cloud

      - name: Read pinned Runtime revision
        id: runtime_revision
        run: |
          revision=$(<tools/runtime-conformance/runtime-revision)
          [[ $revision =~ ^[0-9a-f]{40}$ ]]
          echo "revision=$revision" >>"$GITHUB_OUTPUT"

      - name: Checkout Runtime
        uses: actions/checkout@v4
        with:
          repository: A3S-Lab/Runtime
          ref: ${{ steps.runtime_revision.outputs.revision }}
          path: crates/runtime

      - name: Install Rust 1.88.0
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.88.0

      - name: Resolve a public branch and confirm its pinned commit
        run: |
          cargo test -p a3s-cloud-control-plane --lib --locked \
            modules::sources::infrastructure::github_source_resolver::tests::real_github_resolves_a_public_branch_then_confirms_the_pinned_commit \
            -- --ignored --exact --nocapture --test-threads=1

      - name: Materialize the resolved commit through the secure checkout boundary
        run: |
          cargo test -p a3s-cloud-control-plane --lib --locked \
            modules::sources::infrastructure::git_source_checkout::tests::real_github_checkout_materializes_the_resolved_commit_without_git_metadata \
            -- --ignored --exact --nocapture --test-threads=1


  gateway-managed-tls:
    name: Gateway managed TLS
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
        working-directory: apps/cloud
    steps:
      - name: Checkout Cloud
        uses: actions/checkout@v4
        with:
          path: apps/cloud

      - name: Read pinned Runtime revision
        id: runtime_revision
        run: |
          revision=$(<tools/runtime-conformance/runtime-revision)
          [[ $revision =~ ^[0-9a-f]{40}$ ]]
          echo "revision=$revision" >>"$GITHUB_OUTPUT"

      - name: Read pinned Gateway revision
        id: gateway_revision
        run: |
          revision=$(<tools/gateway-conformance/gateway-revision)
          [[ $revision =~ ^[0-9a-f]{40}$ ]]
          echo "revision=$revision" >>"$GITHUB_OUTPUT"

      - name: Checkout Runtime
        uses: actions/checkout@v4
        with:
          repository: A3S-Lab/Runtime
          ref: ${{ steps.runtime_revision.outputs.revision }}
          path: crates/runtime

      - name: Checkout Gateway
        uses: actions/checkout@v4
        with:
          repository: A3S-Lab/Gateway
          ref: ${{ steps.gateway_revision.outputs.revision }}
          path: crates/gateway

      - name: Install stable Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Build pinned A3S Gateway
        run: |
          cargo build --manifest-path ../../crates/gateway/Cargo.toml \
            --release --locked --bin a3s-gateway

      - name: Validate Cloud-compiled target identity with pinned Gateway
        run: |
          A3S_CLOUD_TEST_GATEWAY_BIN="$GITHUB_WORKSPACE/crates/gateway/target/release/a3s-gateway" \
            cargo test -p a3s-cloud-control-plane --lib --locked \
              modules::edge::infrastructure::gateway_snapshot_compiler::contract_tests::installed_gateway_validates_compiled_snapshot \
              -- --exact --nocapture

      - name: Serve and recover exact Gateway snapshots
        run: |
          A3S_CLOUD_TEST_GATEWAY_BIN="$GITHUB_WORKSPACE/crates/gateway/target/release/a3s-gateway" \
            cargo test -p a3s-cloud-node-agent --lib --locked \
              gateway::remote_tests::installed_a3s_gateway_validates_and_reloads_complete_snapshots \
              -- --ignored --exact --nocapture --test-threads=1

      - name: Rotate managed Gateway TLS and target generation
        run: |
          A3S_CLOUD_TEST_GATEWAY_BIN="$GITHUB_WORKSPACE/crates/gateway/target/release/a3s-gateway" \
            cargo test -p a3s-cloud-node-agent --lib --locked \
              gateway::remote_tests::installed_a3s_gateway_rotates_managed_tls_and_target_generation \
              -- --ignored --exact --nocapture --test-threads=1

      - name: Recover replicated Gateway member loss
        run: |
          A3S_CLOUD_TEST_GATEWAY_BIN="$GITHUB_WORKSPACE/crates/gateway/target/release/a3s-gateway" \
            cargo test -p a3s-cloud-node-agent --lib --locked \
              gateway::remote_tests::replicated_gateway_tests::installed_a3s_gateways_converge_independently_and_recover_member_loss \
              -- --ignored --exact --nocapture --test-threads=1

      - name: Recover Gateway apply before acknowledgement
        run: |
          A3S_CLOUD_TEST_GATEWAY_BIN="$GITHUB_WORKSPACE/crates/gateway/target/release/a3s-gateway" \
            cargo test -p a3s-cloud-node-agent --lib --locked \
              gateway::reload_crash_tests::installed_a3s_gateway_recovers_native_apply_after_agent_process_death \
              -- --ignored --exact --nocapture --test-threads=1


  repository-policy:
    name: Repository policy
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
        working-directory: apps/cloud
    steps:
      - name: Checkout Cloud
        uses: actions/checkout@v4
        with:
          path: apps/cloud
          fetch-depth: 0

      - name: Validate shell syntax
        run: |
          bash -n tools/box-conformance/install_box_release.sh
          bash -n tools/c0-conformance/run_cross_surface_gate.sh
          bash -n tools/dev/run_cloud.sh
          bash -n tools/dev/test_run_cloud.sh
          bash -n tools/use-conformance/run_postgres_registry_gate.sh
          bash -n tools/use-conformance/run_registry_gate.sh

      - name: Test REST contract compatibility checker
        run: python3 -m unittest discover -s tools/api-contract -p 'test_*.py'

      - name: Enforce REST v1 compatibility against the PR base
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          baseline="$RUNNER_TEMP/a3s-cloud-openapi-v1-base.json"
          if git cat-file -e "$BASE_SHA:openapi/v1.json" 2>/dev/null; then
            git show "$BASE_SHA:openapi/v1.json" >"$baseline"
            python3 tools/api-contract/check_contract.py "$baseline" openapi/v1.json
          fi

      - name: Enforce ACL-only product configuration
        run: |
          forbidden_files=$(git ls-files README.md cli config contracts crates deploy docs packages tools web |
            grep -E '\.(hcl|tf|tfvars)$' || true)
          if [[ -n $forbidden_files ]]; then
            printf '%s\n' "$forbidden_files"
            exit 1
          fi
          if git grep -I -n -i -E \
            '(^|[^[:alnum:]_])HCL([^[:alnum:]_]|$)|\.hcl([^[:alnum:]_]|$)' -- \
            README.md cli config contracts crates deploy docs packages tools web; then
            exit 1
          fi

      - name: Verify the AI application parity manifest
        run: >-
          cargo test --locked -p a3s-cloud-contracts
          --test app_platform_parity_manifest

      - name: Enforce A3S ORM as the relational persistence authority
        run: |
          direct_driver='sqlx|tokio-postgres|deadpool-postgres|postgres|diesel|sea-orm'
          direct_import='sqlx|tokio_postgres|deadpool_postgres|postgres|diesel|sea_orm'
          if git grep -I -n -E \
            "^[[:space:]]*($direct_driver)[[:space:]]*=" -- '**/Cargo.toml'; then
            exit 1
          fi
          if git grep -I -n -E \
            "package[[:space:]]*=[[:space:]]*\"($direct_driver)\"" -- '**/Cargo.toml'; then
            exit 1
          fi
          if git grep -I -n -E \
            "^[[:space:]]*(use|extern[[:space:]]+crate)[[:space:]]+($direct_import)(::|[[:space:]]|;)" -- \
            'crates/**/*.rs'; then
            exit 1
          fi

      - name: Enforce Box-only runtime and automation paths
        run: |
          removed_provider='do'"cker"
          removed_builder='build'"kit"
          removed_client='boll'"ard"
          forbidden_paths=$(git ls-files \
            .github justfile deploy tools/box-conformance tools/c0-conformance \
            tools/dev tools/g0-conformance tools/runtime-conformance |
            grep -E -i "(^|/)($removed_provider|$removed_builder|$removed_client)([^/]*)(/|$)" || true)
          if [[ -n $forbidden_paths ]]; then
            printf '%s\n' "$forbidden_paths"
            exit 1
          fi
          removed_runtime_pattern="(^|[;&|[:space:]])$removed_provider([[:space:]]|$)|/var/run/$removed_provider\\.sock|$removed_client|$removed_builder"
          if git grep -I -n -E "$removed_runtime_pattern" -- \
            .github justfile deploy tools/box-conformance tools/c0-conformance \
            tools/dev tools/g0-conformance tools/runtime-conformance; then
            exit 1
          fi

      - name: Enforce one Cloud build-execution authority
        run: |
          removed_builder='build'"kit"
          removed_client='boll'"ard"
          duplicate_api='I'"BuildService|BuildkitBuildService|OciBuildRequest|BuiltOciArtifact|BuildServiceError|RuntimeBuildOutputValidator|RuntimeBuildEvidenceGenerator|ValidatedBuildCache|BuildCacheValidator"
          forbidden_paths=$(git ls-files crates/control-plane/src/modules/artifacts |
            grep -E "(^|/)(build_service|build_cache_validator|${removed_builder}_output|runtime_build_output_validator|task_spec|journal|scheduler)(\\.rs|/)|(^|/)runtime_gate(/|$)|(^|/)${removed_builder}([^/]*)(/|$)" || true)
          if [[ -n $forbidden_paths ]]; then
            printf '%s\n' "$forbidden_paths"
            exit 1
          fi
          if git grep -I -n -E "$duplicate_api|$removed_builder|$removed_client" -- \
            crates/control-plane/src/modules/artifacts; then
            exit 1
          fi
          local_executors=$(git grep -I -l -E \
            '(^|[^[:alnum:]_])(std|tokio)::process|Command::new[[:space:]]*\\(' \
            -- crates/control-plane/src/modules/artifacts || true)
          if [[ -n $local_executors ]]; then
            printf '%s\n' "$local_executors"
            exit 1
          fi
          unexpected_commands=$(git grep -I -h -o -E \
            'NodeCommandPayload::[A-Za-z0-9_]+' \
            -- crates/control-plane/src/modules/artifacts |
            grep -v -E '^NodeCommandPayload::BoxBuild(Start|Inspect|Cancel|Remove)$' || true)
          if [[ -n $unexpected_commands ]]; then
            printf '%s\n' "$unexpected_commands"
            exit 1
          fi
          for command in BoxBuildStart BoxBuildInspect BoxBuildCancel BoxBuildRemove; do
            if ! git grep -I -q "NodeCommandPayload::$command" -- \
              crates/control-plane/src/modules/artifacts/infrastructure/build_flow; then
              echo "missing sole Box build command: $command"
              exit 1
            fi
          done

  client-cli:
    name: TypeScript client and CLI
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout Cloud
        uses: actions/checkout@v4
        with:
          path: apps/cloud

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install client dependencies
        working-directory: apps/cloud/packages/cloud-client
        run: bun install --frozen-lockfile

      - name: Validate typed client
        working-directory: apps/cloud/packages/cloud-client
        run: |
          bun run typecheck
          bun run format:check
          bun run lint:check
          bun run test

      - name: Install CLI dependencies
        working-directory: apps/cloud/cli
        run: bun install --frozen-lockfile

      - name: Validate CLI
        working-directory: apps/cloud/cli
        run: |
          bun run typecheck
          bun run format:check
          bun run lint:check
          bun run test
          bun run build

      - name: Verify compiled non-secret context
        working-directory: apps/cloud/cli
        run: |
          output=$(A3S_CLOUD_TOKEN=a3s_ci_never_print \
            ./dist/a3s-cloud context show --output=json)
          grep -F '"tokenConfigured": true' <<<"$output"
          if grep -F 'a3s_ci_never_print' <<<"$output"; then
            exit 1
          fi

  c0-cross-surface:
    name: C0.1 cross-surface
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
        working-directory: apps/cloud
    steps:
      - name: Checkout Cloud
        uses: actions/checkout@v4
        with:
          path: apps/cloud

      - name: Read pinned Runtime revision
        id: runtime_revision
        run: |
          revision=$(<tools/runtime-conformance/runtime-revision)
          [[ $revision =~ ^[0-9a-f]{40}$ ]]
          echo "revision=$revision" >>"$GITHUB_OUTPUT"

      - name: Checkout Runtime
        uses: actions/checkout@v4
        with:
          repository: A3S-Lab/Runtime
          ref: ${{ steps.runtime_revision.outputs.revision }}
          path: crates/runtime

      - name: Install Rust 1.88.0
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.88.0

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install exact-revision A3S Box fixture runtime
        run: |
          tools/box-conformance/install_box_release.sh "$RUNNER_TEMP/a3s-box"
          echo "$RUNNER_TEMP/a3s-box" >>"$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/a3s-box/lib" >>"$GITHUB_ENV"
          echo "A3S_BOX_OCI_RUNTIME_PATH=$RUNNER_TEMP/a3s-box/a3s-oci" >>"$GITHUB_ENV"
          echo "A3S_BOX_OCI_AGENT_PATH=$RUNNER_TEMP/a3s-box/a3s-oci-agent" >>"$GITHUB_ENV"
          echo "A3S_CLOUD_BOX_REVISION=$(<"$RUNNER_TEMP/a3s-box/BOX-REVISION")" >>"$GITHUB_ENV"
          grep -q '^root:' /etc/subuid || echo 'root:100000:65536' | sudo tee -a /etc/subuid
          grep -q '^root:' /etc/subgid || echo 'root:100000:65536' | sudo tee -a /etc/subgid

      - name: Run real REST, Web-client, CLI, and PostgreSQL gate
        env:
          A3S_CLOUD_BOX_BIN: ${{ runner.temp }}/a3s-box/a3s-box
          A3S_CLOUD_BOX_RUN_AS_ROOT: "true"
        run: tools/c0-conformance/run_cross_surface_gate.sh "$RUNNER_TEMP/a3s-cloud-c0-evidence"

      - name: Upload sanitized C0.1 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c0-cross-surface-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/a3s-cloud-c0-evidence
          if-no-files-found: warn
          retention-days: 14

  c0-management-mcp:
    name: C0.2 management MCP
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
        working-directory: apps/cloud
    steps:
      - name: Checkout Cloud
        uses: actions/checkout@v4
        with:
          path: apps/cloud

      - name: Read pinned Runtime revision
        id: runtime_revision
        run: |
          revision=$(<tools/runtime-conformance/runtime-revision)
          [[ $revision =~ ^[0-9a-f]{40}$ ]]
          echo "revision=$revision" >>"$GITHUB_OUTPUT"

      - name: Checkout Runtime
        uses: actions/checkout@v4
        with:
          repository: A3S-Lab/Runtime
          ref: ${{ steps.runtime_revision.outputs.revision }}
          path: crates/runtime

      - name: Install Rust 1.88.0
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.88.0

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install exact-revision A3S Box fixture runtime
        run: |
          tools/box-conformance/install_box_release.sh "$RUNNER_TEMP/a3s-box"
          echo "$RUNNER_TEMP/a3s-box" >>"$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/a3s-box/lib" >>"$GITHUB_ENV"
          echo "A3S_BOX_OCI_RUNTIME_PATH=$RUNNER_TEMP/a3s-box/a3s-oci" >>"$GITHUB_ENV"
          echo "A3S_BOX_OCI_AGENT_PATH=$RUNNER_TEMP/a3s-box/a3s-oci-agent" >>"$GITHUB_ENV"
          echo "A3S_CLOUD_BOX_REVISION=$(<"$RUNNER_TEMP/a3s-box/BOX-REVISION")" >>"$GITHUB_ENV"
          grep -q '^root:' /etc/subuid || echo 'root:100000:65536' | sudo tee -a /etc/subuid
          grep -q '^root:' /etc/subgid || echo 'root:100000:65536' | sudo tee -a /etc/subgid

      - name: Run real REST, management MCP, A3S ORM, and PostgreSQL gate
        env:
          A3S_CLOUD_BOX_BIN: ${{ runner.temp }}/a3s-box/a3s-box
          A3S_CLOUD_BOX_RUN_AS_ROOT: "true"
        run: |
          tools/c0-conformance/run_cross_surface_gate.sh \
            "$RUNNER_TEMP/a3s-cloud-c0-mcp-evidence" management-mcp

      - name: Upload sanitized C0.2 MCP evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c0-management-mcp-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/a3s-cloud-c0-mcp-evidence
          if-no-files-found: warn
          retention-days: 14

  web:
    name: Web
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
        working-directory: apps/cloud/web
    steps:
      - name: Checkout Cloud
        uses: actions/checkout@v4
        with:
          path: apps/cloud

      - name: Read pinned Runtime revision
        id: runtime_revision
        run: |
          revision=$(<../tools/runtime-conformance/runtime-revision)
          [[ $revision =~ ^[0-9a-f]{40}$ ]]
          echo "revision=$revision" >>"$GITHUB_OUTPUT"

      - name: Checkout Runtime
        uses: actions/checkout@v4
        with:
          repository: A3S-Lab/Runtime
          ref: ${{ steps.runtime_revision.outputs.revision }}
          path: crates/runtime

      - name: Install Rust 1.88.0
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.88.0

      - name: Install Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            cache_dir="$RUNNER_TEMP/a3s-cloud-bun-cache-$attempt"
            rm -rf node_modules "$cache_dir"
            install_args=(
              --frozen-lockfile
              --backend=copyfile
              --cache-dir="$cache_dir"
              --network-concurrency=8
            )
            if [[ $attempt -eq 3 ]]; then
              install_args+=(--force --no-cache)
            fi
            if timeout --signal=TERM --kill-after=10s 180s \
              bun install "${install_args[@]}"; then
              rm -rf "$cache_dir"
              break
            fi
            [[ $attempt -lt 3 ]] || exit 1
            rm -rf node_modules "$cache_dir"
            sleep $((attempt * 5))
          done

      - name: Typecheck
        run: bun run typecheck

      - name: Check formatting
        run: bun run format:check

      - name: Lint
        run: bun run lint:check

      - name: Test
        run: bun run test

      - name: Verify development process supervision
        run: ../tools/dev/test_run_cloud.sh

      - name: Build
        run: bun run build

      - name: Verify production SPA delivery
        run: ../tools/web/verify_spa_delivery.sh
