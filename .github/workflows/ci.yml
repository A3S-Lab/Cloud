          ref: ${{ steps.gateway_revision.outputs.revision }}
          path: crates/gateway

      - name: Install stable Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Build pinned A3S Gateway
        run: |
          cargo build --manifest-path ../../crates/gateway/Cargo.toml \
            --release --locked --bin a3s-gateway

      - name: Validate Cloud-compiled target identity with pinned Gateway
        run: |
          A3S_CLOUD_TEST_GATEWAY_BIN="$GITHUB_WORKSPACE/crates/gateway/target/release/a3s-gateway" \
            cargo test -p a3s-cloud-control-plane --lib --locked \
              modules::edge::infrastructure::gateway_snapshot_compiler::contract_tests::installed_gateway_validates_compiled_snapshot \
              -- --exact --nocapture

      - name: Serve and recover exact Gateway snapshots
        run: |
          A3S_CLOUD_TEST_GATEWAY_BIN="$GITHUB_WORKSPACE/crates/gateway/target/release/a3s-gateway" \
            cargo test -p a3s-cloud-node-agent --lib --locked \
              gateway::remote_tests::installed_a3s_gateway_validates_and_reloads_complete_snapshots \
              -- --ignored --exact --nocapture --test-threads=1

      - name: Rotate managed Gateway TLS and target generation
        run: |
          A3S_CLOUD_TEST_GATEWAY_BIN="$GITHUB_WORKSPACE/crates/gateway/target/release/a3s-gateway" \
            cargo test -p a3s-cloud-node-agent --lib --locked \
              gateway::remote_tests::installed_a3s_gateway_rotates_managed_tls_and_target_generation \
              -- --ignored --exact --nocapture --test-threads=1

      - name: Recover replicated Gateway member loss
        run: |
          A3S_CLOUD_TEST_GATEWAY_BIN="$GITHUB_WORKSPACE/crates/gateway/target/release/a3s-gateway" \
            cargo test -p a3s-cloud-node-agent --lib --locked \
              gateway::remote_tests::replicated_gateway_tests::installed_a3s_gateways_converge_independently_and_recover_member_loss \
              -- --ignored --exact --nocapture --test-threads=1

      - name: Recover Gateway apply before acknowledgement
        run: |
          A3S_CLOUD_TEST_GATEWAY_BIN="$GITHUB_WORKSPACE/crates/gateway/target/release/a3s-gateway" \
            cargo test -p a3s-cloud-node-agent --lib --locked \
              gateway::reload_crash_tests::installed_a3s_gateway_recovers_native_apply_after_agent_process_death \
              -- --ignored --exact --nocapture --test-threads=1


  repository-policy:
    name: Repository policy
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
        working-directory: apps/cloud
    steps:
      - name: Checkout Cloud
        uses: actions/checkout@v4
        with:
          path: apps/cloud
          fetch-depth: 0

      - name: Validate shell syntax
        run: |
          bash -n tools/box-conformance/install_box_release.sh
          bash -n tools/cell-conformance/verify_celld_release.sh
          bash -n tools/c0-conformance/run_cross_surface_gate.sh
          bash -n tools/dev/run_cloud.sh
          bash -n tools/use-conformance/run_postgres_registry_gate.sh
          bash -n tools/use-conformance/run_registry_gate.sh

      - name: Test REST contract compatibility checker
        run: python3 -m unittest discover -s tools/api-contract -p 'test_*.py'

      - name: Enforce REST v1 compatibility against the PR base
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          baseline="$RUNNER_TEMP/a3s-cloud-openapi-v1-base.json"
          if git cat-file -e "$BASE_SHA:openapi/v1.json" 2>/dev/null; then
            git show "$BASE_SHA:openapi/v1.json" >"$baseline"
            python3 tools/api-contract/check_contract.py "$baseline" openapi/v1.json
          fi

      - name: Enforce ACL-only product configuration
        run: |
          forbidden_files=$(git ls-files README.md cli config contracts crates deploy docs packages tools |
            grep -E '\.(hcl|tf|tfvars)$' || true)
          if [[ -n $forbidden_files ]]; then
            printf '%s\n' "$forbidden_files"
            exit 1
          fi
          if git grep -I -n -i -E \
            '(^|[^[:alnum:]_])HCL([^[:alnum:]_]|$)|\.hcl([^[:alnum:]_]|$)' -- \
            README.md cli config contracts crates deploy docs packages tools; then
            exit 1
          fi

      - name: Enforce the backend-only source boundary
        run: |
          forbidden_paths=$(git ls-files |
            grep -E '^(web/|website/|architecture-3d/|crates/web-server/|deploy/web/|tools/web/|\.github/workflows/cloud-pages\.yml$)' || true)
          forbidden_ui_sources=$(git ls-files |
            grep -E '\.(tsx|jsx|css|html|vue|svelte)$' || true)
          if [[ -n $forbidden_paths || -n $forbidden_ui_sources ]]; then
            printf '%s\n' "$forbidden_paths" "$forbidden_ui_sources" | sed '/^$/d'
            exit 1
          fi

      - name: Verify the AI application parity manifest
        run: >-
          cargo test --locked -p a3s-cloud-contracts
          --test app_platform_parity_manifest

      - name: Enforce A3S ORM as the relational persistence authority
        run: |
          direct_driver='sqlx|tokio-postgres|deadpool-postgres|postgres|diesel|sea-orm'
          direct_import='sqlx|tokio_postgres|deadpool_postgres|postgres|diesel|sea_orm'
          if git grep -I -n -E \
            "^[[:space:]]*($direct_driver)[[:space:]]*=" -- '**/Cargo.toml'; then
            exit 1
          fi
          if git grep -I -n -E \
            "package[[:space:]]*=[[:space:]]*\"($direct_driver)\"" -- '**/Cargo.toml'; then
            exit 1
          fi
          if git grep -I -n -E \
            "^[[:space:]]*(use|extern[[:space:]]+crate)[[:space:]]+($direct_import)(::|[[:space:]]|;)" -- \
            'crates/**/*.rs'; then
            exit 1
          fi

      - name: Enforce Box-only runtime and automation paths
        run: |
          removed_provider='do'"cker"
          removed_builder='build'"kit"
          removed_client='boll'"ard"
          forbidden_paths=$(git ls-files \
            .github justfile deploy tools/box-conformance tools/c0-conformance \
            tools/cell-conformance tools/dev tools/g0-conformance tools/runtime-conformance |
            grep -E -i "(^|/)($removed_provider|$removed_builder|$removed_client)([^/]*)(/|$)" || true)
          if [[ -n $forbidden_paths ]]; then
            printf '%s\n' "$forbidden_paths"
            exit 1
          fi
          removed_runtime_pattern="(^|[;&|[:space:]])$removed_provider([[:space:]]|$)|/var/run/$removed_provider\\.sock|$removed_client|$removed_builder"
          if git grep -I -n -E "$removed_runtime_pattern" -- \
            .github justfile deploy tools/box-conformance tools/c0-conformance \
            tools/cell-conformance tools/dev tools/g0-conformance tools/runtime-conformance; then
            exit 1
          fi

      - name: Enforce one Cloud build-execution authority
        run: |
          removed_builder='build'"kit"
          removed_client='boll'"ard"
          duplicate_api='I'"BuildService|BuildkitBuildService|OciBuildRequest|BuiltOciArtifact|BuildServiceError|RuntimeBuildOutputValidator|RuntimeBuildEvidenceGenerator|ValidatedBuildCache|BuildCacheValidator"
          forbidden_paths=$(git ls-files crates/control-plane/src/modules/artifacts |
            grep -E "(^|/)(build_service|build_cache_validator|${removed_builder}_output|runtime_build_output_validator|task_spec|journal|scheduler)(\\.rs|/)|(^|/)runtime_gate(/|$)|(^|/)${removed_builder}([^/]*)(/|$)" || true)
          if [[ -n $forbidden_paths ]]; then
            printf '%s\n' "$forbidden_paths"
            exit 1
          fi
          if git grep -I -n -E "$duplicate_api|$removed_builder|$removed_client" -- \
            crates/control-plane/src/modules/artifacts; then
            exit 1
          fi
          local_executors=$(git grep -I -l -E \
            '(^|[^[:alnum:]_])(std|tokio)::process|Command::new[[:space:]]*\\(' \
            -- crates/control-plane/src/modules/artifacts || true)
          if [[ -n $local_executors ]]; then
            printf '%s\n' "$local_executors"
            exit 1
          fi
          unexpected_commands=$(git grep -I -h -o -E \
            'NodeCommandPayload::[A-Za-z0-9_]+' \
            -- crates/control-plane/src/modules/artifacts |
            grep -v -E '^NodeCommandPayload::BoxBuild(Start|Inspect|Cancel|Remove)$' || true)
          if [[ -n $unexpected_commands ]]; then
            printf '%s\n' "$unexpected_commands"
            exit 1
          fi
          for command in BoxBuildStart BoxBuildInspect BoxBuildCancel BoxBuildRemove; do
            if ! git grep -I -q "NodeCommandPayload::$command" -- \
              crates/control-plane/src/modules/artifacts/infrastructure/build_flow; then
              echo "missing sole Box build command: $command"
              exit 1
            fi
          done

