name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust workspace
    runs-on: ubuntu-latest
    env:
      A3S_WORKFLOW_TEST_DATABASE_URL: postgres://workflow:workflow@127.0.0.1:5432/workflow
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: workflow
          POSTGRES_USER: workflow
          POSTGRES_PASSWORD: workflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workflow -d workflow"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo install cargo-llvm-cov --version 0.8.7 --locked
      - run: cargo llvm-cov --workspace --all-targets --locked --fail-under-lines 90

  studio:
    name: React Studio
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test:coverage
      - run: bun run build

  installers:
    name: Installer dry run (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Validate macOS/Linux installer
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bash -n scripts/install.sh
          output="$(scripts/install.sh --dry-run --install-dir /tmp/a3s-workflow/bin --skill-dir /tmp/a3s-workflow/skill)"
          printf '%s\n' "$output"
          [[ "$output" == *"docker compose --project-directory"* ]]
          [[ "$output" == *"compose.yaml up --build --detach"* ]]
      - name: Validate PowerShell installer
        shell: pwsh
        run: |
          $output = ./scripts/install.ps1 -DryRun `
            -InstallDir "${{ runner.temp }}/a3s-workflow/bin" `
            -SkillDir "${{ runner.temp }}/a3s-workflow/skill" 6>&1 | Out-String
          Write-Host $output
          if ($output -notmatch '\+ docker compose .* -f .*compose\.yaml up --build --detach') {
            throw "Installer did not emit the expected Docker Compose command"
          }

  containers:
    name: Container builds
    needs: [rust, studio]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build control plane and Runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          tags: a3s-workflow:ci
          cache-from: type=gha,scope=workflow
          cache-to: type=gha,mode=max,scope=workflow
      - name: Build Studio image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/web.Dockerfile
          push: false
          tags: a3s-workflow-studio:ci
          cache-from: type=gha,scope=studio
          cache-to: type=gha,mode=max,scope=studio
