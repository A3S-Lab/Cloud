name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --all-targets --locked

  studio:
    name: React Studio
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun test
      - run: bun run build

  e2e:
    name: A3S Test end to end
    needs: [rust, studio]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: workflow
          POSTGRES_USER: workflow
          POSTGRES_PASSWORD: workflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workflow -d workflow"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install Studio dependencies
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Install official A3S Test and compatible browser
        run: |
          cargo install --git https://github.com/A3S-Lab/Test --tag v0.4.3 --locked a3s-test-cli
          bun add --global agent-browser@0.26.0
          agent-browser install
      - name: Run Runtime-backed workflow
        env:
          A3S_WORKFLOW_DATABASE_URL: postgres://workflow:workflow@127.0.0.1:5432/workflow
        run: scripts/ci-e2e.sh
      - name: Upload A3S Test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a3s-test-evidence
          path: .a3s-test
          include-hidden-files: true
          if-no-files-found: warn

  containers:
    name: Container builds
    needs: [rust, studio]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build control plane and Runtime image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          tags: a3s-workflow:ci
          cache-from: type=gha,scope=workflow
          cache-to: type=gha,mode=max,scope=workflow
      - name: Build Studio image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/web.Dockerfile
          push: false
          tags: a3s-workflow-studio:ci
          cache-from: type=gha,scope=studio
          cache-to: type=gha,mode=max,scope=studio
