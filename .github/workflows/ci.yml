name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  replica-set-postgres:
    name: H0 replica-set PostgreSQL
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      A3S_CLOUD_TEST_POSTGRES_URL: postgresql://postgres:a3s-cloud-conformance@127.0.0.1:5432/postgres
      A3S_CLOUD_TEST_S3_ACCESS_KEY_ID: a3s-cloud-test
      A3S_CLOUD_TEST_S3_BUCKET: a3s-cloud-object-pages
      A3S_CLOUD_TEST_S3_ENDPOINT: http://127.0.0.1:9000
      A3S_CLOUD_TEST_S3_REGION: us-east-1
      A3S_CLOUD_TEST_S3_SECRET_ACCESS_KEY: a3s-cloud-test-secret
      RUST_MIN_STACK: 33554432
    services:
      postgres:
        image: postgres:17.5-bookworm@sha256:fbcea1bd13b6a882cd6caa6b58db3ae5c102efe50ec625b3e2a5cbc50db5bfe4
        env:
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: a3s-cloud-conformance
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        shell: bash
        working-directory: apps/cloud
    steps:
      - name: Checkout Cloud
        uses: actions/checkout@v4
        with:
          path: apps/cloud

      - name: Install Rust 1.88.0
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.88.0

      - name: Certify one-shot PostgreSQL schema authority
        run: |
          log="$RUNNER_TEMP/a3s-cloud-postgres-schema-authority.log"
          if cargo test --locked -p a3s-cloud-control-plane \
            --test postgres_integration \
            postgres_schema_migration_is_one_shot_and_service_startup_is_read_only \
            -- --exact --nocapture --test-threads=1 2>&1 | tee "$log"; then
            exit 0
          fi
          # GitHub check annotations retain only a small message prefix. Keep the
          # diagnostic tail within that limit so the actual failure remains public.
          detail=$(tail -c 3000 "$log")
          detail=${detail//'%'/'%25'}
          detail=${detail//$'\r'/'%0D'}
          detail=${detail//$'\n'/'%0A'}
          echo "::error title=PostgreSQL schema authority gate failed::$detail"
          exit 1

      - name: Certify verified recipient-contact authority
        run: |
          log="$RUNNER_TEMP/a3s-cloud-recipient-contact-authority.log"
          if cargo test --locked -p a3s-cloud-control-plane \
            --test postgres_integration \
            postgres_recipient_contacts_are_exact_single_use_redacted_and_terminal \
            -- --exact --nocapture --test-threads=1 2>&1 | tee "$log"; then
            exit 0
          fi
          detail=$(tail -c 3000 "$log")
          detail=${detail//'%'/'%25'}
          detail=${detail//$'\r'/'%0D'}
          detail=${detail//$'\n'/'%0A'}
          echo "::error title=Verified recipient-contact authority gate failed::$detail"
          exit 1

      - name: Start checksum-pinned authenticated TLS Mailpit fixture
        env:
          MAILPIT_ARCHIVE_SHA256: 00f7570bf47c9683944f6189379ce4b7d4974b1c9cd911f93c55d4ad945bf3d2
          MAILPIT_VERSION: 1.30.6
        run: |
          archive="mailpit-linux-amd64.tar.gz"
          archive_path="$RUNNER_TEMP/$archive"
          mailpit_dir="$RUNNER_TEMP/a3s-cloud-mailpit-v$MAILPIT_VERSION"
          mailpit_log="$RUNNER_TEMP/a3s-cloud-n5c-mailpit-server.log"
          cert_dir="$RUNNER_TEMP/a3s-cloud-mailpit-tls"
          curl --fail --location --silent --show-error \
            --retry 5 --retry-all-errors --retry-delay 2 --retry-max-time 120 \
            --output "$archive_path" \
            "https://github.com/axllent/mailpit/releases/download/v${MAILPIT_VERSION}/${archive}"
          printf '%s  %s\n' "$MAILPIT_ARCHIVE_SHA256" "$archive_path" |
            sha256sum --check --strict -
          install -d -m 0755 "$mailpit_dir"
          tar --extract --gzip --file "$archive_path" --directory "$mailpit_dir"
          mailpit_binary=$(find "$mailpit_dir" -type f -name mailpit -print -quit)
          if [[ -z $mailpit_binary ]]; then
            echo 'checksum-pinned Mailpit archive has no executable'
            exit 1
          fi
          chmod 0755 "$mailpit_binary"
          install -d -m 0755 "$cert_dir"
          # rustls rejects a CA certificate presented as the TLS end entity.
          openssl req -x509 -nodes -newkey rsa:2048 -sha256 -days 1 \
            -keyout "$cert_dir/key.pem" \
            -out "$cert_dir/cert.pem" \
            -subj '/CN=127.0.0.1' \
            -addext 'subjectAltName=IP:127.0.0.1' \
            -addext 'basicConstraints=critical,CA:FALSE' \
            -addext 'keyUsage=critical,digitalSignature,keyEncipherment' \
            -addext 'extendedKeyUsage=serverAuth' >/dev/null 2>&1
          chmod 0600 "$cert_dir/key.pem"
          chmod 0644 "$cert_dir/cert.pem"
          MP_DISABLE_VERSION_CHECK=true \
            MP_SMTP_AUTH='a3s-cloud:test-password' \
            MP_SMTP_BIND_ADDR=127.0.0.1:1025 \
            MP_SMTP_DISABLE_RDNS=true \
            MP_SMTP_REQUIRE_STARTTLS=true \
            MP_SMTP_STRICT_RFC_HEADERS=true \
            MP_SMTP_TLS_CERT="$cert_dir/cert.pem" \
            MP_SMTP_TLS_KEY="$cert_dir/key.pem" \
            MP_UI_BIND_ADDR=127.0.0.1:8025 \
            "$mailpit_binary" >"$mailpit_log" 2>&1 &
          A3S_CLOUD_MAILPIT_PID=$!
          echo "A3S_CLOUD_MAILPIT_PID=$A3S_CLOUD_MAILPIT_PID" >>"$GITHUB_ENV"
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8025/api/v1/info >/dev/null; then
              exit 0
            fi
            if ! kill -0 "$A3S_CLOUD_MAILPIT_PID" 2>/dev/null; then
              cat "$mailpit_log"
              exit 1
            fi
            sleep 1
          done
          cat "$mailpit_log"
          exit 1

      - name: Certify real authenticated required-STARTTLS recipient delivery
        env:
          A3S_CLOUD_TEST_MAILPIT_API: http://127.0.0.1:8025
          A3S_CLOUD_TEST_SMTP_CA_FILE: ${{ runner.temp }}/a3s-cloud-mailpit-tls/cert.pem
          A3S_CLOUD_TEST_SMTP_HOST: 127.0.0.1
          A3S_CLOUD_TEST_SMTP_PASSWORD: test-password
          A3S_CLOUD_TEST_SMTP_PORT: "1025"
          A3S_CLOUD_TEST_SMTP_USERNAME: a3s-cloud
        run: |
          log="$RUNNER_TEMP/a3s-cloud-n5c-mailpit.log"
          if cargo test --locked -p a3s-cloud-control-plane \
              --test smtp_recipient_contact \
              real_mailpit_accepts_one_authenticated_required_starttls_submission \
              -- --ignored --exact --nocapture --test-threads=1 2>&1 | tee "$log"; then
            if grep --fixed-strings \
                'A3S_CLOUD_C0_3_N5C_MAILPIT_CERTIFIED tls=required_starttls auth=plain submissions=1 outcome=delivered' \
                "$log" >/dev/null; then
              exit 0
            fi
            echo 'recipient-delivery certification marker is missing' >>"$log"
          fi
          detail=$(tail -c 3000 "$log")
          detail=${detail//'%'/'%25'}
          detail=${detail//$'\r'/'%0D'}
          detail=${detail//$'\n'/'%0A'}
          echo "::error title=Recipient-delivery provider gate failed::$detail"
          exit 1

      - name: Upload recipient-delivery provider evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c0-3-n5c-mailpit-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/a3s-cloud-n5c-mailpit.log
            ${{ runner.temp }}/a3s-cloud-n5c-mailpit-server.log
          if-no-files-found: error
          retention-days: 30

      - name: Start checksum-pinned S3-compatible object fixture
        env:
          MINIO_CLIENT_SHA256: ac90da87a35641be5a0ac75d49de5161ddb47d629b5ba01261b0ae9e00aea15f
          MINIO_CLIENT_VERSION: RELEASE.2025-04-16T18-13-26Z
          MINIO_SERVER_SHA256: 53e2a2cb16c5366ea6fbbc479c19ddb4c6a0948273e752f740fb1fbf27bb817c
          MINIO_SERVER_VERSION: RELEASE.2025-04-22T22-12-26Z
        run: |
          minio_server="$RUNNER_TEMP/minio.$MINIO_SERVER_VERSION"
          minio_client="$RUNNER_TEMP/mc.$MINIO_CLIENT_VERSION"
          minio_data="$RUNNER_TEMP/a3s-cloud-object-pages-minio"
          minio_log="$RUNNER_TEMP/a3s-cloud-object-pages-minio.log"
          curl --fail --location --silent --show-error \
            --retry 5 --retry-all-errors --retry-delay 2 --retry-max-time 120 \
            --output "$minio_server" \
            "https://dl.min.io/server/minio/release/linux-amd64/archive/minio.$MINIO_SERVER_VERSION"
          curl --fail --location --silent --show-error \
            --retry 5 --retry-all-errors --retry-delay 2 --retry-max-time 120 \
            --output "$minio_client" \
            "https://dl.min.io/client/mc/release/linux-amd64/archive/mc.$MINIO_CLIENT_VERSION"
          printf '%s  %s\n' "$MINIO_SERVER_SHA256" "$minio_server" |
            sha256sum --check --strict -
          printf '%s  %s\n' "$MINIO_CLIENT_SHA256" "$minio_client" |
            sha256sum --check --strict -
          chmod 0755 "$minio_server" "$minio_client"
          install -d -m 0700 "$minio_data"
          MINIO_ROOT_USER="$A3S_CLOUD_TEST_S3_ACCESS_KEY_ID" \
            MINIO_ROOT_PASSWORD="$A3S_CLOUD_TEST_S3_SECRET_ACCESS_KEY" \
            "$minio_server" server "$minio_data" --address 127.0.0.1:9000 \
            >"$minio_log" 2>&1 &
          A3S_CLOUD_MINIO_PID=$!
          echo "A3S_CLOUD_MINIO_PID=$A3S_CLOUD_MINIO_PID" >>"$GITHUB_ENV"
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/ready >/dev/null; then
              break
            fi
            if ! kill -0 "$A3S_CLOUD_MINIO_PID" 2>/dev/null; then
              cat "$minio_log"
              exit 1
            fi
            if [[ "$attempt" == 60 ]]; then
              cat "$minio_log"
              exit 1
            fi
            sleep 1
          done
          MC_HOST_local="http://$A3S_CLOUD_TEST_S3_ACCESS_KEY_ID:$A3S_CLOUD_TEST_S3_SECRET_ACCESS_KEY@127.0.0.1:9000" \
            "$minio_client" mb --ignore-existing \
            "local/$A3S_CLOUD_TEST_S3_BUCKET"

      - name: Certify bounded object namespace pages across process death
        run: |
          log="$RUNNER_TEMP/a3s-cloud-object-namespace-pages.log"
          if cargo test --locked -p a3s-cloud-control-plane --lib \
            modules::data::infrastructure::object_namespace_recovery_flow::tests::process_death::postgres_object_namespace_pages_survive_process_death \
            -- --exact --nocapture --test-threads=1 2>&1 | tee "$log"; then
            exit 0
          fi
          detail=$(tail -c 3000 "$log")
          detail=${detail//'%'/'%25'}
          detail=${detail//$'\r'/'%0D'}
          detail=${detail//$'\n'/'%0A'}
          echo "::error title=Object namespace page process-death gate failed::$detail"
          exit 1

      - name: Stop S3-compatible object fixture
        if: always()
        run: |
          if [[ -n ${A3S_CLOUD_MINIO_PID:-} ]]; then
            kill "$A3S_CLOUD_MINIO_PID" 2>/dev/null || true
            wait "$A3S_CLOUD_MINIO_PID" 2>/dev/null || true
          fi

      - name: Migrate and verify stable replica sets
        run: |
          log="$RUNNER_TEMP/a3s-cloud-replica-set-foundation.log"
          if cargo test --locked -p a3s-cloud-control-plane \
            --test postgres_integration \
            postgres_replica_set_foundation_is_migrated_atomic_and_replay_safe \
            -- --exact --nocapture --test-threads=1 2>&1 | tee "$log"; then
            exit 0
          fi
          detail=$(tail -c 3000 "$log")
          detail=${detail//'%'/'%25'}
          detail=${detail//$'\r'/'%0D'}
          detail=${detail//$'\n'/'%0A'}
          echo "::error title=Replica-set PostgreSQL gate failed::$detail"
          exit 1

      - name: Certify Resource Grant cross-surface authorization
        run: >-
          cargo test --locked -p a3s-cloud-control-plane
          --test postgres_integration
          postgres_resource_grants_enforce_the_cross_surface_authorization_matrix
          -- --exact --nocapture --test-threads=1

      - name: Certify membership invitation persistence
        run: >-
          cargo test --locked -p a3s-cloud-control-plane
          --test postgres_integration
          postgres_membership_invitations_are_atomic_exact_and_immutable
          -- --exact --nocapture --test-threads=1

      - name: Certify external OIDC identity persistence
        run: >-
          cargo test --locked -p a3s-cloud-control-plane
          --test postgres_integration
          postgres_external_oidc_identity_is_exact_replay_safe_and_immutable
          -- --exact --nocapture --test-threads=1

      - name: Certify OIDC HTTP cross-surface recovery
        run: >-
          cargo test --locked -p a3s-cloud-control-plane
          --test postgres_integration
          postgres_oidc_http_flow_survives_restart_and_commits_exactly_once
          -- --exact --nocapture --test-threads=1

      - name: Certify tenant audit query persistence
        run: >-
          cargo test --locked -p a3s-cloud-control-plane
          --test postgres_integration
          postgres_audit_query_is_tenant_scoped_filtered_and_keyset_paginated
          -- --exact --nocapture --test-threads=1

      - name: Certify project attribution persistence
        run: >-
          cargo test --locked -p a3s-cloud-control-plane
          --test postgres_integration
          postgres_project_attribution_is_atomic_replay_safe_and_immutable
          -- --exact --nocapture --test-threads=1

      - name: Certify personal notification, alert-policy, delivery-budget, and suppression persistence
        run: >-
          cargo test --locked -p a3s-cloud-control-plane
          --test postgres_integration
          postgres_notifications_are_personal_alerted_event_time_suppressed_and_atomic
          -- --exact --nocapture --test-threads=1

      - name: Certify the PostgreSQL-only API process composition
        run: >-
          cargo test --locked -p a3s-cloud-control-plane
          --test postgres_integration
          postgres_api_role_has_only_management_dependencies_and_routes
          -- --exact --nocapture --test-threads=1

      - name: Start checksum-pinned NATS notification fixture
        env:
          NATS_SERVER_VERSION: 2.12.12
          NATS_SERVER_SHA256: 0ade8c59f966a37b9898e5f9ae408ad47f64e529423d3d07330848f4c3bb9300
        run: |
          archive="nats-server-v${NATS_SERVER_VERSION}-linux-amd64.tar.gz"
          archive_path="${RUNNER_TEMP}/${archive}"
          curl --fail --location --silent --show-error \
            --output "$archive_path" \
            "https://github.com/nats-io/nats-server/releases/download/v${NATS_SERVER_VERSION}/${archive}"
          printf '%s  %s\n' "$NATS_SERVER_SHA256" "$archive_path" |
            sha256sum --check --strict -
          tar --extract --gzip --file "$archive_path" --directory "$RUNNER_TEMP"
          nats_dir="${RUNNER_TEMP}/nats-server-v${NATS_SERVER_VERSION}-linux-amd64"
          "$nats_dir/nats-server" \
            --jetstream \
            --store_dir="${RUNNER_TEMP}/a3s-cloud-notification-nats" \
            >"${RUNNER_TEMP}/a3s-cloud-notification-nats.log" 2>&1 &
          echo "A3S_CLOUD_NATS_PID=$!" >> "$GITHUB_ENV"
          for attempt in $(seq 1 30); do
            if timeout 1 bash -c '</dev/tcp/127.0.0.1/4222'; then
              exit 0
            fi
            sleep 1
          done
          cat "${RUNNER_TEMP}/a3s-cloud-notification-nats.log"
          exit 1

      - name: Certify the F0 PostgreSQL and Event foundation
        env:
          A3S_CLOUD_TEST_NATS_URL: nats://127.0.0.1:4222
          A3S_CLOUD_TEST_OFFLINE_SOURCE_RESOLVER: "1"
          RUST_BACKTRACE: "1"
        run: |
          log="$RUNNER_TEMP/a3s-cloud-f0-foundation.log"
          if cargo test --locked -p a3s-cloud-control-plane \
            --test postgres_integration \
            postgres_foundation_is_migrated_atomic_and_idempotent \
            -- --exact --nocapture --test-threads=1 2>&1 | tee "$log"; then
            exit 0
          fi
          detail=$(tail -c 3000 "$log")
          detail=${detail//'%'/'%25'}
          detail=${detail//$'\r'/'%0D'}
          detail=${detail//$'\n'/'%0A'}
          echo "::error title=F0 foundation provider gate failed::$detail"
          exit 1

      - name: Upload F0 foundation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f0-foundation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/a3s-cloud-f0-foundation.log
          if-no-files-found: error
          retention-days: 30

      - name: Certify alert projection, event-time suppression, durable NATS delivery, and terminal replay
        env:
          A3S_CLOUD_TEST_NATS_URL: nats://127.0.0.1:4222
        run: >-
          cargo test --locked -p a3s-cloud-control-plane
          --test postgres_integration
          postgres_notifications_are_personal_alerted_event_time_suppressed_and_atomic
          -- --exact --nocapture --test-threads=1

      - name: Certify the closed relay process composition
        env:
          A3S_CLOUD_TEST_NATS_URL: nats://127.0.0.1:4222
        run: >-
          cargo test --locked -p a3s-cloud-control-plane
          --test postgres_integration
          postgres_relay_role_has_only_its_owned_dependencies_and_routes
          -- --exact --nocapture --test-threads=1

      - name: Certify the closed worker process composition
        env:
          A3S_CLOUD_TEST_NATS_URL: nats://127.0.0.1:4222
          A3S_CLOUD_TEST_SMTP_CA_FILE: ${{ runner.temp }}/a3s-cloud-mailpit-tls/cert.pem
          A3S_CLOUD_TEST_SMTP_HOST: 127.0.0.1
          A3S_CLOUD_TEST_SMTP_PASSWORD: test-password
          A3S_CLOUD_TEST_SMTP_PORT: "1025"
          A3S_CLOUD_TEST_SMTP_USERNAME: a3s-cloud
        run: >-
          cargo test --locked -p a3s-cloud-control-plane
          --test postgres_integration
          postgres_worker_role_has_only_its_owned_dependencies_and_routes
          -- --exact --nocapture --test-threads=1

      - name: Stop checksum-pinned authenticated TLS Mailpit fixture
        if: always()
        run: |
          if [[ -n ${A3S_CLOUD_MAILPIT_PID:-} ]]; then
            kill "$A3S_CLOUD_MAILPIT_PID" 2>/dev/null || true
            wait "$A3S_CLOUD_MAILPIT_PID" 2>/dev/null || true
          fi

      - name: Stop checksum-pinned NATS notification fixture
        if: always()
        run: |
          if [[ -n ${A3S_CLOUD_NATS_PID:-} ]]; then
            kill "$A3S_CLOUD_NATS_PID" 2>/dev/null || true
            wait "$A3S_CLOUD_NATS_PID" 2>/dev/null || true
          fi

      - name: Certify immutable Application release persistence
        run: >-
          cargo test --locked -p a3s-cloud-control-plane
          --test postgres_integration
          postgres_application_releases_are_atomic_replay_safe_and_immutable
          -- --exact --nocapture --test-threads=1

      - name: Certify Application session semantic persistence
        run: >-
          cargo test --locked -p a3s-cloud-control-plane
          --test postgres_integration
          postgres_application_sessions_are_atomic_replay_safe_and_immutable
          -- --exact --nocapture --test-threads=1

      - name: Certify Application WorkflowRun composition
        run: >-
          cargo test --locked -p a3s-cloud-control-plane
          --test postgres_integration
          postgres_application_invocations_compose_exact_workflow_runs_after_restart
          -- --exact --nocapture --test-threads=1

      - name: Certify Application C6-C13 delivery recovery
        env:
          RUST_BACKTRACE: "1"
        run: >-
          cargo test --locked -p a3s-cloud-control-plane
          --test postgres_integration
          postgres_application_delivery_recovers_frame_answer_variable_and_terminal_effects
          -- --exact --nocapture --test-threads=1

      - name: Certify immutable Connector profile persistence
        run: >-
          cargo test --locked -p a3s-cloud-control-plane
          --test postgres_integration
          postgres_connector_profiles_are_exact_replay_safe_and_immutable
          -- --exact --nocapture --test-threads=1

      - name: Certify Durable Cell PostgreSQL authorities, crash recovery, and lifecycle
        env:
          RUST_BACKTRACE: "1"
        run: |
          log="$RUNNER_TEMP/durable-cell-postgres.log"
          if cargo test --locked -p a3s-cloud-control-plane \
            --test postgres_integration \
            postgres_durable_cell_ \
            -- --nocapture --test-threads=1 2>&1 | tee "$log"; then
            exit 0
          fi
          detail=$(tail -c 3000 "$log")
          detail=${detail//'%'/'%25'}
          detail=${detail//$'\r'/'%0D'}
          detail=${detail//$'\n'/'%0A'}
          echo "::error title=Durable Cell PostgreSQL and crash-recovery gate failed::$detail"
          exit 1

      - name: Certify authorized Connector application and Secret materialization
        run: >-
          cargo test --locked -p a3s-cloud-control-plane
          --test postgres_integration
          postgres_connector_application_is_authorized_and_materializes_exact_secrets
          -- --exact --nocapture --test-threads=1

      - name: Certify fenced Connector attempts and atomic evidence
        run: >-
          cargo test --locked -p a3s-cloud-control-plane
          --test postgres_integration
          postgres_connector_attempts_are_fenced_and_settle_evidence_atomically
          -- --exact --nocapture --test-threads=1

      - name: Certify Workflow finite Execution persistence
        run: >-
          cargo test --locked -p a3s-cloud-control-plane
          --test postgres_integration
          postgres_workflow_execution_binding_is_atomic_tenant_scoped_and_immutable
          -- --exact --nocapture --test-threads=1

      - name: Certify Workflow finite Execution process-death recovery
        run: >-
          cargo test --locked -p a3s-cloud-control-plane
          --test postgres_integration
          postgres_workflow_run_survives_api_and_worker_process_death
          -- --exact --nocapture --test-threads=1

  plugin-registry-postgres:
    name: U0 registry PostgreSQL
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17.5-bookworm@sha256:fbcea1bd13b6a882cd6caa6b58db3ae5c102efe50ec625b3e2a5cbc50db5bfe4
        env:
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: a3s-cloud-conformance
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        shell: bash
        working-directory: apps/cloud
    steps:
      - name: Checkout Cloud
        uses: actions/checkout@v4
        with:
          path: apps/cloud

      - name: Install Rust 1.88.0
