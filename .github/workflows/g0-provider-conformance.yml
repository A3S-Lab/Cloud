name: G0 external provider conformance

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: g0-provider-conformance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  github-private-provider:
    name: Private GitHub provider
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: apps/cloud
    steps:
      - name: Checkout Cloud
        uses: actions/checkout@v4
        with:
          path: apps/cloud

      - name: Read pinned Runtime revision
        id: runtime_revision
        run: |
          revision=$(<tools/runtime-conformance/runtime-revision)
          [[ $revision =~ ^[0-9a-f]{40}$ ]]
          echo "revision=$revision" >>"$GITHUB_OUTPUT"

      - name: Checkout Runtime
        uses: actions/checkout@v4
        with:
          repository: A3S-Lab/Runtime
          ref: ${{ steps.runtime_revision.outputs.revision }}
          path: crates/runtime

      - name: Install stable Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Certify private resolution and credential-free replay
        env:
          A3S_CLOUD_TEST_GITHUB_APP_CLIENT_ID: ${{ secrets.G0_GITHUB_APP_CLIENT_ID }}
          A3S_CLOUD_TEST_GITHUB_APP_PRIVATE_KEY: ${{ secrets.G0_GITHUB_APP_PRIVATE_KEY }}
          A3S_CLOUD_TEST_GITHUB_INSTALLATION_ID: ${{ secrets.G0_GITHUB_INSTALLATION_ID }}
          A3S_CLOUD_TEST_GITHUB_PRIVATE_BRANCH: ${{ secrets.G0_GITHUB_PRIVATE_BRANCH }}
          A3S_CLOUD_TEST_GITHUB_PRIVATE_REPOSITORY: ${{ secrets.G0_GITHUB_PRIVATE_REPOSITORY }}
          A3S_CLOUD_TEST_G0_EVIDENCE_DIR: ${{ runner.temp }}/a3s-cloud-g0-provider-evidence
        run: |
          required=(
            A3S_CLOUD_TEST_GITHUB_APP_CLIENT_ID
            A3S_CLOUD_TEST_GITHUB_APP_PRIVATE_KEY
            A3S_CLOUD_TEST_GITHUB_INSTALLATION_ID
            A3S_CLOUD_TEST_GITHUB_PRIVATE_BRANCH
            A3S_CLOUD_TEST_GITHUB_PRIVATE_REPOSITORY
          )
          for name in "${required[@]}"; do
            [[ -n ${!name:-} ]]
          done
          export A3S_CLOUD_TEST_CLOUD_REVISION
          A3S_CLOUD_TEST_CLOUD_REVISION=$(git rev-parse HEAD)
          cargo test -p a3s-cloud-control-plane --test github_private_source --locked \
            real_github_installation_token_resolves_and_checks_out_a_private_repository \
            -- --ignored --exact --nocapture --test-threads=1
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          evidence = Path(os.environ["A3S_CLOUD_TEST_G0_EVIDENCE_DIR"]) / "github-private-source.json"
          document = json.loads(evidence.read_text(encoding="utf-8"))
          assert document["schema"] == "a3s.cloud.g0-private-github-provider-evidence.v1"
          assert document["cloudRevision"] == os.environ["A3S_CLOUD_TEST_CLOUD_REVISION"]
          assert all(document["checks"].values())
          PY

      - name: Upload private-provider evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g0-private-github-provider-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/a3s-cloud-g0-provider-evidence
          if-no-files-found: error
          retention-days: 30
