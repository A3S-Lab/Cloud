[workspace]
members = [
    "crates/contracts",
    "crates/control-plane",
    "crates/node-agent",
    "crates/web-server",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/A3S-Lab/Cloud"

[workspace.dependencies]
a3s-acl = "=0.3.0"
a3s-boot = { version = "=0.1.4", default-features = false, features = [
    "auth",
    "axum",
    "cqrs",
    "health",
    "logging",
    "openapi-schemas",
    "queue-postgres",
    "security",
] }
a3s-box-core = { version = "=3.2.0", git = "https://github.com/A3S-Lab/Box.git", rev = "9ee75351ed1c5b5648639476e664c97825879f89" }
a3s-box-runtime = { version = "=3.2.0", git = "https://github.com/A3S-Lab/Box.git", rev = "9ee75351ed1c5b5648639476e664c97825879f89", default-features = false, features = ["build", "vm"] }
a3s-code-core = { version = "=6.8.1", git = "https://github.com/A3S-Lab/Code.git", rev = "e0b385b0db667add293f038cd1d4c3213560302a", default-features = false }
a3s-event = { version = "=0.3.0", default-features = false, features = ["nats"] }
a3s-flow = { version = "=0.11.0", git = "https://github.com/A3S-Lab/Flow.git", rev = "280e470563996203b176a4fb5a2fdf7e96a7b1f2", default-features = false, features = ["boot", "postgres"] }
a3s-orm = { git = "https://github.com/A3S-Lab/ORM.git", rev = "a09b4db0f55c29cff3cb7963f2d45125ed7b3936", default-features = false, features = ["postgres"] }
a3s-runtime = { version = "=0.2.0", git = "https://github.com/A3S-Lab/Runtime.git", rev = "061cde95e16eb4cbd9f58724e6cbb60de6ace77e" }
a3s-use-core = { version = "=0.2.1", git = "https://github.com/A3S-Lab/Use.git", rev = "a15cb412b26d83040ab491386baff2dda90264b1" }
aes-gcm = "0.10"
argon2 = "0.5"
async-trait = "0.1"
async-stream = "0.3"
axum = "0.8"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
fs2 = "0.4"
futures-util = "0.3"
getrandom = "0.3"
hyper = { version = "1", features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1", features = ["server-auto", "service", "tokio"] }
hickory-resolver = { version = "0.24.4", default-features = false, features = [
    "system-config",
    "tokio-runtime",
] }
hmac = "0.12"
http-body-util = "0.1"
libc = "0.2"
object_store = { version = "=0.12.4", default-features = false, features = ["aws"] }
rcgen = { version = "0.13.2", features = ["x509-parser"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["logging", "ring", "std", "tls12"] }
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
semver = "1"
sha2 = "0.10"
subtle = "2"
tempfile = "3"
tar = "0.4"
thiserror = "2"
time = "0.3"
tokio = { version = "1", features = [
    "fs",
    "io-util",
    "macros",
    "net",
    "process",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "ring", "tls12"] }
tokio-util = { version = "0.7", features = ["io"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["serde", "v4", "v5", "v7"] }
url = "2"
zeroize = "1"

[patch.crates-io]
a3s-orm = { git = "https://github.com/A3S-Lab/ORM.git", rev = "a09b4db0f55c29cff3cb7963f2d45125ed7b3936" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"
