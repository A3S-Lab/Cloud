[workspace]
members = [
    "crates/contracts",
    "crates/control-plane",
    "crates/node-agent",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/A3S-Lab/Cloud"

[workspace.dependencies]
a3s-acl = { version = "=0.3.0", git = "https://github.com/A3S-Lab/ACL.git", rev = "5317e166222495585909d81f2caffdca90273c99" }
a3s-boot = { version = "=0.2.0", default-features = false, features = [
    "auth",
    "axum",
    "cqrs",
    "health",
    "logging",
    "openapi-schemas",
    "queue-postgres",
    "security",
] }
a3s-box-core = { version = "=3.2.0", git = "https://github.com/A3S-Lab/Box.git", rev = "93ddc2d2db3827e06606da2e368a03b0e29c06f2" }
a3s-box-runtime = { version = "=3.2.0", git = "https://github.com/A3S-Lab/Box.git", rev = "93ddc2d2db3827e06606da2e368a03b0e29c06f2", default-features = false, features = ["build", "vm"] }
a3s-code-core = { version = "=7.0.2", git = "https://github.com/A3S-Lab/Code.git", rev = "bbdd636b77f50c65a696a572d0f5a9956527744b", default-features = false }
a3s-event = { version = "=0.3.0", default-features = false, features = ["nats"] }
a3s-flow = { version = "=1.0.0", git = "https://github.com/A3S-Lab/Flow.git", rev = "e9c77e55dde71c272d74f0224f09b5d5e027a43f", default-features = false, features = ["boot", "postgres"] }
a3s-form-core = { version = "=0.1.0", git = "https://github.com/A3S-Lab/UI.git", rev = "3c5499cba6dc116230b859fac6a8e32653024a8f" }
a3s-orm = { version = "=0.3.1", git = "https://github.com/A3S-Lab/ORM.git", rev = "52944002dc84b07d88a85f2a4a87f913655e62b5", default-features = false, features = ["postgres"] }
a3s-runtime = { version = "=0.2.0", git = "https://github.com/A3S-Lab/Runtime.git", rev = "061cde95e16eb4cbd9f58724e6cbb60de6ace77e" }
a3s-use-core = { version = "=0.2.3", git = "https://github.com/A3S-Lab/Use.git", rev = "0d251dc59f71c3478ff6597d52f47257d780b350" }
a3s-use-extension = { version = "=0.3.2", git = "https://github.com/A3S-Lab/Use.git", rev = "0d251dc59f71c3478ff6597d52f47257d780b350" }
aes-gcm = "0.10"
argon2 = "0.5"
async-trait = "0.1"
async-stream = "0.3"
axum = "0.8"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "=0.10.4"
cron = "=0.17.0"
fs2 = "0.4"
futures-util = "0.3"
getrandom = "0.3"
hyper = { version = "1", features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1", features = ["server-auto", "service", "tokio"] }
hickory-resolver = { version = "0.24.4", default-features = false, features = [
    "system-config",
    "tokio-runtime",
] }
hmac = "0.12"
http-body-util = "0.1"
libc = "0.2"
lettre = { version = "=0.11.23", default-features = false, features = ["smtp-transport", "tokio1-rustls-tls"] }
object_store = { version = "=0.12.4", default-features = false, features = ["aws"] }
openidconnect = { version = "=4.0.1", default-features = false, features = [
    "reqwest",
    "rustls-tls",
] }
rcgen = { version = "0.13.2", features = ["x509-parser"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["logging", "ring", "std", "tls12"] }
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
semver = "1"
sha2 = "0.10"
subtle = "2"
tempfile = "3"
tar = "0.4"
thiserror = "2"
time = "0.3"
tokio = { version = "1", features = [
    "fs",
    "io-util",
    "macros",
    "net",
    "process",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "ring", "tls12"] }
tokio-util = { version = "0.7", features = ["io"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["serde", "v4", "v5", "v7"] }
url = "2"
zeroize = "1"

[patch.crates-io]
a3s-acl = { git = "https://github.com/A3S-Lab/ACL.git", rev = "5317e166222495585909d81f2caffdca90273c99" }
a3s-boot = { git = "https://github.com/A3S-Lab/Boot.git", rev = "83d489fb2274ab8e0d277ccd87461cc35c1a9b88" }
a3s-orm = { git = "https://github.com/A3S-Lab/ORM.git", rev = "52944002dc84b07d88a85f2a4a87f913655e62b5" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"
