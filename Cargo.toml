[workspace]
members = ["crates/workflow-protocol", "node-runner", "runtime-provider", "server"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license-file = "LICENSE"
repository = "https://github.com/A3S-Lab/Workflow"

[workspace.dependencies]
a3s-boot = { version = "=0.1.3", default-features = false, features = [
  "axum",
  "config",
  "health",
  "logging",
  "security",
  "shutdown-hooks",
] }
a3s-event = { version = "=0.3.0", default-features = false }
a3s-flow = { version = "=0.4.3", default-features = false, features = [
  "a3s-event",
  "postgres",
] }
a3s-memory = { version = "=0.1.2", default-features = false }
a3s-orm = { git = "https://github.com/A3S-Lab/ORM.git", rev = "6fdeae38032a5134e858cf3985f47d60cb5180ac", default-features = false, features = ["postgres"] }
a3s-runtime = { version = "=0.2.0" }
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = [
  "fs",
  "io-util",
  "macros",
  "net",
  "process",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
sqlx = { version = "0.8", default-features = false, features = [
  "chrono",
  "json",
  "postgres",
  "runtime-tokio-rustls",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2"
uuid = { version = "1", features = ["serde", "v4", "v5"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"
