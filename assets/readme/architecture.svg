<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">A3S Cloud single-authority architecture</title>
  <desc id="desc">Three product outcomes reuse one Cloud control plane, one outbound node path, Runtime and Box execution, and Gateway request path, with exact observations returning to PostgreSQL.</desc>
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#26352b" stroke-width="1" opacity="0.35"/>
    </pattern>
    <marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#72b7ff"/>
    </marker>
    <marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#b8f36b"/>
    </marker>
    <marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#f3c86b"/>
    </marker>
  </defs>

  <rect width="1200" height="820" rx="24" fill="#0b100d"/>
  <rect x="1" y="1" width="1198" height="818" rx="23" fill="none" stroke="#354b3d" stroke-width="2"/>
  <rect x="1" y="1" width="1198" height="818" rx="23" fill="url(#grid)"/>

  <text x="48" y="58" fill="#f4faf6" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="32" font-weight="760">One architecture. Three product outcomes.</text>
  <text x="48" y="88" fill="#91a398" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="14" letter-spacing="1.2">AUTHORITY MAP · TARGET CAPABILITIES REMAIN GATE-DRIVEN</text>

  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">
    <rect x="48" y="124" width="342" height="92" rx="13" fill="#111914" stroke="#354b3d"/>
    <text x="70" y="155" fill="#b8f36b" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700" letter-spacing="1.5">PRODUCT 01</text>
    <text x="70" y="185" fill="#e9f1eb" font-size="23" font-weight="700">Unified Gateway</text>
    <text x="70" y="204" fill="#91a398" font-size="13">Governed cloud-edge ingress and evidence</text>

    <rect x="429" y="124" width="342" height="92" rx="13" fill="#111914" stroke="#354b3d"/>
    <text x="451" y="155" fill="#b8f36b" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700" letter-spacing="1.5">PRODUCT 02</text>
    <text x="451" y="185" fill="#e9f1eb" font-size="23" font-weight="700">Workflow Orchestrator</text>
    <text x="451" y="204" fill="#91a398" font-size="13">Ontology to recoverable typed execution</text>

    <rect x="810" y="124" width="342" height="92" rx="13" fill="#111914" stroke="#354b3d"/>
    <text x="832" y="155" fill="#b8f36b" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700" letter-spacing="1.5">PRODUCT 03</text>
    <text x="832" y="185" fill="#e9f1eb" font-size="23" font-weight="700">Agent Factory</text>
    <text x="832" y="204" fill="#91a398" font-size="13">Version, evaluate, deploy any Harness</text>
  </g>

  <path d="M219 216v45H600M600 216v45M981 216v45H600" fill="none" stroke="#65766c" stroke-width="1.6" stroke-dasharray="7 7"/>
  <text x="613" y="251" fill="#65766c" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" letter-spacing="1">COMPOSITIONS, NOT CONTROL PLANES</text>

  <rect x="48" y="275" width="1104" height="210" rx="16" fill="#0f1612" stroke="#354b3d" stroke-width="1.5"/>
  <text x="70" y="307" fill="#72b7ff" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" font-weight="700" letter-spacing="1.8">SHARED CONTROL PLANE</text>

  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">
    <rect x="70" y="333" width="184" height="108" rx="11" fill="#162019" stroke="#72b7ff" stroke-opacity="0.7"/>
    <text x="88" y="364" fill="#72b7ff" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700">INTENT</text>
    <text x="88" y="391" fill="#e9f1eb" font-size="19" font-weight="700">Cloud API</text>
    <text x="88" y="416" fill="#91a398" font-size="14">Identity · DDD contexts</text>

    <rect x="278" y="333" width="184" height="108" rx="11" fill="#162019" stroke="#72b7ff" stroke-opacity="0.7"/>
    <text x="296" y="364" fill="#72b7ff" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700">AUTHORITY</text>
    <text x="296" y="391" fill="#e9f1eb" font-size="19" font-weight="700">PostgreSQL</text>
    <text x="296" y="416" fill="#91a398" font-size="14">A3S ORM · Outbox</text>

    <rect x="486" y="333" width="184" height="108" rx="11" fill="#162019" stroke="#72b7ff" stroke-opacity="0.7"/>
    <text x="504" y="364" fill="#72b7ff" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700">RECOVERY</text>
    <text x="504" y="391" fill="#e9f1eb" font-size="17" font-weight="700">Flow + Operations</text>
    <text x="504" y="416" fill="#91a398" font-size="14">Retries · leases · timers</text>

    <rect x="694" y="333" width="184" height="108" rx="11" fill="#162019" stroke="#72b7ff" stroke-opacity="0.7"/>
    <text x="712" y="364" fill="#72b7ff" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700">PLACEMENT</text>
    <text x="712" y="391" fill="#e9f1eb" font-size="17" font-weight="700">Workloads + Fleet</text>
    <text x="712" y="416" fill="#91a398" font-size="14">Claims · commands · rollout</text>

    <rect x="902" y="333" width="228" height="108" rx="11" fill="#162019" stroke="#72b7ff" stroke-opacity="0.7"/>
    <text x="920" y="364" fill="#72b7ff" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700">TRAFFIC INTENT</text>
    <text x="920" y="391" fill="#e9f1eb" font-size="19" font-weight="700">Edge</text>
    <text x="920" y="416" fill="#91a398" font-size="14">Complete expiring snapshots</text>
  </g>

  <path d="M254 387h24M462 387h24M670 387h24M878 387h24" fill="none" stroke="#72b7ff" stroke-width="2" marker-end="url(#blue)"/>

  <rect x="48" y="519" width="1104" height="146" rx="16" fill="#0f1612" stroke="#354b3d" stroke-width="1.5"/>
  <text x="70" y="551" fill="#b8f36b" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" font-weight="700" letter-spacing="1.8">OUTBOUND NODE + EXECUTION PLANE</text>

  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">
    <rect x="126" y="573" width="190" height="64" rx="10" fill="#162019" stroke="#b8f36b" stroke-opacity="0.72"/>
    <text x="221" y="612" fill="#e9f1eb" font-size="18" font-weight="700" text-anchor="middle">Node Agent</text>
    <rect x="370" y="573" width="190" height="64" rx="10" fill="#162019" stroke="#b8f36b" stroke-opacity="0.72"/>
    <text x="465" y="600" fill="#e9f1eb" font-size="18" font-weight="700" text-anchor="middle">A3S Runtime</text>
    <text x="465" y="621" fill="#91a398" font-size="13" text-anchor="middle">Task / Service</text>
    <rect x="614" y="573" width="190" height="64" rx="10" fill="#162019" stroke="#b8f36b" stroke-opacity="0.72"/>
    <text x="709" y="612" fill="#e9f1eb" font-size="18" font-weight="700" text-anchor="middle">A3S Box</text>
    <rect x="858" y="573" width="222" height="64" rx="10" fill="#162019" stroke="#b8f36b" stroke-opacity="0.72"/>
    <text x="969" y="600" fill="#e9f1eb" font-size="18" font-weight="700" text-anchor="middle">Payload</text>
    <text x="969" y="621" fill="#91a398" font-size="13" text-anchor="middle">App · Harness · MCP · Power</text>
  </g>

  <path d="M786 441v79H221v53M316 605h54M560 605h54M804 605h54" fill="none" stroke="#b8f36b" stroke-width="2" marker-end="url(#green)"/>
  <path d="M221 573V463H370V441" fill="none" stroke="#b8f36b" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#green)"/>
  <text x="230" y="488" fill="#b8f36b" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="700" letter-spacing="1">EXACT RECEIPTS + OBSERVATIONS</text>

  <rect x="48" y="699" width="1104" height="78" rx="16" fill="#0f1612" stroke="#354b3d" stroke-width="1.5"/>
  <text x="70" y="731" fill="#f3c86b" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" font-weight="700" letter-spacing="1.8">LIVE REQUEST PATH · CLOUD STAYS OFF THE BYTE PATH</text>
  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="17" font-weight="700">
    <text x="495" y="758" fill="#e9f1eb" text-anchor="middle">External client</text>
    <text x="735" y="758" fill="#e9f1eb" text-anchor="middle">A3S Gateway</text>
    <text x="1028" y="758" fill="#e9f1eb" text-anchor="middle">Exact healthy endpoint</text>
  </g>
  <path d="M575 752h73M822 752h88" fill="none" stroke="#f3c86b" stroke-width="2" marker-end="url(#amber)"/>
  <path d="M1016 441v62H221v70M221 637v31h514v68" fill="none" stroke="#72b7ff" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#blue)"/>

  <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="700" letter-spacing="1">
    <line x1="48" y1="800" x2="82" y2="800" stroke="#72b7ff" stroke-width="2"/>
    <text x="92" y="804" fill="#91a398">DESIRED STATE</text>
    <line x1="230" y1="800" x2="264" y2="800" stroke="#b8f36b" stroke-width="2"/>
    <text x="274" y="804" fill="#91a398">APPLIED EVIDENCE</text>
    <line x1="440" y1="800" x2="474" y2="800" stroke="#f3c86b" stroke-width="2"/>
    <text x="484" y="804" fill="#91a398">REQUEST BYTES</text>
    <text x="1152" y="804" fill="#65766c" text-anchor="end">ACL-ONLY · VERSIONED · FAIL-CLOSED</text>
  </g>
</svg>
