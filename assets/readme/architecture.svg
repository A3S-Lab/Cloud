<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">A3S Cloud single-authority architecture</title>
  <desc id="desc">Four management adapters enter one application core and PostgreSQL authority. Flow compiles portable Workflow DAG structure and coordinates durable recovery through existing Data, Workloads, Fleet, and Node Agent paths. Edge publishes exact snapshots to Gateway while live request bytes remain outside the control plane.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#8fa298"/></marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#b7f56a"/></marker>
    <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#67b7ff"/></marker>
  </defs>

  <rect width="1200" height="820" rx="10" fill="#0a0f0c"/>
  <text x="48" y="52" fill="#8fa298" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="700" letter-spacing="2.4">A3S CLOUD / CURRENT SYSTEM ARCHITECTURE</text>
  <text x="48" y="96" fill="#f4faf6" font-family="Georgia, Songti SC, serif" font-size="40">One authority. Three paths. No duplicate control plane.</text>
  <text x="48" y="128" fill="#a8b8af" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="20">Intent is durable, node execution is outbound, and live request bytes stay off Cloud.</text>

  <rect x="48" y="162" width="1104" height="154" rx="10" fill="#0e1712" stroke="#26382e"/>
  <rect x="64" y="174" width="210" height="25" rx="5" fill="#0a0f0c"/>
  <text x="76" y="192" fill="#6f8378" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" letter-spacing="1.6">INTERFACE + AUTHORITY</text>

  <rect x="48" y="340" width="1104" height="198" rx="10" fill="#0e1712" stroke="#26382e"/>
  <rect x="64" y="352" width="228" height="25" rx="5" fill="#0a0f0c"/>
  <text x="76" y="370" fill="#6f8378" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" letter-spacing="1.6">DURABLE COORDINATION</text>

  <rect x="48" y="562" width="1104" height="180" rx="10" fill="#0e1712" stroke="#26382e"/>
  <rect x="64" y="574" width="224" height="25" rx="5" fill="#0a0f0c"/>
  <text x="76" y="592" fill="#6f8378" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" letter-spacing="1.6">PROVIDER + BYTE PATHS</text>

  <!-- Connectors are drawn before nodes. -->
  <path d="M306 248H414" fill="none" stroke="#8fa298" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M764 248H884" fill="none" stroke="#8fa298" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M589 290V326H194V390" fill="none" stroke="#8fa298" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M312 448H344" fill="none" stroke="#8fa298" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M194 506V522H596V448H612" fill="none" stroke="#b7f56a" stroke-width="2" marker-end="url(#arrow-accent)"/>
  <path d="M848 448H880" fill="none" stroke="#8fa298" stroke-width="2" marker-end="url(#arrow)"/>

  <path d="M462 506V588H201V616" fill="none" stroke="#8fa298" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M730 506V580H835V616" fill="none" stroke="#b7f56a" stroke-width="2" marker-end="url(#arrow-accent)"/>
  <path d="M730 662H672" fill="none" stroke="#b7f56a" stroke-width="2" marker-end="url(#arrow-accent)"/>
  <path d="M530 616V552H786V506" fill="none" stroke="#b7f56a" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow-accent)"/>
  <path d="M1002 506V580H1067V616" fill="none" stroke="#67b7ff" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow-link)"/>
  <path d="M1010 678H672" fill="none" stroke="#67b7ff" stroke-width="2" marker-end="url(#arrow-link)"/>

  <!-- Interface and authority. -->
  <rect x="76" y="206" width="230" height="84" rx="8" fill="#121c16" stroke="#53665b"/>
  <text x="94" y="236" fill="#f4faf6" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="22" font-weight="700">Product interfaces</text>
  <text x="94" y="264" fill="#86c9ff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">REST / OPENAPI</text>
  <text x="94" y="285" fill="#86c9ff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">TS / CLI / MCP</text>

  <rect x="414" y="198" width="350" height="92" rx="8" fill="#172118" stroke="#b7f56a" stroke-width="2"/>
  <text x="434" y="232" fill="#f4faf6" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="25" font-weight="700">A3S Cloud application core</text>
  <text x="434" y="264" fill="#a9bbb0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">identity / policy / CQRS / audit</text>

  <rect x="884" y="206" width="240" height="84" rx="8" fill="#111914" stroke="#53665b"/>
  <text x="902" y="236" fill="#f4faf6" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="22" font-weight="700">PostgreSQL</text>
  <text x="902" y="264" fill="#9dafa5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">ORM / Outbox</text>
  <text x="902" y="285" fill="#9dafa5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">desired state</text>

  <!-- Durable coordination. -->
  <rect x="76" y="390" width="236" height="116" rx="8" fill="#121c16" stroke="#53665b"/>
  <text x="94" y="424" fill="#f4faf6" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="21" font-weight="700">Flow + Operations</text>
  <text x="94" y="455" fill="#9dafa5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">DAG plan / replay</text>
  <text x="94" y="480" fill="#9dafa5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">retry / wait / recovery</text>

  <rect x="344" y="390" width="236" height="116" rx="8" fill="#121c16" stroke="#53665b"/>
  <text x="362" y="424" fill="#f4faf6" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="21" font-weight="700">Data + Secrets</text>
  <text x="362" y="455" fill="#9dafa5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">S0 exact binding</text>
  <text x="362" y="480" fill="#9dafa5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">seal / restore / delete</text>

  <rect x="612" y="390" width="236" height="116" rx="8" fill="#121c16" stroke="#53665b"/>
  <text x="630" y="424" fill="#f4faf6" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="21" font-weight="700">Workloads + Fleet</text>
  <text x="630" y="455" fill="#9dafa5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">placement / Claims</text>
  <text x="630" y="480" fill="#9dafa5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">commands / rollout</text>

  <rect x="880" y="390" width="244" height="116" rx="8" fill="#121c16" stroke="#53665b"/>
  <text x="898" y="424" fill="#f4faf6" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="21" font-weight="700">Edge planner</text>
  <text x="898" y="455" fill="#9dafa5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">routes / TLS / CAS</text>
  <text x="898" y="480" fill="#9dafa5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">exact target snapshots</text>

  <!-- Provider and request paths. -->
  <rect x="76" y="616" width="250" height="92" rx="8" fill="#121c16" stroke="#53665b"/>
  <text x="94" y="648" fill="#f4faf6" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="21" font-weight="700">S3-compatible storage</text>
  <text x="94" y="679" fill="#9dafa5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">live + recovery scopes</text>

  <rect x="386" y="616" width="286" height="92" rx="8" fill="#121c16" stroke="#53665b"/>
  <text x="404" y="648" fill="#f4faf6" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="21" font-weight="700">Runtime + Box</text>
  <text x="404" y="679" fill="#b7f56a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">Task / Service / OCI apply</text>

  <rect x="730" y="616" width="210" height="92" rx="8" fill="#121c16" stroke="#53665b"/>
  <text x="748" y="648" fill="#f4faf6" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="21" font-weight="700">Node Agent</text>
  <text x="748" y="679" fill="#9dafa5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">outbound mTLS</text>
  <text x="748" y="700" fill="#9dafa5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">journal / receipts</text>

  <rect x="1010" y="616" width="114" height="92" rx="8" fill="#102036" stroke="#67b7ff"/>
  <text x="1067" y="651" fill="#f4faf6" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="20" font-weight="700" text-anchor="middle">A3S</text>
  <text x="1067" y="680" fill="#67b7ff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="700" text-anchor="middle">GATEWAY</text>

  <line x1="48" y1="776" x2="1152" y2="776" stroke="#26382e"/>
  <circle cx="64" cy="800" r="5" fill="#8fa298"/>
  <text x="80" y="806" fill="#7f9288" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">CONTROL + STORAGE</text>
  <circle cx="286" cy="800" r="5" fill="#b7f56a"/>
  <text x="302" y="806" fill="#9bd05d" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">EXECUTION + RECEIPTS</text>
  <circle cx="546" cy="800" r="5" fill="#67b7ff"/>
  <text x="562" y="806" fill="#67b7ff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">LIVE REQUESTS / CLOUD OFF BYTE PATH</text>
  <text x="1152" y="806" fill="#6f8378" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" text-anchor="end">ROADMAP GATES DECIDE AVAILABILITY</text>
</svg>
