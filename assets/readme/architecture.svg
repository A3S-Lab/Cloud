<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="980" viewBox="0 0 1200 980" role="img" aria-labelledby="title desc">
  <title id="title">A3S Cloud single-authority target architecture</title>
  <desc id="desc">All public traffic enters A3S Gateway. Agent, Workflow, Function, Durable Cell, Inference, and Web domains commit intent to PostgreSQL, coordinate through Flow, schedule through Workloads and Fleet, and execute as Runtime Task or Service units on Box. Supply, storage, cache, dispatch, and observability remain separate mechanisms.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#8fa298"/></marker>
    <marker id="lime" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#b7f56a"/></marker>
    <marker id="blue" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#67b7ff"/></marker>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#203027" stroke-width="1" opacity=".32"/></pattern>
  </defs>

  <rect width="1200" height="980" rx="18" fill="#0a0f0c"/>
  <rect width="1200" height="980" rx="18" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="978" rx="17" fill="none" stroke="#2d4035" stroke-width="2"/>

  <text x="48" y="48" fill="#8fa298" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="700" letter-spacing="2.2">A3S CLOUD / TARGET AUTHORITY MAP</text>
  <text x="48" y="91" fill="#f4faf6" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="38" font-weight="760">Product semantics above. Two runtime classes below.</text>
  <text x="48" y="123" fill="#a8b8af" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="20">No product-specific scheduler, executor, ingress, queue, cache truth, or deployment controller.</text>

  <!-- Public boundary. -->
  <rect x="48" y="151" width="1104" height="88" rx="12" fill="#0e1712" stroke="#2c4034"/>
  <text x="67" y="176" fill="#6f8378" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" letter-spacing="1.5">PUBLIC BOUNDARY</text>
  <rect x="76" y="181" width="189" height="44" rx="8" fill="#102036" stroke="#3c79aa"/>
  <text x="171" y="209" fill="#86c9ff" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="19" font-weight="700" text-anchor="middle">Clients / Agents</text>
  <rect x="426" y="167" width="348" height="64" rx="10" fill="#142019" stroke="#67b7ff" stroke-width="2"/>
  <text x="600" y="195" fill="#f4faf6" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="24" font-weight="760" text-anchor="middle">A3S Gateway</text>
  <text x="600" y="218" fill="#86c9ff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" text-anchor="middle">TLS · AUTH · RATE · ROUTES · WEB</text>
  <rect x="934" y="181" width="190" height="44" rx="8" fill="#102036" stroke="#3c79aa"/>
  <text x="1029" y="209" fill="#86c9ff" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="19" font-weight="700" text-anchor="middle">Live endpoints</text>

  <!-- Product semantics. -->
  <rect x="48" y="264" width="1104" height="109" rx="12" fill="#0e1712" stroke="#2c4034"/>
  <text x="67" y="289" fill="#6f8378" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" letter-spacing="1.5">PRODUCT SEMANTICS / BOUNDED CONTEXTS</text>
  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="19" font-weight="700" text-anchor="middle">
    <rect x="76" y="307" width="158" height="48" rx="8" fill="#102036" stroke="#3c79aa"/><text x="155" y="337" fill="#86c9ff">AaaS / Agents</text>
    <rect x="248" y="307" width="158" height="48" rx="8" fill="#102036" stroke="#3c79aa"/><text x="327" y="337" fill="#86c9ff">WaaS / Flow</text>
    <rect x="420" y="307" width="158" height="48" rx="8" fill="#102036" stroke="#3c79aa"/><text x="499" y="337" fill="#86c9ff">FaaS / MCP</text>
    <rect x="592" y="307" width="158" height="48" rx="8" fill="#102036" stroke="#3c79aa"/><text x="671" y="337" fill="#86c9ff">Durable Cell</text>
    <rect x="764" y="307" width="158" height="48" rx="8" fill="#102036" stroke="#3c79aa"/><text x="843" y="337" fill="#86c9ff">Inference</text>
    <rect x="936" y="307" width="188" height="48" rx="8" fill="#102036" stroke="#3c79aa"/><text x="1030" y="337" fill="#86c9ff">Applications / Web</text>
  </g>

  <!-- Durable control. -->
  <rect x="48" y="406" width="1104" height="163" rx="12" fill="#0e1712" stroke="#2c4034"/>
  <text x="67" y="431" fill="#6f8378" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" letter-spacing="1.5">IDENTITY + DURABLE CONTROL + DELIVERY</text>
  <rect x="76" y="453" width="314" height="97" rx="9" fill="#121c16" stroke="#53665b"/>
  <text x="96" y="484" fill="#f4faf6" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="22" font-weight="740">Identity + PostgreSQL</text>
  <text x="96" y="515" fill="#a5b6ac" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">SCOPE · RBAC · CAS · AUDIT</text>
  <text x="96" y="538" fill="#a5b6ac" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">ORM · IDEMPOTENCY · OUTBOX</text>
  <rect x="425" y="453" width="350" height="97" rx="9" fill="#172319" stroke="#789d4c" stroke-width="1.8"/>
  <text x="445" y="484" fill="#f4faf6" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="22" font-weight="740">A3S Flow + Operations</text>
  <text x="445" y="515" fill="#b7f56a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">WAIT · RETRY · REPLAY · SAGA</text>
  <text x="445" y="538" fill="#b7f56a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">APPROVE · ROLLBACK · CANCEL</text>
  <rect x="810" y="453" width="314" height="97" rx="9" fill="#121c16" stroke="#53665b"/>
  <text x="830" y="484" fill="#f4faf6" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="22" font-weight="740">Edge + A3S Event</text>
  <text x="830" y="515" fill="#a5b6ac" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">SNAPSHOTS · RECEIPTS</text>
  <text x="830" y="538" fill="#a5b6ac" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">COMMITTED FACTS</text>

  <!-- Placement and execution. -->
  <rect x="48" y="606" width="1104" height="141" rx="12" fill="#0e1712" stroke="#2c4034"/>
  <text x="67" y="631" fill="#6f8378" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" letter-spacing="1.5">ONE CPU/GPU PLACEMENT + EXECUTION RAIL</text>
  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">
    <rect x="76" y="650" width="314" height="78" rx="9" fill="#121c16" stroke="#53665b"/>
    <text x="96" y="682" fill="#f4faf6" font-size="22" font-weight="740">Workloads + Fleet</text>
    <text x="96" y="710" fill="#a5b6ac" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">CLAIM · PLACE · ROLLOUT</text>
    <rect x="425" y="650" width="350" height="78" rx="9" fill="#121c16" stroke="#53665b"/>
    <text x="445" y="682" fill="#f4faf6" font-size="22" font-weight="740">Outbound Node Agent</text>
    <text x="445" y="710" fill="#a5b6ac" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">mTLS · JOURNAL · RECEIPTS</text>
    <rect x="810" y="650" width="314" height="78" rx="9" fill="#172319" stroke="#789d4c" stroke-width="1.8"/>
    <text x="830" y="682" fill="#f4faf6" font-size="22" font-weight="740">A3S Runtime</text>
    <text x="830" y="710" fill="#b7f56a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">TASK · SERVICE · EVIDENCE</text>
  </g>

  <!-- Mechanism providers. -->
  <rect x="48" y="790" width="1104" height="128" rx="12" fill="#0e1712" stroke="#2c4034"/>
  <text x="67" y="815" fill="#6f8378" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" letter-spacing="1.5">MECHANISMS / NEVER PARALLEL AUTHORITIES</text>
  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="middle">
    <rect x="76" y="836" width="250" height="62" rx="9" fill="#121c16" stroke="#53665b"/>
    <text x="201" y="863" fill="#f4faf6" font-size="20" font-weight="740">Git · OCI · Use · Models</text>
    <text x="201" y="887" fill="#9eafa5" font-size="18">supply authorities</text>
    <rect x="355" y="836" width="250" height="62" rx="9" fill="#121c16" stroke="#53665b"/>
    <text x="480" y="863" fill="#f4faf6" font-size="20" font-weight="740">S3 objects · Data/S0</text>
    <text x="480" y="887" fill="#9eafa5" font-size="18">bytes · backup · fencing</text>
    <rect x="634" y="836" width="250" height="62" rx="9" fill="#121c16" stroke="#53665b"/>
    <text x="759" y="863" fill="#f4faf6" font-size="20" font-weight="740">Redis · A3S Lane</text>
    <text x="759" y="887" fill="#9eafa5" font-size="18">cache · fair dispatch</text>
    <rect x="913" y="836" width="211" height="62" rx="9" fill="#172319" stroke="#789d4c"/>
    <text x="1019" y="863" fill="#f4faf6" font-size="20" font-weight="740">A3S Box</text>
    <text x="1019" y="887" fill="#b7f56a" font-size="18">CPU · GPU providers</text>
  </g>

  <!-- Visible connectors stay in the gaps between nodes. -->
  <path d="M265 203H426" fill="none" stroke="#67b7ff" stroke-width="2.2" marker-end="url(#blue)"/>
  <path d="M774 203H934" fill="none" stroke="#67b7ff" stroke-width="2.2" marker-end="url(#blue)"/>
  <path d="M600 231V264" fill="none" stroke="#67b7ff" stroke-width="2.2" marker-end="url(#blue)"/>
  <path d="M600 373V406" fill="none" stroke="#8fa298" stroke-width="2.2" marker-end="url(#arrow)"/>
  <path d="M390 501H425" fill="none" stroke="#8fa298" stroke-width="2.2" marker-end="url(#arrow)"/>
  <path d="M775 501H810" fill="none" stroke="#8fa298" stroke-width="2.2" marker-end="url(#arrow)"/>
  <path d="M600 550V606" fill="none" stroke="#b7f56a" stroke-width="2.2" marker-end="url(#lime)"/>
  <path d="M390 689H425" fill="none" stroke="#b7f56a" stroke-width="2.2" marker-end="url(#lime)"/>
  <path d="M775 689H810" fill="none" stroke="#b7f56a" stroke-width="2.2" marker-end="url(#lime)"/>
  <path d="M967 728V787H1019V836" fill="none" stroke="#b7f56a" stroke-width="2.2" marker-end="url(#lime)"/>

  <line x1="48" y1="941" x2="1152" y2="941" stroke="#2c4034"/>
  <text x="48" y="965" fill="#8fa298" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">OBSERVE EVERY PATH: OTEL LOGS · METRICS · TRACES · SLOS · INCIDENTS · OPTIONAL DORIS PROJECTION</text>
</svg>
