<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc">
  <title id="title">A3S Cloud single-authority architecture</title>
  <desc id="desc">Unified Gateway, Workflow Orchestration, and Agent Factory converge through one Cloud control plane, one outbound node execution path, and a separate Gateway request path.</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#67b7ff"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#b7f56a"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#f2c66d"/>
    </marker>
  </defs>

  <rect width="1200" height="850" rx="24" fill="#0a0f0c"/>
  <rect x="1" y="1" width="1198" height="848" rx="23" fill="none" stroke="#2d4035" stroke-width="2"/>

  <text x="48" y="54" fill="#f4faf6" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="34" font-weight="760">Three products. One operating architecture.</text>
  <text x="48" y="84" fill="#8fa298" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">PRODUCT COMPOSITIONS CONVERGE THROUGH SHARED AUTHORITIES</text>

  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">
    <rect x="48" y="112" width="342" height="124" rx="14" fill="#101812" stroke="#344b3c" stroke-width="1.5"/>
    <text x="70" y="142" fill="#b7f56a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700">01 / UNIFIED GATEWAY</text>
    <text x="70" y="174" fill="#eff7f1" font-size="22" font-weight="700">Govern intelligent ingress</text>
    <text x="70" y="204" fill="#96a99e" font-size="18">Identity &#183; policy &#183; routing &#183; evidence</text>
    <text x="70" y="226" fill="#6faad9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">E0  C0  H0  MCP0  I0</text>

    <rect x="429" y="112" width="342" height="124" rx="14" fill="#101812" stroke="#344b3c" stroke-width="1.5"/>
    <text x="451" y="142" fill="#b7f56a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700">02 / WORKFLOW</text>
    <text x="451" y="174" fill="#eff7f1" font-size="22" font-weight="700">Compile ontology to plans</text>
    <text x="451" y="204" fill="#96a99e" font-size="18">Goals &#183; rules &#183; Agents &#183; tools &#183; people</text>
    <text x="451" y="226" fill="#6faad9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">W0  C0  A1  MCP0  I0</text>

    <rect x="810" y="112" width="342" height="124" rx="14" fill="#101812" stroke="#344b3c" stroke-width="1.5"/>
    <text x="832" y="142" fill="#b7f56a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700">03 / AGENT FACTORY</text>
    <text x="832" y="174" fill="#eff7f1" font-size="22" font-weight="700">Ship heterogeneous Agents</text>
    <text x="832" y="204" fill="#96a99e" font-size="18">Immutable release &#183; evaluate &#183; deploy</text>
    <text x="832" y="226" fill="#6faad9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">A0  A1  MCP0  I0  EV0</text>
  </g>

  <path d="M219 236v38H600M600 236v38M981 236v38H600" fill="none" stroke="#607368" stroke-width="1.8" stroke-dasharray="7 6"/>
  <text x="600" y="265" fill="#70857a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" text-anchor="middle">COMPOSITIONS, NOT CONTROL PLANES</text>

  <rect x="48" y="286" width="1104" height="206" rx="16" fill="#0f1712" stroke="#344b3c" stroke-width="1.5"/>
  <text x="70" y="319" fill="#67b7ff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700">ONE CLOUD CONTROL PLANE</text>

  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">
    <rect x="70" y="344" width="196" height="112" rx="11" fill="#142019" stroke="#47755c"/>
    <text x="88" y="376" fill="#67b7ff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="700">INTENT</text>
    <text x="88" y="406" fill="#eff7f1" font-size="21" font-weight="700">Identity + API</text>
    <text x="88" y="434" fill="#96a99e" font-size="18">Tenant policy</text>

    <rect x="286" y="344" width="196" height="112" rx="11" fill="#142019" stroke="#47755c"/>
    <text x="304" y="376" fill="#67b7ff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="700">AUTHORITY</text>
    <text x="304" y="406" fill="#eff7f1" font-size="21" font-weight="700">PostgreSQL</text>
    <text x="304" y="434" fill="#96a99e" font-size="18">A3S ORM + Outbox</text>

    <rect x="502" y="344" width="196" height="112" rx="11" fill="#142019" stroke="#47755c"/>
    <text x="520" y="376" fill="#67b7ff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="700">RECOVERY</text>
    <text x="520" y="406" fill="#eff7f1" font-size="21" font-weight="700">Flow + Ops</text>
    <text x="520" y="434" fill="#96a99e" font-size="18">Leases, retries, timers</text>

    <rect x="718" y="344" width="196" height="112" rx="11" fill="#142019" stroke="#47755c"/>
    <text x="736" y="376" fill="#67b7ff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="700">CONVERGENCE</text>
    <text x="736" y="406" fill="#eff7f1" font-size="19" font-weight="700">Workloads + Fleet</text>
    <text x="736" y="434" fill="#96a99e" font-size="18">Placement + Claims</text>

    <rect x="934" y="344" width="196" height="112" rx="11" fill="#142019" stroke="#47755c"/>
    <text x="952" y="376" fill="#67b7ff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="700">TRAFFIC STATE</text>
    <text x="952" y="406" fill="#eff7f1" font-size="21" font-weight="700">Edge planner</text>
    <text x="952" y="434" fill="#96a99e" font-size="18">Snapshot + owner</text>
  </g>

  <path d="M266 400h20M482 400h20M698 400h20M914 400h20" fill="none" stroke="#67b7ff" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <rect x="48" y="526" width="1104" height="142" rx="16" fill="#0f1712" stroke="#344b3c" stroke-width="1.5"/>
  <text x="70" y="558" fill="#b7f56a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700">ONE OUTBOUND NODE + EXECUTION PATH</text>

  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">
    <rect x="74" y="578" width="190" height="70" rx="10" fill="#142019" stroke="#47755c"/>
    <text x="169" y="620" fill="#eff7f1" font-size="20" font-weight="700" text-anchor="middle">Node Agent</text>
    <rect x="290" y="578" width="190" height="70" rx="10" fill="#142019" stroke="#47755c"/>
    <text x="385" y="608" fill="#eff7f1" font-size="20" font-weight="700" text-anchor="middle">A3S Runtime</text>
    <text x="385" y="633" fill="#96a99e" font-size="18" text-anchor="middle">Task / Service</text>
    <rect x="506" y="578" width="190" height="70" rx="10" fill="#142019" stroke="#47755c"/>
    <text x="601" y="620" fill="#eff7f1" font-size="20" font-weight="700" text-anchor="middle">A3S Box</text>
    <rect x="722" y="578" width="214" height="70" rx="10" fill="#142019" stroke="#47755c"/>
    <text x="829" y="606" fill="#eff7f1" font-size="20" font-weight="700" text-anchor="middle">Managed Workload</text>
    <text x="829" y="633" fill="#96a99e" font-size="16" text-anchor="middle">App &#183; Harness &#183; MCP &#183; Power</text>
    <rect x="962" y="578" width="166" height="70" rx="10" fill="#142019" stroke="#47755c"/>
    <text x="1045" y="608" fill="#eff7f1" font-size="20" font-weight="700" text-anchor="middle">CPU / GPU</text>
    <text x="1045" y="633" fill="#96a99e" font-size="18" text-anchor="middle">Host resources</text>
  </g>

  <path d="M816 456v70H169v52M264 613h26M480 613h26M696 613h26M936 613h26" fill="none" stroke="#b7f56a" stroke-width="2" marker-end="url(#arrow-green)"/>
  <path d="M169 578V477H384V456" fill="none" stroke="#b7f56a" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow-green)"/>
  <text x="184" y="510" fill="#9bcf6b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">EXACT RECEIPTS + OBSERVATIONS</text>

  <rect x="48" y="702" width="1104" height="100" rx="16" fill="#0f1712" stroke="#344b3c" stroke-width="1.5"/>
  <text x="70" y="734" fill="#f2c66d" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700">LIVE REQUEST PATH / CLOUD STAYS OFF THE BYTE PATH</text>
  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="20" font-weight="700">
    <text x="260" y="775" fill="#eff7f1" text-anchor="middle">External client</text>
    <text x="600" y="775" fill="#eff7f1" text-anchor="middle">A3S Gateway</text>
    <text x="946" y="775" fill="#eff7f1" text-anchor="middle">Exact healthy endpoint</text>
  </g>
  <path d="M338 768h166M696 768h138" fill="none" stroke="#f2c66d" stroke-width="2.5" marker-end="url(#arrow-amber)"/>
  <path d="M1032 456v56H220v66" fill="none" stroke="#67b7ff" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow-blue)"/>
  <path d="M169 648v42H600v66" fill="none" stroke="#67b7ff" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow-blue)"/>

  <text x="48" y="828" fill="#70857a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">TARGET ARCHITECTURE / ROADMAP GATES DECIDE AVAILABILITY</text>
  <text x="1152" y="828" fill="#70857a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" text-anchor="end">ACL-ONLY / VERSIONED / FAIL-CLOSED</text>
</svg>
