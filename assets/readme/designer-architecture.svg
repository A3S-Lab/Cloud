    <path d="M512 216H531" stroke="#6ca3ff" stroke-width="3" marker-end="url(#arrow-blue)"/>
    <path d="M804 238H785" stroke="#ad87ff" stroke-width="3" marker-end="url(#arrow-purple)"/>

    <text x="58" y="329" fill="#8c83ff" font-family="'Cascadia Mono', Consolas, ui-monospace, monospace" font-size="17" font-weight="700" letter-spacing="1.5">EMBEDDABLE ENGINE</text>
    <rect x="58" y="347" width="1084" height="174" rx="16" fill="#151720" stroke="#3a3d48"/>

    <g transform="translate(76 371)">
      <rect width="230" height="116" rx="12" fill="#111d32" stroke="#2864e8" stroke-width="2"/>
      <text x="18" y="32" fill="#6ca3ff" font-family="'Cascadia Mono', Consolas, ui-monospace, monospace" font-size="17" font-weight="700">STANDALONE HOST</text>
      <text x="18" y="62" fill="#f2f3f5" font-size="19" font-weight="700">API + worker</text>
      <text x="18" y="85" fill="#a4a8b2" font-size="17">install + Compose</text>
      <text x="18" y="106" fill="#a4a8b2" font-size="17">current composition</text>
    </g>

    <g transform="translate(348 371)">
      <rect width="250" height="116" rx="12" fill="#16172a" stroke="#8c83ff" stroke-width="2" stroke-dasharray="7 6"/>
      <text x="18" y="32" fill="#8c83ff" font-family="'Cascadia Mono', Consolas, ui-monospace, monospace" font-size="17" font-weight="700">WORKFLOW CORE</text>
      <text x="18" y="62" fill="#f2f3f5" font-size="19" font-weight="700">domain + application</text>
      <text x="18" y="85" fill="#a4a8b2" font-size="17">graph + run semantics</text>
      <text x="18" y="106" fill="#a4a8b2" font-size="17">host-neutral ports</text>
    </g>

    <g transform="translate(640 371)">
      <rect width="220" height="116" rx="12" fill="#1b1530" stroke="#ad87ff" stroke-width="2" stroke-dasharray="7 6"/>
      <text x="18" y="32" fill="#ad87ff" font-family="'Cascadia Mono', Consolas, ui-monospace, monospace" font-size="17" font-weight="700">CLOUD MODULE</text>
      <text x="18" y="62" fill="#f2f3f5" font-size="19" font-weight="700">A3S Boot + CQRS</text>
      <text x="18" y="85" fill="#a4a8b2" font-size="17">guards + controllers</text>
      <text x="18" y="106" fill="#a4a8b2" font-size="17">no service hop</text>
    </g>

    <g transform="translate(902 371)">
      <rect width="222" height="116" rx="12" fill="#171820" stroke="#5420bd" stroke-width="2"/>
      <text x="18" y="32" fill="#ad87ff" font-family="'Cascadia Mono', Consolas, ui-monospace, monospace" font-size="17" font-weight="700">A3S CLOUD</text>
      <text x="18" y="62" fill="#f2f3f5" font-size="19" font-weight="700">tenant + policy</text>
      <text x="18" y="85" fill="#a4a8b2" font-size="17">operations + fleet</text>
      <text x="18" y="106" fill="#a4a8b2" font-size="17">secret + artifact</text>
    </g>

    <path d="M306 429H336" stroke="#6ca3ff" stroke-width="3" marker-end="url(#arrow-blue)"/>
    <path d="M640 412H610" stroke="#ad87ff" stroke-width="3" marker-end="url(#arrow-purple)"/>
    <path d="M902 448H872" stroke="#ad87ff" stroke-width="3" marker-end="url(#arrow-purple)"/>
    <path d="M397 262V315H473V359" fill="none" stroke="#6ca3ff" stroke-width="3" marker-end="url(#arrow-blue)"/>
    <text x="486" y="322" fill="#a4a8b2" font-family="'Cascadia Mono', Consolas, ui-monospace, monospace" font-size="16">publish / run</text>

    <text x="58" y="567" fill="#ad87ff" font-family="'Cascadia Mono', Consolas, ui-monospace, monospace" font-size="17" font-weight="700" letter-spacing="1.5">HOST-PROVIDED DURABILITY + EXECUTION</text>
    <rect x="58" y="585" width="1084" height="135" rx="16" fill="#151720" stroke="#3a3d48"/>

    <g transform="translate(76 606)">
      <rect width="190" height="90" rx="12" fill="#15182d" stroke="#3b53dc" stroke-width="2"/>
      <text x="18" y="34" fill="#8c83ff" font-family="'Cascadia Mono', Consolas, ui-monospace, monospace" font-size="17" font-weight="700">A3S FLOW</text>
      <text x="18" y="64" fill="#f2f3f5" font-size="19" font-weight="700">schedule + resume</text>
    </g>

    <g transform="translate(294 606)">
      <rect width="190" height="90" rx="12" fill="#171820" stroke="#3a3d48" stroke-width="2"/>
      <text x="18" y="34" fill="#a4a8b2" font-family="'Cascadia Mono', Consolas, ui-monospace, monospace" font-size="17" font-weight="700">POSTGRESQL</text>
      <text x="18" y="64" fill="#f2f3f5" font-size="19" font-weight="700">truth + outbox</text>
