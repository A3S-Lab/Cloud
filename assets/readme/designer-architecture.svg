<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">A3S Workflow composable target architecture</title>
  <desc id="desc">A controlled Designer and versioned Node Descriptor feed one reusable Workflow core. The current standalone host and target A3S Cloud module compose that core with host-provided Flow, PostgreSQL, execution, and Runtime services. A3S Form supplies configuration definitions, while standard and A3S Code Agentic nodes run as Runtime units.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="760" gradientUnits="userSpaceOnUse">
      <stop stop-color="#101118"/>
      <stop offset="1" stop-color="#171329"/>
    </linearGradient>
    <linearGradient id="brand" x1="58" y1="0" x2="1142" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2587f5"/>
      <stop offset="0.54" stop-color="#3b53dc"/>
      <stop offset="1" stop-color="#7137d8"/>
    </linearGradient>
    <marker id="arrow-blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L9 4.5L0 9Z" fill="#6ca3ff"/>
    </marker>
    <marker id="arrow-purple" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L9 4.5L0 9Z" fill="#ad87ff"/>
    </marker>
    <marker id="arrow-muted" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L9 4.5L0 9Z" fill="#707581"/>
    </marker>
  </defs>

  <rect width="1200" height="760" rx="24" fill="url(#background)"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <text x="58" y="52" fill="#f2f3f5" font-size="36" font-weight="740">One engine core. Two hosts. No duplicate control plane.</text>
    <text x="58" y="87" fill="#a4a8b2" font-family="'Cascadia Mono', Consolas, ui-monospace, monospace" font-size="17" font-weight="700" letter-spacing="1.1">STUDIO / CLOUD WEB -> SAME GRAPH CORE -> INJECTED FLOW + POSTGRES + RUNTIME</text>

    <g transform="translate(880 107)">
      <rect width="18" height="18" rx="4" fill="#171820" stroke="#6ca3ff" stroke-width="2"/>
      <text x="28" y="16" fill="#a4a8b2" font-size="17">available</text>
      <rect x="134" width="18" height="18" rx="4" fill="#171820" stroke="#ad87ff" stroke-width="2" stroke-dasharray="6 5"/>
      <text x="162" y="16" fill="#a4a8b2" font-size="17">target</text>
    </g>

    <text x="58" y="130" fill="#6ca3ff" font-family="'Cascadia Mono', Consolas, ui-monospace, monospace" font-size="17" font-weight="700" letter-spacing="1.5">AUTHORING CONTRACTS</text>
    <rect x="58" y="148" width="1084" height="135" rx="16" fill="#151720" stroke="#3a3d48"/>

    <g transform="translate(76 170)">
      <rect width="175" height="92" rx="12" fill="#171820" stroke="#2864e8" stroke-width="2"/>
      <text x="18" y="33" fill="#6ca3ff" font-family="'Cascadia Mono', Consolas, ui-monospace, monospace" font-size="17" font-weight="700">HOSTS</text>
      <text x="18" y="62" fill="#f2f3f5" font-size="19" font-weight="700">Studio / Cloud</text>
      <text x="18" y="84" fill="#a4a8b2" font-size="17">CLI + Skill</text>
    </g>

    <g transform="translate(282 170)">
      <rect width="230" height="92" rx="12" fill="#16172a" stroke="#6ca3ff" stroke-width="2" stroke-dasharray="7 6"/>
      <text x="18" y="33" fill="#6ca3ff" font-family="'Cascadia Mono', Consolas, ui-monospace, monospace" font-size="17" font-weight="700">DESIGNER SDK</text>
      <text x="18" y="62" fill="#f2f3f5" font-size="19" font-weight="700">Controlled graph</text>
      <text x="18" y="84" fill="#a4a8b2" font-size="17">patches + projections</text>
    </g>

    <g transform="translate(543 170)">
      <rect width="230" height="92" rx="12" fill="#16172a" stroke="#8c83ff" stroke-width="2" stroke-dasharray="7 6"/>
      <text x="18" y="33" fill="#8c83ff" font-family="'Cascadia Mono', Consolas, ui-monospace, monospace" font-size="17" font-weight="700">NODE DESCRIPTOR</text>
      <text x="18" y="62" fill="#f2f3f5" font-size="19" font-weight="700">ports + UI + policy</text>
      <text x="18" y="84" fill="#a4a8b2" font-size="17">version + digest</text>
    </g>

    <g transform="translate(804 170)">
      <rect width="320" height="92" rx="12" fill="#1b1530" stroke="#ad87ff" stroke-width="2" stroke-dasharray="7 6"/>
      <text x="18" y="33" fill="#ad87ff" font-family="'Cascadia Mono', Consolas, ui-monospace, monospace" font-size="17" font-weight="700">A3S FORM</text>
      <text x="18" y="62" fill="#f2f3f5" font-size="19" font-weight="700">Schema + UI definition</text>
      <text x="18" y="84" fill="#a4a8b2" font-size="17">independent, host-controlled</text>
    </g>

