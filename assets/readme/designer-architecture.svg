      <text x="18" y="34" fill="#6ca3ff" font-family="'Cascadia Mono', Consolas, ui-monospace, monospace" font-size="17" font-weight="700">RUNTIME POOLS</text>
      <text x="18" y="64" fill="#f2f3f5" font-size="19" font-weight="700">CPU / GPU / box</text>
