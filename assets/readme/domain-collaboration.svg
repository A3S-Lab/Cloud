<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
  <title id="title">A3S Cloud aggregate and context collaboration</title>
  <desc id="desc">Tenant scope, product intent, owner application ports, durable Flow coordination, Workloads and Fleet execution, the target a3s-runtime named-stateful capability profile, provider implementation, Edge and Gateway applied state, Data storage, and the transactional Outbox event rail.</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#67b7ff"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#b7f56a"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#f2c66d"/></marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#8fa298"/></marker>
  </defs>

  <rect width="1200" height="780" rx="24" fill="#0a0f0c"/>
  <rect x="1" y="1" width="1198" height="778" rx="23" fill="none" stroke="#2d4035" stroke-width="2"/>
  <text x="48" y="54" fill="#f4faf6" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="34" font-weight="760">Aggregates collaborate through ports, correlation and facts.</text>
  <text x="48" y="84" fill="#8fa298" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">COMMANDS MOVE TOWARD THE OWNER; EVIDENCE RETURNS WITH AN EXACT GENERATION</text>

  <!-- Tenant scope -->
  <rect x="48" y="110" width="1104" height="92" rx="13" fill="#0e1712" stroke="#26382e"/>
  <text x="68" y="137" fill="#67b7ff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700">TENANT SCOPE</text>
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="20" font-weight="700">
    <rect x="190" y="130" width="190" height="50" rx="9" fill="#101812" stroke="#3e6e8d"/>
    <text x="285" y="162" fill="#eff7f1" text-anchor="middle">Organization</text>
    <rect x="450" y="130" width="190" height="50" rx="9" fill="#101812" stroke="#3e6e8d"/>
    <text x="545" y="162" fill="#eff7f1" text-anchor="middle">Project</text>
    <rect x="710" y="130" width="190" height="50" rx="9" fill="#101812" stroke="#3e6e8d"/>
    <text x="805" y="162" fill="#eff7f1" text-anchor="middle">Environment</text>
  </g>
  <path d="M380 155h70M640 155h70" fill="none" stroke="#67b7ff" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="1128" y="162" fill="#8fa298" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" text-anchor="end">TENANT-FENCED</text>

  <!-- Product semantics -->
  <rect x="48" y="222" width="1104" height="132" rx="13" fill="#0e1712" stroke="#26382e"/>
  <text x="68" y="249" fill="#b7f56a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700">PRODUCT INTENT / IMMUTABLE REVISIONS</text>
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif">
    <g transform="translate(72 270)">
      <rect width="190" height="60" rx="9" fill="#101812" stroke="#719b46"/>
      <text x="14" y="26" fill="#eff7f1" font-size="20" font-weight="700">Apps / Workflow</text>
      <text x="14" y="49" fill="#a9bbb0" font-size="18">Release · Run</text>
    </g>
    <g transform="translate(276 270)">
      <rect width="220" height="60" rx="9" fill="#101812" stroke="#719b46"/>
      <text x="14" y="26" fill="#eff7f1" font-size="20" font-weight="700">Agents / Connectors</text>
      <text x="14" y="49" fill="#a9bbb0" font-size="18">Execution · Attempt</text>
    </g>
    <g transform="translate(510 270)">
      <rect width="180" height="60" rx="9" fill="#101812" stroke="#719b46"/>
      <text x="14" y="26" fill="#eff7f1" font-size="20" font-weight="700">Durable Cells</text>
      <text x="14" y="49" fill="#a9bbb0" font-size="18">Application · Revision</text>
    </g>
    <g transform="translate(704 270)">
      <rect width="180" height="60" rx="9" fill="#101812" stroke="#3e6e8d"/>
      <text x="14" y="26" fill="#eff7f1" font-size="20" font-weight="700">Sources / P0</text>
      <text x="14" y="49" fill="#a9bbb0" font-size="18">Revision · BuildPlan</text>
    </g>
    <g transform="translate(898 270)">
      <rect width="230" height="60" rx="9" fill="#101812" stroke="#3e6e8d"/>
      <text x="14" y="26" fill="#eff7f1" font-size="20" font-weight="700">Artifacts</text>
      <text x="14" y="49" fill="#a9bbb0" font-size="18">BuildRun · Provenance</text>
    </g>
  </g>

  <!-- Port rail -->
  <path d="M167 330v42M386 330v42M600 330v42M794 330v42M1013 330v42" fill="none" stroke="#67b7ff" stroke-width="2"/>
  <rect x="72" y="372" width="1056" height="52" rx="10" fill="#102036" stroke="#3e6e8d" stroke-width="1.5"/>
  <text x="600" y="404" fill="#86c9ff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" font-weight="700" text-anchor="middle">OWNER APPLICATION PORTS  ·  TYPED IDS  ·  EXACT REVISION / DIGEST  ·  NO TABLE SHARING</text>

  <!-- Coordination and execution -->
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif">
    <rect x="72" y="464" width="196" height="86" rx="11" fill="#101812" stroke="#806f39" stroke-width="1.5"/>
    <text x="90" y="495" fill="#eff7f1" font-size="20" font-weight="700">Flow + Operations</text>
    <text x="90" y="524" fill="#c2b995" font-size="18">replay · wait · recovery</text>

    <rect x="302" y="464" width="166" height="86" rx="11" fill="#101812" stroke="#806f39" stroke-width="1.5"/>
    <text x="320" y="495" fill="#eff7f1" font-size="20" font-weight="700">Executions</text>
    <text x="320" y="524" fill="#c2b995" font-size="18">finite Task</text>

    <rect x="502" y="464" width="166" height="86" rx="11" fill="#101812" stroke="#806f39" stroke-width="1.5"/>
    <text x="520" y="495" fill="#eff7f1" font-size="20" font-weight="700">Workloads</text>
    <text x="520" y="524" fill="#c2b995" font-size="18">Service · rollout</text>

    <rect x="702" y="464" width="166" height="86" rx="11" fill="#101812" stroke="#806f39" stroke-width="1.5"/>
    <text x="720" y="495" fill="#eff7f1" font-size="20" font-weight="700">Fleet</text>
    <text x="720" y="524" fill="#c2b995" font-size="18">Claim · command</text>

    <rect x="902" y="464" width="226" height="86" rx="11" fill="#101812" stroke="#806f39" stroke-width="1.5"/>
    <text x="920" y="495" fill="#eff7f1" font-size="20" font-weight="700">Data / S0 + Edge</text>
    <text x="920" y="524" fill="#c2b995" font-size="18">storage · route intent</text>
  </g>

  <path d="M170 424v40M385 424v40M585 424v40M785 424v40M1015 424v40" fill="none" stroke="#67b7ff" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <path d="M268 507h34M468 507h34M668 507h34" fill="none" stroke="#b7f56a" stroke-width="2.5" marker-end="url(#arrow-green)"/>

  <!-- Applied mechanisms -->
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif">
    <rect x="272" y="576" width="250" height="70" rx="11" fill="#0d1720" stroke="#3e6e8d" stroke-dasharray="6 5"/>
    <text x="397" y="606" fill="#eff7f1" font-size="20" font-weight="700" text-anchor="middle">a3s-runtime</text>
    <text x="397" y="631" fill="#67b7ff" font-size="18" text-anchor="middle">Service + target profile</text>
    <rect x="542" y="576" width="220" height="70" rx="11" fill="#0d1720" stroke="#3e6e8d" stroke-dasharray="6 5"/>
    <text x="652" y="606" fill="#eff7f1" font-size="20" font-weight="700" text-anchor="middle">Box + Cell provider</text>
    <text x="652" y="631" fill="#67b7ff" font-size="18" text-anchor="middle">state · alarm · activation</text>
    <rect x="782" y="576" width="160" height="70" rx="11" fill="#0d1720" stroke="#3e6e8d" stroke-dasharray="6 5"/>
    <text x="862" y="606" fill="#eff7f1" font-size="20" font-weight="700" text-anchor="middle">Gateway</text>
    <text x="862" y="631" fill="#67b7ff" font-size="18" text-anchor="middle">snapshot</text>
    <rect x="962" y="576" width="166" height="70" rx="11" fill="#0d1720" stroke="#53665b" stroke-dasharray="6 5"/>
    <text x="1045" y="606" fill="#eff7f1" font-size="20" font-weight="700" text-anchor="middle">S0 namespace</text>
    <text x="1045" y="631" fill="#9eb0a6" font-size="18" text-anchor="middle">durable bytes</text>
  </g>
  <path d="M785 550v14H397v12" fill="none" stroke="#b7f56a" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <path d="M522 611h20" fill="none" stroke="#67b7ff" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <path d="M1015 550v13H862v13M1015 563h30v13" fill="none" stroke="#8fa298" stroke-width="2.5" marker-end="url(#arrow-gray)"/>
  <path d="M397 646v18h465v-18" fill="none" stroke="#f2c66d" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="630" y="688" fill="#f2c66d" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" text-anchor="middle">EXACT GENERATION EVIDENCE RETURNS TO THE OWNER</text>

  <!-- Event rail -->
  <rect x="48" y="704" width="1104" height="52" rx="10" fill="#17160f" stroke="#806f39"/>
  <g fill="#f2c66d" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700">
    <text x="72" y="737">OWNER TRANSACTION</text>
    <text x="366" y="737">OUTBOX</text>
    <text x="568" y="737">A3S EVENT</text>
    <text x="812" y="737">NOTIFICATIONS / SEARCH / AUDIT</text>
  </g>
  <path d="M282 730h58M438 730h104M692 730h94" fill="none" stroke="#f2c66d" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow-amber)"/>
</svg>
