<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1040" viewBox="0 0 1200 1040" role="img" aria-labelledby="title desc">
  <title id="title">A3S Cloud bounded-context ownership map</title>
  <desc id="desc">A detailed map of current and target A3S Cloud bounded contexts grouped into governance, supply, product semantics, coordination and execution, and read projections. Dashed green boxes are target contexts. Durable Cells owns named stateful-service intent, while Data and S0 own general stateful storage.</desc>

  <rect width="1200" height="1040" rx="24" fill="#0a0f0c"/>
  <rect x="1" y="1" width="1198" height="1038" rx="23" fill="none" stroke="#2d4035" stroke-width="2"/>

  <text x="48" y="54" fill="#f4faf6" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="34" font-weight="760">Bounded contexts own decisions, not layers of a shared model.</text>
  <text x="48" y="86" fill="#8fa298" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">EACH BOX OWNS ITS AGGREGATES; COLLABORATION CROSSES TYPED PORTS OR COMMITTED FACTS</text>

