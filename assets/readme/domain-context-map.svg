    <line x1="48" y1="705" x2="174" y2="705" stroke="#806f39" stroke-width="2"/>
    <text x="48" y="875" fill="#9eb0a6">FACTS + READS</text>
    <line x1="48" y1="887" x2="174" y2="887" stroke="#53665b" stroke-width="2"/>
