<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="980" viewBox="0 0 1200 980" role="img" aria-labelledby="title desc">
  <title id="title">A3S Cloud Files domain model and interface boundaries</title>
  <desc id="desc">The Files bounded context exposes metadata lifecycle operations through REST, client, CLI, and Management MCP. One application service coordinates one UserFile aggregate, one metadata repository port, and one streaming immutable-object port. PostgreSQL commits metadata, organization quota, Outbox, audit, and idempotency in one transaction. Immutable bytes remain in the shared object authority. There is no Files-specific uploader, provider configuration, scanner state store, cleanup queue, or second lifecycle.</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#67b7ff"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#b7f56a"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#f2c66d"/></marker>
  </defs>

  <rect width="1200" height="980" rx="24" fill="#0a0f0c"/>
  <rect x="1" y="1" width="1198" height="978" rx="23" fill="none" stroke="#2d4035" stroke-width="2"/>
  <text x="48" y="54" fill="#f4faf6" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="34" font-weight="760">One file lifecycle. One transaction. Shared byte authority.</text>
  <text x="48" y="86" fill="#8fa298" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">FILES / DDD / ACL-FIRST / INTERFACE BOUNDARIES / NO DUPLICATE MECHANISMS</text>

  <!-- Inbound adapters -->
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif">
    <rect x="48" y="138" width="190" height="244" rx="14" fill="#0d1720" stroke="#3e6e8d"/>
    <text x="68" y="170" fill="#67b7ff" font-size="18" font-weight="700">INBOUND</text>
    <text x="68" y="207" fill="#eff7f1" font-size="20" font-weight="700">REST / OpenAPI</text>
    <text x="68" y="239" fill="#eff7f1" font-size="20" font-weight="700">TypeScript / CLI</text>
    <text x="68" y="271" fill="#eff7f1" font-size="20" font-weight="700">Management MCP</text>
    <text x="68" y="310" fill="#9fb2a8" font-size="18">cloud:read</text>
    <text x="68" y="338" fill="#9fb2a8" font-size="18">file:write</text>
    <text x="68" y="366" fill="#9fb2a8" font-size="18">JSON metadata only</text>
  </g>

  <!-- Files bounded context -->
  <rect x="270" y="118" width="680" height="712" rx="18" fill="#0e1712" stroke="#719b46" stroke-width="2"/>
  <rect x="292" y="105" width="222" height="28" rx="6" fill="#0a0f0c"/>
  <text x="304" y="126" fill="#b7f56a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700">FILES BOUNDED CONTEXT</text>

  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif">
    <rect x="298" y="150" width="624" height="66" rx="10" fill="#101812" stroke="#3e6e8d"/>
    <text x="320" y="178" fill="#eff7f1" font-size="21" font-weight="700">Presentation</text>
    <text x="320" y="202" fill="#9fb2a8" font-size="18">reserve / list / get / tombstone / organization quota</text>

    <rect x="298" y="240" width="624" height="96" rx="10" fill="#101812" stroke="#719b46"/>
    <text x="320" y="269" fill="#eff7f1" font-size="21" font-weight="700">Application / UserFileApplicationService</text>
    <text x="320" y="298" fill="#d7ff9f" font-size="18">authorize before replay; parse canonical A3S ACL; enforce bounds</text>
    <text x="320" y="323" fill="#d7ff9f" font-size="18">dispatch commands and queries through inward interfaces only</text>

    <rect x="298" y="360" width="624" height="230" rx="10" fill="#172118" stroke="#b7f56a" stroke-width="2"/>
    <text x="320" y="390" fill="#eff7f1" font-size="21" font-weight="700">Domain / UserFile aggregate</text>
    <text x="320" y="420" fill="#9fb2a8" font-size="18">cloud.user-file.v1 = identity + logical object ref + digest + size + policy</text>

    <rect x="322" y="448" width="130" height="42" rx="9" fill="#0d1720" stroke="#3e6e8d"/>
    <text x="338" y="475" fill="#eff7f1" font-size="17" font-weight="700">awaiting_upload</text>
    <rect x="494" y="448" width="126" height="42" rx="9" fill="#0d1720" stroke="#3e6e8d"/>
    <text x="511" y="475" fill="#eff7f1" font-size="17" font-weight="700">awaiting_scan</text>
    <rect x="662" y="421" width="112" height="42" rx="9" fill="#172a1a" stroke="#719b46"/>
    <text x="684" y="448" fill="#d7ff9f" font-size="17" font-weight="700">admitted</text>
    <rect x="662" y="475" width="112" height="42" rx="9" fill="#2a2014" stroke="#806f39"/>
    <text x="684" y="502" fill="#f2d99d" font-size="17" font-weight="700">rejected</text>
    <rect x="322" y="526" width="130" height="42" rx="9" fill="#20181a" stroke="#76515b"/>
    <text x="354" y="553" fill="#e6b8c1" font-size="17" font-weight="700">expired</text>
    <rect x="806" y="448" width="92" height="42" rx="9" fill="#20181a" stroke="#76515b"/>
    <text x="816" y="475" fill="#e6b8c1" font-size="17" font-weight="700">tombstoned</text>

    <path d="M452 469h42M620 469h34M774 469h24M387 490v28" fill="none" stroke="#b7f56a" stroke-width="2" marker-end="url(#arrow-green)"/>
    <path d="M620 469h24v-27h10M620 469h34v27" fill="none" stroke="#b7f56a" stroke-width="2" marker-end="url(#arrow-green)"/>
    <text x="455" y="443" fill="#9fb2a8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">write receipt</text>
    <text x="610" y="443" fill="#9fb2a8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">scan receipt</text>
    <text x="787" y="443" fill="#9fb2a8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">any live</text>
    <text x="340" y="516" fill="#9fb2a8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">deadline</text>
    <text x="322" y="581" fill="#9fb2a8" font-size="17">quota: reserve at creation; release only on expiry or tombstone</text>

    <rect x="298" y="614" width="300" height="188" rx="10" fill="#101812" stroke="#719b46"/>
    <text x="320" y="644" fill="#eff7f1" font-size="21" font-weight="700">Inward ports</text>
    <text x="320" y="677" fill="#d7ff9f" font-size="18">IUserFileRepository</text>
    <text x="320" y="704" fill="#9fb2a8" font-size="17">aggregate + quota transaction</text>
    <text x="320" y="740" fill="#d7ff9f" font-size="18">IUserFileObjectStore</text>
    <text x="320" y="767" fill="#9fb2a8" font-size="17">AsyncRead put + exact verify</text>

    <rect x="622" y="614" width="300" height="188" rx="10" fill="#17160f" stroke="#806f39"/>
    <text x="644" y="644" fill="#eff7f1" font-size="21" font-weight="700">Infrastructure adapters</text>
    <text x="644" y="677" fill="#f2d99d" font-size="18">PostgresUserFileRepository</text>
    <text x="644" y="704" fill="#9fb2a8" font-size="17">one atomic persistence boundary</text>
    <text x="644" y="740" fill="#f2d99d" font-size="18">SharedUserFileObjectStore</text>
    <text x="644" y="767" fill="#9fb2a8" font-size="17">shared client / user-files namespace</text>
  </g>

  <!-- Shared authorities -->
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif">
    <rect x="980" y="138" width="172" height="250" rx="14" fill="#17160f" stroke="#806f39"/>
    <text x="998" y="170" fill="#f2c66d" font-size="17" font-weight="700">POSTGRESQL</text>
    <text x="998" y="208" fill="#eff7f1" font-size="16" font-weight="700">UserFile metadata</text>
    <text x="998" y="238" fill="#eff7f1" font-size="16" font-weight="700">Organization quota</text>
    <text x="998" y="268" fill="#eff7f1" font-size="16" font-weight="700">Idempotency</text>
    <text x="998" y="298" fill="#eff7f1" font-size="16" font-weight="700">Audit</text>
    <text x="998" y="328" fill="#eff7f1" font-size="16" font-weight="700">Outbox event</text>
    <text x="998" y="366" fill="#9fb2a8" font-size="17">single transaction</text>

    <rect x="980" y="424" width="172" height="178" rx="14" fill="#0d1720" stroke="#3e6e8d"/>
    <text x="998" y="456" fill="#67b7ff" font-size="16" font-weight="700">IMMUTABLE OBJECTS</text>
    <text x="998" y="494" fill="#eff7f1" font-size="16" font-weight="700">shared root</text>
    <text x="998" y="524" fill="#eff7f1" font-size="16" font-weight="700">provider-neutral key</text>
    <text x="998" y="554" fill="#eff7f1" font-size="16" font-weight="700">verified digest/size</text>
    <text x="998" y="584" fill="#9fb2a8" font-size="17">bytes never enter DB</text>
  </g>

  <!-- Collaboration arrows -->
  <path d="M238 258h60" fill="none" stroke="#67b7ff" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <path d="M610 216v24M610 336v24M610 590v24" fill="none" stroke="#b7f56a" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <path d="M922 704h34v-441h24" fill="none" stroke="#f2c66d" stroke-width="2.5" marker-end="url(#arrow-amber)"/>
  <path d="M922 754h46v-241h12" fill="none" stroke="#67b7ff" stroke-width="2.5" marker-end="url(#arrow-blue)"/>

  <!-- Invariants -->
  <rect x="48" y="858" width="1104" height="88" rx="12" fill="#101812" stroke="#53665b"/>
  <text x="70" y="890" fill="#eff7f1" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="20" font-weight="700">Lifecycle invariant:</text>
  <text x="250" y="890" fill="#b7f56a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17">METADATA + QUOTA + OUTBOX + AUDIT + IDEMPOTENCY COMMIT TOGETHER</text>
  <text x="70" y="922" fill="#9fb2a8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17">NO PUBLIC BINARY ROUTE / FILES-SPECIFIC PROVIDER / SCANNER STORE / CLEANUP QUEUE / SECOND UPLOAD AGGREGATE</text>
</svg>
