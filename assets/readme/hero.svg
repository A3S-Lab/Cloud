<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">A3S Cloud turns intent into exact applied state</title>
  <desc id="desc">A self-hosted Cloud control plane with one durable loop from PostgreSQL commit through Flow, Workloads, Fleet, Runtime, Box, and Gateway evidence.</desc>

  <rect width="1200" height="420" rx="24" fill="#0a0f0c"/>
  <rect x="1" y="1" width="1198" height="418" rx="23" fill="none" stroke="#2d4035" stroke-width="2"/>

  <g transform="translate(56 45)">
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M5 24h26a9 9 0 0 0 1.5-17.8A15 15 0 0 0 3.9 3.4 11 11 0 0 0 5 24Z" stroke="#b7f56a" stroke-width="2.4"/>
      <path d="m10 16 8-8 8 8M18 8v13" stroke="#67b7ff" stroke-width="2.2"/>
    </g>
    <text x="48" y="10" fill="#eff7f1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700" letter-spacing="2.4">A3S CLOUD</text>
    <text x="48" y="34" fill="#8fa298" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" letter-spacing="1.5">SELF-HOSTED CONTROL PLANE</text>
  </g>

  <g transform="translate(56 118)">
    <text x="0" y="56" fill="#f4faf6" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="66" font-weight="760" letter-spacing="-2.5">Intent becomes</text>
    <text x="0" y="126" fill="#b7f56a" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="66" font-weight="760" letter-spacing="-2.5">exact applied state.</text>
    <text x="3" y="174" fill="#b9c7bf" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="21">Applications, Agents, MCP, Workflows, and model services</text>
    <text x="3" y="205" fill="#b9c7bf" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="21">on infrastructure you own.</text>

    <g transform="translate(0 240)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="700">
      <rect width="148" height="42" rx="8" fill="#111a14" stroke="#344b3c"/>
      <text x="74" y="27" fill="#d7ff9f" text-anchor="middle">ACL-NATIVE</text>
      <rect x="162" width="182" height="42" rx="8" fill="#111a14" stroke="#344b3c"/>
      <text x="253" y="27" fill="#d7ff9f" text-anchor="middle">ONE AUTHORITY</text>
      <rect x="358" width="176" height="42" rx="8" fill="#111a14" stroke="#344b3c"/>
      <text x="446" y="27" fill="#d7ff9f" text-anchor="middle">FAIL-CLOSED</text>
    </g>
  </g>

  <g transform="translate(684 36)">
    <rect width="460" height="348" rx="18" fill="#101812" stroke="#344b3c" stroke-width="1.5"/>
    <text x="26" y="34" fill="#8fa298" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="700" letter-spacing="1.5">ONE DURABLE CONTROL LOOP</text>
    <line x1="26" y1="51" x2="434" y2="51" stroke="#2d4035"/>

    <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">
      <circle cx="44" cy="91" r="16" fill="#14261d" stroke="#67b7ff" stroke-width="2"/>
      <text x="44" y="98" fill="#67b7ff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700" text-anchor="middle">1</text>
      <text x="76" y="86" fill="#eff7f1" font-size="21" font-weight="700">Commit intent</text>
      <text x="76" y="111" fill="#96a99e" font-size="18">PostgreSQL + A3S ORM</text>

      <circle cx="44" cy="157" r="16" fill="#14261d" stroke="#67b7ff" stroke-width="2"/>
      <text x="44" y="164" fill="#67b7ff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700" text-anchor="middle">2</text>
      <text x="76" y="152" fill="#eff7f1" font-size="21" font-weight="700">Coordinate work</text>
      <text x="76" y="177" fill="#96a99e" font-size="18">Flow + Operations</text>

      <circle cx="44" cy="223" r="16" fill="#14261d" stroke="#67b7ff" stroke-width="2"/>
      <text x="44" y="230" fill="#67b7ff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700" text-anchor="middle">3</text>
      <text x="76" y="218" fill="#eff7f1" font-size="21" font-weight="700">Converge nodes</text>
      <text x="76" y="243" fill="#96a99e" font-size="18">Workloads + Fleet</text>

      <circle cx="44" cy="289" r="16" fill="#1d2b17" stroke="#b7f56a" stroke-width="2"/>
      <text x="44" y="296" fill="#b7f56a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700" text-anchor="middle">4</text>
      <text x="76" y="284" fill="#eff7f1" font-size="21" font-weight="700">Apply exact state</text>
      <text x="76" y="309" fill="#96a99e" font-size="18">Runtime + Box + Gateway</text>
    </g>

    <path d="M44 107v34M44 173v34M44 239v34" fill="none" stroke="#67b7ff" stroke-width="2" stroke-dasharray="5 5"/>
    <path d="M418 290v35H44v-20" fill="none" stroke="#b7f56a" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="404" y="339" fill="#b7f56a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="700" text-anchor="end">EXACT EVIDENCE RETURNS</text>
  </g>
</svg>
