<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">A3S Cloud — Agent-first services on one governed runtime</title>
  <desc id="desc">A3S Cloud composes Agent, Workflow, Function, Durable Cell, inference, and Web product semantics through A3S Flow, A3S Runtime Task and Service, A3S Box, and A3S Gateway on operator-owned CPU and GPU infrastructure.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#142019"/>
      <stop offset="1" stop-color="#0d1510"/>
    </linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#213128" stroke-width="1" opacity=".42"/>
    </pattern>
  </defs>

  <rect width="1200" height="460" rx="24" fill="#0a0f0c"/>
  <rect x="1" y="1" width="1198" height="458" rx="23" fill="none" stroke="#2d4035" stroke-width="2"/>
  <rect x="1" y="1" width="1198" height="458" rx="23" fill="url(#grid)"/>

  <g transform="translate(54 44)">
    <path d="M4 23h29a10 10 0 0 0 1-19.9A16 16 0 0 0 4.2 1.8 12 12 0 0 0 4 23Z" fill="none" stroke="#b7f56a" stroke-width="2.5" stroke-linecap="round"/>
    <path d="m11 15 8-8 8 8M19 7v13" fill="none" stroke="#67b7ff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="49" y="11" fill="#f4faf6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" font-weight="700" letter-spacing="2.8">A3S CLOUD</text>
    <text x="49" y="36" fill="#8fa298" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="700" letter-spacing="1.8">AGENT-FIRST DEVELOPER PLATFORM</text>
  </g>

  <g transform="translate(54 118)" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">
    <text x="0" y="58" fill="#f4faf6" font-size="54" font-weight="760" letter-spacing="-2.2">Agent-first services.</text>
    <text x="0" y="124" fill="#b7f56a" font-size="54" font-weight="760" letter-spacing="-2.2">One governed runtime.</text>
    <text x="2" y="169" fill="#b4c3ba" font-size="21">Flow coordinates durable work. Gateway owns public traffic.</text>
    <text x="2" y="199" fill="#b4c3ba" font-size="21">Runtime runs on Box across infrastructure you own.</text>

    <g transform="translate(0 235)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="700" text-anchor="middle">
      <rect width="92" height="42" rx="8" fill="#132019" stroke="#3b5543"/>
      <text x="46" y="27" fill="#d8ffa3">AaaS</text>
      <rect x="104" width="92" height="42" rx="8" fill="#132019" stroke="#3b5543"/>
      <text x="150" y="27" fill="#d8ffa3">WaaS</text>
      <rect x="208" width="92" height="42" rx="8" fill="#132019" stroke="#3b5543"/>
      <text x="254" y="27" fill="#d8ffa3">FaaS</text>
      <rect x="312" width="156" height="42" rx="8" fill="#132019" stroke="#3b5543"/>
      <text x="390" y="27" fill="#d8ffa3">DURABLE CELL</text>
    </g>
    <text x="2" y="310" fill="#8fa298" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="700" letter-spacing="1.4">MULTI-TENANT · API-FIRST · SELF-HOSTED</text>
  </g>

  <g transform="translate(665 34)">
    <rect width="481" height="392" rx="18" fill="url(#panel)" stroke="#344b3c" stroke-width="1.5"/>
    <text x="25" y="35" fill="#8fa298" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="700" letter-spacing="1.8">ONE EXECUTION SUBSTRATE</text>
    <line x1="25" y1="51" x2="456" y2="51" stroke="#2d4035"/>

    <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="20" font-weight="700" text-anchor="middle">
      <rect x="25" y="68" width="132" height="44" rx="8" fill="#102036" stroke="#3c79aa"/>
      <text x="91" y="96" fill="#86c9ff">Agents</text>
      <rect x="174" y="68" width="132" height="44" rx="8" fill="#102036" stroke="#3c79aa"/>
      <text x="240" y="96" fill="#86c9ff">Workflow</text>
      <rect x="323" y="68" width="132" height="44" rx="8" fill="#102036" stroke="#3c79aa"/>
      <text x="389" y="96" fill="#86c9ff">Functions</text>
      <rect x="25" y="123" width="132" height="44" rx="8" fill="#102036" stroke="#3c79aa"/>
      <text x="91" y="151" fill="#86c9ff">Cells</text>
      <rect x="174" y="123" width="132" height="44" rx="8" fill="#102036" stroke="#3c79aa"/>
      <text x="240" y="151" fill="#86c9ff">Inference</text>
      <rect x="323" y="123" width="132" height="44" rx="8" fill="#102036" stroke="#3c79aa"/>
      <text x="389" y="151" fill="#86c9ff">Web</text>
    </g>

    <path d="M240 167v24" fill="none" stroke="#67b7ff" stroke-width="2"/>
    <path d="M232 184l8 8 8-8" fill="none" stroke="#67b7ff" stroke-width="2" stroke-linecap="round"/>

    <rect x="25" y="196" width="430" height="70" rx="10" fill="#172319" stroke="#789d4c" stroke-width="1.8"/>
    <text x="45" y="225" fill="#f4faf6" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="23" font-weight="750">A3S Runtime</text>
    <text x="431" y="225" fill="#b7f56a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700" text-anchor="end">TASK / SERVICE</text>
    <text x="45" y="251" fill="#9fb1a6" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="18">identity · lifecycle · endpoints · evidence</text>

    <path d="M240 266v22" fill="none" stroke="#b7f56a" stroke-width="2"/>
    <path d="M232 281l8 8 8-8" fill="none" stroke="#b7f56a" stroke-width="2" stroke-linecap="round"/>

    <rect x="25" y="293" width="430" height="74" rx="10" fill="#111a14" stroke="#3f5748"/>
    <text x="45" y="324" fill="#f4faf6" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="23" font-weight="750">A3S Box</text>
    <text x="431" y="324" fill="#9fb1a6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700" text-anchor="end">PROVIDERS</text>
    <text x="45" y="351" fill="#67b7ff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">CPU · GPU · EXTERNAL FAAS</text>
  </g>
</svg>
