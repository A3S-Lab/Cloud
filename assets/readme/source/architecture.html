<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>A3S Cloud architecture</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; padding: 32px; background: #07100b; display: grid; place-items: center; }
      svg { width: min(1200px, 100%); height: auto; }
    </style>
  </head>
  <body>
    <svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
      <title id="title">A3S Cloud single-authority architecture</title>
      <desc id="desc">Management surfaces commit intent to one Cloud control plane and PostgreSQL authority. Flow and Workloads drive one outbound execution path through Fleet, Node Agent, A3S Runtime, A3S Box, and A3S OCI Runtime. A3S Gateway keeps live request bytes off the Cloud control path.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#8fa298" />
        </marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#b7f56a" />
        </marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#67b7ff" />
        </marker>
      </defs>

      <rect width="1200" height="760" rx="8" fill="#0a0f0c" />

      <text x="48" y="52" fill="#8fa298" font-family="'Geist Mono', ui-monospace, monospace" font-size="16" font-weight="600" letter-spacing="2.4">A3S CLOUD / SYSTEM ARCHITECTURE</text>
      <text x="48" y="96" fill="#f4faf6" font-family="'Instrument Serif', Georgia, serif" font-size="40">One authority. Three paths.</text>
      <text x="48" y="128" fill="#a8b8af" font-family="'Geist', system-ui, sans-serif" font-size="20">Intent is durable, execution is outbound, and request bytes stay off the control plane.</text>

      <!-- Zones: background first. -->
      <rect x="48" y="168" width="1104" height="144" rx="8" fill="#0e1712" stroke="#26382e" stroke-width="1" />
      <rect x="64" y="180" width="164" height="24" rx="4" fill="#0a0f0c" />
      <text x="76" y="197" fill="#6f8378" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="600" letter-spacing="1.6">CONTROL AUTHORITY</text>

      <rect x="48" y="336" width="1104" height="168" rx="8" fill="#0e1712" stroke="#26382e" stroke-width="1" />
      <rect x="64" y="348" width="156" height="24" rx="4" fill="#0a0f0c" />
      <text x="76" y="365" fill="#6f8378" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="600" letter-spacing="1.6">DURABLE CONTROL</text>

      <rect x="48" y="528" width="1104" height="160" rx="8" fill="#0e1712" stroke="#26382e" stroke-width="1" />
      <rect x="64" y="540" width="176" height="24" rx="4" fill="#0a0f0c" />
      <text x="76" y="557" fill="#6f8378" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="600" letter-spacing="1.6">NODE + REQUEST PATHS</text>

      <!-- Connectors before nodes. -->
      <path d="M292 252 H412" fill="none" stroke="#8fa298" stroke-width="2" marker-end="url(#arrow)" />
      <path d="M740 252 H860" fill="none" stroke="#8fa298" stroke-width="2" marker-end="url(#arrow)" />
      <path d="M520 292 V328 H216 V392" fill="none" stroke="#8fa298" stroke-width="2" marker-end="url(#arrow)" />
      <path d="M336 436 H472" fill="none" stroke="#8fa298" stroke-width="2" marker-end="url(#arrow)" />
      <path d="M712 436 H784" fill="none" stroke="#8fa298" stroke-width="2" marker-end="url(#arrow)" />
      <path d="M552 480 V536 H748 V576" fill="none" stroke="#b7f56a" stroke-width="2" marker-end="url(#arrow-accent)" />
      <path d="M696 616 H516" fill="none" stroke="#b7f56a" stroke-width="2" marker-end="url(#arrow-accent)" />
      <path d="M852 576 V516 H648 V480" fill="none" stroke="#b7f56a" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrow-accent)" />
      <path d="M1072 480 V576" fill="none" stroke="#67b7ff" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrow-link)" />
      <path d="M1032 640 H944 V672 H246 V656" fill="none" stroke="#67b7ff" stroke-width="2" marker-end="url(#arrow-link)" />

      <!-- Arrow labels with visible connector margins. -->
      <rect x="320" y="220" width="64" height="20" rx="4" fill="#0e1712" />
      <text x="352" y="235" fill="#7f9288" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" text-anchor="middle">INTENT</text>
      <rect x="768" y="220" width="64" height="20" rx="4" fill="#0e1712" />
      <text x="800" y="235" fill="#7f9288" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" text-anchor="middle">COMMIT</text>
      <rect x="580" y="508" width="92" height="20" rx="4" fill="#0e1712" />
      <text x="626" y="523" fill="#9bd05d" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" text-anchor="middle">COMMAND</text>
      <rect x="536" y="628" width="124" height="20" rx="4" fill="#0e1712" />
      <text x="598" y="643" fill="#9bd05d" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" text-anchor="middle">APPLY UNIT</text>
      <rect x="1080" y="512" width="72" height="20" rx="4" fill="#0e1712" />
      <text x="1116" y="527" fill="#67b7ff" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" text-anchor="middle">SNAPSHOT</text>
      <rect x="600" y="644" width="96" height="20" rx="4" fill="#0e1712" />
      <text x="648" y="659" fill="#67b7ff" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" text-anchor="middle">REQUESTS</text>

      <!-- Control authority nodes. -->
      <rect x="80" y="212" width="212" height="80" rx="6" fill="#121c16" stroke="#53665b" stroke-width="1" />
      <text x="96" y="240" fill="#f4faf6" font-family="'Geist', system-ui, sans-serif" font-size="20" font-weight="600">Product surfaces</text>
      <text x="96" y="268" fill="#8fa298" font-family="'Geist Mono', ui-monospace, monospace" font-size="16">REST · CLI · MCP · Web</text>

      <rect x="412" y="204" width="328" height="88" rx="6" fill="#172118" stroke="#b7f56a" stroke-width="2" />
      <rect x="428" y="216" width="60" height="20" rx="4" fill="#22301f" stroke="#719b46" stroke-width="1" />
      <text x="458" y="231" fill="#b7f56a" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="600" text-anchor="middle">FOCAL</text>
      <text x="428" y="264" fill="#f4faf6" font-family="'Geist', system-ui, sans-serif" font-size="24" font-weight="600">A3S Cloud control plane</text>
      <text x="428" y="284" fill="#9dafA5" font-family="'Geist Mono', ui-monospace, monospace" font-size="16">identity · policy · desired state · audit</text>

      <rect x="860" y="212" width="260" height="80" rx="6" fill="#111914" stroke="#53665b" stroke-width="1" />
      <text x="876" y="240" fill="#f4faf6" font-family="'Geist', system-ui, sans-serif" font-size="20" font-weight="600">PostgreSQL authority</text>
      <text x="876" y="268" fill="#8fa298" font-family="'Geist Mono', ui-monospace, monospace" font-size="16">ORM · Outbox · projections</text>

      <!-- Durable control nodes. -->
      <rect x="96" y="392" width="240" height="88" rx="6" fill="#121c16" stroke="#53665b" stroke-width="1" />
      <text x="112" y="424" fill="#f4faf6" font-family="'Geist', system-ui, sans-serif" font-size="20" font-weight="600">Flow + Operations</text>
      <text x="112" y="452" fill="#8fa298" font-family="'Geist Mono', ui-monospace, monospace" font-size="16">replay · leases · recovery</text>

      <rect x="472" y="392" width="240" height="88" rx="6" fill="#121c16" stroke="#53665b" stroke-width="1" />
      <text x="488" y="424" fill="#f4faf6" font-family="'Geist', system-ui, sans-serif" font-size="20" font-weight="600">Workloads + Fleet</text>
      <text x="488" y="452" fill="#8fa298" font-family="'Geist Mono', ui-monospace, monospace" font-size="16">placement · claims · rollout</text>

      <rect x="784" y="392" width="344" height="88" rx="6" fill="#121c16" stroke="#53665b" stroke-width="1" />
      <text x="800" y="424" fill="#f4faf6" font-family="'Geist', system-ui, sans-serif" font-size="20" font-weight="600">Edge snapshot planner</text>
      <text x="800" y="452" fill="#8fa298" font-family="'Geist Mono', ui-monospace, monospace" font-size="16">routes · TLS · exact targets · CAS</text>

      <!-- Node and request nodes. -->
      <rect x="96" y="576" width="300" height="80" rx="6" fill="#121c16" stroke="#53665b" stroke-width="1" />
      <text x="112" y="604" fill="#f4faf6" font-family="'Geist', system-ui, sans-serif" font-size="20" font-weight="600">Execution substrate</text>
      <text x="112" y="632" fill="#b7f56a" font-family="'Geist Mono', ui-monospace, monospace" font-size="16">Runtime → Box → OCI Runtime</text>

      <rect x="696" y="576" width="208" height="80" rx="6" fill="#121c16" stroke="#53665b" stroke-width="1" />
      <text x="712" y="604" fill="#f4faf6" font-family="'Geist', system-ui, sans-serif" font-size="20" font-weight="600">Node Agent</text>
      <text x="712" y="632" fill="#8fa298" font-family="'Geist Mono', ui-monospace, monospace" font-size="16">outbound mTLS · journal</text>

      <rect x="1032" y="576" width="88" height="80" rx="6" fill="#102036" stroke="#67b7ff" stroke-width="1" />
      <text x="1076" y="608" fill="#f4faf6" font-family="'Geist', system-ui, sans-serif" font-size="18" font-weight="600" text-anchor="middle">A3S</text>
      <text x="1076" y="632" fill="#67b7ff" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" font-weight="600" text-anchor="middle">GATEWAY</text>

      <line x1="48" y1="716" x2="1152" y2="716" stroke="#26382e" stroke-width="1" />
      <circle cx="64" cy="736" r="4" fill="#8fa298" />
      <text x="80" y="741" fill="#7f9288" font-family="'Geist Mono', ui-monospace, monospace" font-size="12">CONTROL</text>
      <circle cx="188" cy="736" r="4" fill="#b7f56a" />
      <text x="204" y="741" fill="#9bd05d" font-family="'Geist Mono', ui-monospace, monospace" font-size="12">EXECUTION + RECEIPTS</text>
      <circle cx="408" cy="736" r="4" fill="#67b7ff" />
      <text x="424" y="741" fill="#67b7ff" font-family="'Geist Mono', ui-monospace, monospace" font-size="12">LIVE REQUESTS / CLOUD OFF BYTE PATH</text>
      <text x="1152" y="741" fill="#6f8378" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" text-anchor="end">TARGET ARCHITECTURE · ROADMAP GATES DECIDE AVAILABILITY</text>
    </svg>
  </body>
</html>
